# 12/10 review (§4.7): every push runs the test suites that do not need a running Agent Zero, plus the host-script
# tests and a syntax check, so a broken change shows up before it is deployed (implantar.py still tests on the VM).
name: testes

on:
  push:
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências
        run: pip install boto3 cryptography croniter pillow pyyaml aiohttp "flask==3.0.3" python-docx==1.1.2 openpyxl==3.1.5 pypdf==5.1.0 xlrd==2.0.1  # flask: segundo_cerebro gateway suite (same as Agent Zero); docx/openpyxl/pypdf: ler_arquivo (same pins as the Hermes image)
      - name: Pasta /a0/usr vazia (as suítes só usam logins teste_* e pastas temporárias)
        run: sudo mkdir -p /a0/usr && sudo chown -R "$USER" /a0
      - name: Suítes dos plugins
        run: python3 infra/operador/rodar_suites_locais.py
      - name: Testes dos scripts da VM
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python3 infra/vm/tests/test_cofre_ponte.py
          python3 infra/vm/tests/test_saude.py
          python3 infra/vm/tests/test_estabilidade.py
          python3 infra/vm/tests/test_sempre_ligada.py
          python3 infra/vm/tests/test_opencode_tunel.py
          python3 infra/control/tests/test_recuperar.py
          python3 infra/control/tests/test_controle_opencode.py
          python3 infra/vm/tests/test_comandos_ponte.py
          python3 infra/vm/tests/test_bilhete_ponte.py
          python3 infra/vm/tests/test_fila_ponte.py
          python3 infra/vm/tests/test_botao_app.py
          python3 infra/vm/tests/test_citacao_ponte.py
          python3 infra/vm/tests/test_sem_bloqueio.py
          python3 infra/vm/tests/test_proxy.py
          python3 infra/vm/tests/test_rotinas_essenciais.py
          python3 infra/vm/tests/test_despertar.py
          python3 infra/vm/tests/test_gasto.py
          python3 infra/control/tests/test_telegram.py
          python3 infra/vm/tests/test_caixa.py
          python3 infra/vm/tests/test_delegados.py
          python3 infra/vm/tests/test_hermes.py
          python3 infra/vm/tests/test_ponte_a0.py
          python3 infra/vm/tests/test_cofre_hermes.py
          python3 infra/vm/tests/test_acesso_hermes.py
          python3 infra/vm/tests/test_relogio_hermes.py
          python3 infra/vm/tests/test_rotinas_hermes.py
          python3 infra/vm/tests/test_ponte_hermes.py
          python3 infra/vm/tests/test_portal.py
          python3 infra/vm/tests/test_resolver_hermes.py
          python3 infra/vm/tests/test_subagentes_hermes.py
          python3 infra/vm/tests/test_tarefas_hermes.py
          python3 infra/operador/tests/test_segundo_cerebro.py
          python3 infra/operador/tests/test_cache_relatorio.py
          python3 infra/operador/tests/test_calibracao.py
          python3 infra/operador/tests/test_preset_sonnet.py
          python3 infra/operador/tests/test_cerebro_operador.py
          python3 infra/operador/tests/test_falhas_do_dia.py
          python3 infra/operador/tests/test_legado_a0.py
          python3 infra/operador/tests/test_moldes.py
          python3 infra/reels/moldes/motor/test_validar.py
          python3 infra/reels/moldes/motor/test_gerar_foto.py
          python3 infra/reels/moldes/motor/test_audio.py
          python3 infra/reels/moldes/motor/test_voz.py
      - name: Sintaxe
        run: |
          for f in infra/vm/*.sh infra/vm/hermes/*.sh infra/vm/portal/*.sh; do bash -n "$f"; done
          python3 -m py_compile infra/vm/*.py infra/operador/*.py infra/control/*.py
