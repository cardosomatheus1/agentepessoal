# Hermes do Matheus (migração do Agent Zero, docs/MIGRACAO_HERMES.md). Implantado por subir.sh em /opt/hermes/data;
# o que muda aqui muda no git (segredos ficam no .env da VM, fora do git).
model:
  provider: "bedrock"
  default: "us.anthropic.claude-haiku-5-5"   # Matheus 23/10: Haiku no dia a dia, Sonnet só nas difíceis
bedrock:
  region: "us-east-1"
  discovery: false
# A chave de modelo nunca entra no Hermes: o boto3 fala com o nosso proxy (AWS_ENDPOINT_URL_BEDROCK_RUNTIME, ver
# subir.sh), que põe o token do papel da VM, registra o uso e conta como atividade para a hibernação.
timezone: "America/Bahia"
# Skills: as do A0 (/a0/usr/skills) NÃO entram como estão (23/10, "Hermes primeiro"): 19 das 27 mandam usar
# ferramentas do A0 (search_engine, code_execution_tool, o navegador e o celular de lá) e desviariam o Hermes das dele;
# e o Hermes trata external_dirs como só leitura (o curador não melhora nem poda). Fase 3: cópias adaptadas no espaço
# do próprio Hermes, semeadas uma vez (o curador cuida delas depois).
compression:
  enabled: true
# Navegador: as ferramentas próprias do Hermes (browser_navigate/snapshot/click…), não o Browser Use (browser_exec): a
# aprovação antes de clicar e o ensaio só leitura precisam ver cada ação (revisor do A0). Ele liga no nosso Chromium
# logado por BROWSER_CDP_URL (navegador.sh).
browser:
  backend: "off"
# Conectores (fase 3): no container hermes-mcp (mcp.sh), que guarda os tokens; o Hermes só tem o endereço.
# No ensaio o Google é só leitura (Gmail, Agenda, Drive, Docs, Planilhas); o GitHub do A0 já é só leitura.
mcp_servers:
  google:
    url: "http://hermes-mcp:8765/mcp"
    timeout: 120
    connect_timeout: 30
  github:
    url: "http://hermes-mcp:8766/mcp/"
    timeout: 120
    connect_timeout: 30
approvals:
  mode: "smart"
  timeout: 21600   # 6 h para o ok dele chegar pelo celular (como o espera_minutos 360 do A0)
  # Marca do operador para testar o caminho inteiro do ok (evento approval.request -> botões -> resposta) sem nada de risco
  smart_policy: "Always ESCALATE to the human any command that contains the marker APROVACAO_HUMANA_TESTE."
  # Rotina (cron) não tem ninguém para aprovar: no A0 as rotinas rodavam código e scripts livremente (o revisor só
  # olhava navegador e conectores). Aqui é igual (approve), com o piso do próprio Hermes para o catastrófico e a nossa
  # trava de rotina (acesso_hermes.py: nada de apagar/mover dados vivos fora de workdir/tmp, nem cofre, chaves, docker).
  cron_mode: "approve"
# 23/10, Matheus: "E para de pedir permissão, eu to te dando permissão pra fazer as coisas". O que ele teve de aprovar
# hoje foram as conferências do próprio Hermes no terminal: rodar script (heredoc, python -c) e execute_code, que o A0
# rodava sem perguntar (o revisor só olhava comando destrutivo). Esses passam sempre; continuam pedindo o ok o que é de
# fato arriscado (rm -rf, docker/kill, sudo…, pelas regras do Hermes) e o que o revisor manda perguntar (aprovacoes_hermes).
command_allowlist:
  - "shell execution via heredoc"
  - "script execution via heredoc"
  - "script execution via -e/-c flag"
  - "execute_code"
plugins:
  enabled:
    - agentepessoal           # as nossas ferramentas (infra/vm/hermes/plugins/agentepessoal)
  load_timeout_seconds: 60    # 35 ferramentas carregando os helpers grandes (prospecção) na subida
