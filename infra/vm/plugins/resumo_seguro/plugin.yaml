name: resumo_seguro
title: Resumo que não perde detalhes
description: Quando o histórico de uma conversa longa é resumido, o resumo leva junto o que não pode sumir — @ dos leads, acao_id, ids de rotina, links e os arquivos completos em saidas/ —, as últimas falas do usuário literais e onde está o texto inteiro; resumo vazio nunca apaga mensagens.
version: 1.0.0
