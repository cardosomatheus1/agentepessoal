name: memoria_pessoal
title: Memória pessoal
description: Ficha "Sobre você" com teto e proteção (ferramenta ficha), decisões em vigor (não perguntar de novo), revisor depois da conversa, busca nas conversas antigas (lembrar), ficha e anexos próprios em cada conversa, e criação de agentes (projetos) com memória isolada.
version: 1.2.0
