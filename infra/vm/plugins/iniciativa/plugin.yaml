name: iniciativa
title: Iniciativa (o agente que mostra serviço)
description: Algumas vezes ao dia o agente olha tudo o que está acontecendo e, se tiver algo que valha a interrupção, manda por conta própria uma ideia, um trabalho adiantado, uma novidade relevante ou uma conexão — com botões e aprendendo com as reações.
version: 1.0.0
