name: objetivo_vivo
title: Objetivo vivo da conversa
description: No fim do contexto de cada conversa com uma pessoa (celular e app, Matheus e convidados; não nas rotinas), um bloco curto com o pedido atual dela, literal, os passos combinados (feitos e que faltam) e a regra de terminar o pedido inteiro; "continua"/"e aí?" não trocam o objetivo.
version: 1.0.0
