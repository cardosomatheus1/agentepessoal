<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* the photo lives in one frame for scenes 0-1: full bleed hero, then a card with the magnifier over it */
#quadro{position:absolute;left:0;top:0;width:1080px;height:1160px;overflow:hidden}
#quadro img.f{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
#veu{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(transparent,var(--fundo) 88%)}
#veuTopo{position:absolute;left:0;right:0;top:0;height:440px;background:linear-gradient(var(--fundo) 30%,transparent)}
#selo{position:absolute;left:90px;top:1000px;font-size:38px;padding:10px 28px;white-space:nowrap}
#nome{left:90px;width:820px;top:1080px;height:260px;font-size:126px;line-height:1;text-align:left}
#lupa{position:absolute;left:0;top:0;width:300px;height:300px;margin:-150px 0 0 -150px;z-index:5}
#lupa .vid{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:12px solid var(--texto);box-shadow:var(--sombra),inset 0 0 30px rgba(0,0,0,.35);background:var(--fundo2)}
body.e-noite #lupa .vid{border-color:var(--destaque);box-shadow:0 0 40px color-mix(in srgb,var(--destaque) 60%,transparent)}
#lupa .vid img{position:absolute;left:0;top:0;max-width:none}
#lupa .cabo{position:absolute;left:252px;top:252px;width:44px;height:150px;border-radius:22px;background:var(--texto);transform-origin:22px 0;transform:rotate(-45deg)}
#lupa .brilho{position:absolute;left:40px;top:34px;width:90px;height:44px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-30deg)}
#fio{position:absolute;inset:0;z-index:4;overflow:visible;pointer-events:none}
#attrs{position:absolute;left:90px;width:800px;top:1150px}
.at{display:flex;align-items:center;gap:24px;height:100px;margin-bottom:8px}
.at .n{flex:none;width:78px;height:78px;border-radius:50%;background:var(--destaque);color:var(--sobre-destaque);font-size:44px;display:flex;align-items:center;justify-content:center}
.at .tx{flex:1;height:76px;font-size:56px;font-weight:800;line-height:76px;white-space:nowrap}
/* scene 2: price */
#thumbs{position:absolute;left:0;right:0;top:420px;height:320px;display:flex;justify-content:center;gap:28px}
#thumbs div{width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:var(--sombra);border:10px solid var(--cartao)}
body.e-vidro #thumbs div,body.e-noite #thumbs div{border-color:var(--texto)}
#thumbs img{width:100%;height:100%;object-fit:cover}
#pNome{left:90px;width:820px;top:800px;height:130px;font-size:64px;font-weight:800;line-height:1.05}
#preco{left:90px;width:820px;top:950px;height:230px;font-size:210px;line-height:1.08;white-space:nowrap}
#unid{left:90px;width:820px;top:1190px;height:70px;font-size:50px;font-weight:700}
#pLinha{position:absolute;left:340px;top:1172px;width:400px;height:12px;border-radius:6px;background:var(--destaque);transform-origin:50% 50%}
body.f-story #nome,body.f-story #pNome,body.f-story #preco,body.f-story #unid{width:900px}body.f-story #attrs{width:900px}
/* carousel */
.slide #quadro{height:1350px}
.slide #veu{height:620px}
.slide #selo{left:84px;top:900px}
.slide #nome{left:84px;width:912px;top:980px;height:250px;font-size:120px}
.slide .prc{position:absolute;right:84px;top:880px;font-size:54px;padding:14px 34px;white-space:nowrap}
.slide.det .cardF{position:absolute;left:84px;top:130px;width:912px;height:700px;border-radius:40px;overflow:hidden;box-shadow:var(--sombra)}
.slide.det .cardF img.f{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.det .tt{position:absolute;left:84px;right:84px;top:990px;height:76px;font-size:56px}
.slide.det #attrs{left:84px;width:912px;top:1070px}
.slide.det .at{height:64px;margin-bottom:4px}
.slide.det .at .tx{font-size:46px;height:64px;line-height:64px}
.slide.det .at .n{width:64px;height:64px;font-size:38px}
.slide .mini{position:absolute;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;overflow:hidden;border:10px solid var(--texto);box-shadow:var(--sombra);background:var(--fundo2)}
.slide .mini img{position:absolute;max-width:none}
.slide .mini .n{position:absolute;left:50%;margin-left:-30px;top:8px;width:60px;height:60px;border-radius:50%;background:var(--destaque);color:var(--sobre-destaque);font-size:36px;display:flex;align-items:center;justify-content:center;z-index:2}
.slide .fios{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none}
.slide .pino{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--destaque);border:5px solid var(--texto)}
</style></head><body><div id="palco">

<div class="cena" id="cP"><div class="cam full">
 <div id="quadro"><div id="veu"></div><div id="veuTopo"></div></div>
 <div class="chip t seg" id="selo"></div>
 <div class="ctr tit t seg rv" id="nome"></div>
 <svg id="fio" viewBox="0 0 1080 1920"><path id="fioP" fill="none" stroke="var(--destaque)" stroke-width="6" stroke-linecap="round"/><circle id="fioC" r="12" fill="var(--destaque)"/></svg>
 <div id="lupa"><div class="vid"><img id="lupaImg" alt=""><div class="brilho"></div></div><div class="cabo"></div></div>
 <div id="attrs"></div>
</div></div>

<div class="cena" id="cR"><div class="cam full">
 <div id="thumbs"></div>
 <div class="ctr t seg rv" id="pNome"></div>
 <div class="ctr tit t seg" id="preco"></div>
 <div id="pLinha"></div>
 <div class="ctr t t2 seg" id="unid"></div>
</div></div>

</div>
<script src="../motor/motor.js"></script>
<script>
// "Produto em destaque": something that already exists, shown up close. Scenes (and falas): 0 full-bleed photo with
// a slow push and the name, 1 the photo becomes a card and a magnifier visits a detail for each attribute (a line
// ties it to the attribute), 2 the price (only when the ficha has one), last: call (engine's final scene).
const FOCOS = [[0.32, 0.38], [0.66, 0.55], [0.45, 0.72]];
const Z = 2.3, R = 150;
let D = {};
// card the photo becomes in scene 1 (reel/story)
const CARD = { x: 60, y: 400, w: 960, h: 700 };
// x/y of an attribute are a point of ITS photo (fotos[k % n]), in % of the photo; foco() turns it into a point of the
// w x h box the photo fills with object-fit: cover (so the magnifier lands on the detail, not on the bowl next to it)
function foco(F, k, img, w = CARD.w, h = CARD.h) {
  const a = F.atributos[k], px = a.x != null ? a.x / 100 : FOCOS[k][0], py = a.y != null ? a.y / 100 : FOCOS[k][1];
  const nw = (img && img.naturalWidth) || 1080, nh = (img && img.naturalHeight) || 1080, s = Math.max(w / nw, h / nh);
  return [(px * nw * s + (w - nw * s) / 2) / w, (py * nh * s + (h - nh * s) / 2) / h];
}
// place a zoomed copy of img (object-fit: cover inside a w x h box) so point (fx,fy) of the box is at the loupe centre
function zoom(lupaImg, src, w, h, fx, fy, r, z) {
  const nw = src.naturalWidth || 1280, nh = src.naturalHeight || 720, s = Math.max(w / nw, h / nh), ox = (w - nw * s) / 2, oy = (h - nh * s) / 2;
  lupaImg.style.width = nw * s * z + 'px'; lupaImg.style.height = nh * s * z + 'px';
  lupaImg.style.left = r - (fx * w - ox) * z + 'px'; lupaImg.style.top = r - (fy * h - oy) * z + 'px';
}
Motor.molde({
  id: 'produto-semana', formatos: ['reel', 'carrossel', 'story'],
  montar(F, M, $m) {
    const { $, brl } = $m;
    if (F.preco != null && !['dono', 'sistema'].includes((F._origem || {}).preco)) $m.erro('preco: dado real sem origem (_origem: dono ou sistema)');
    D.temPreco = F.preco != null;
    if (F.falas && F.falas.length !== (D.temPreco ? 4 : 3)) $m.erro(`falas: ${D.temPreco ? 4 : 3} (foto e nome, detalhes${D.temPreco ? ', preço' : ''}, chamada)`);
    F.fotos.forEach((f, k) => { const i = document.createElement('img'); i.className = 'f'; i.src = $m.midia(f); i.dataset.k = k; $('#veu').before(i); });
    $('#selo').textContent = F.selo || 'Em destaque';
    $('#nome').textContent = F.nome;
    F.atributos.forEach((a, k) => { const d = document.createElement('div'); d.className = 'at'; d.dataset.k = k;
      d.innerHTML = '<div class="n tit"></div><div class="tx t seg"></div>'; d.querySelector('.n').textContent = k + 1; d.querySelector('.tx').textContent = a.texto; $('#attrs').appendChild(d); });
    if (D.temPreco) {
      F.fotos.forEach(f => { const d = document.createElement('div'); const i = document.createElement('img'); i.src = $m.midia(f); d.appendChild(i); $('#thumbs').appendChild(d); });
      $('#pNome').textContent = F.nome; $('#preco').textContent = brl(F.preco).replace(' ', ' '); $('#unid').textContent = F.unidade || '';
      if (!F.unidade) $('#unid').style.display = 'none';
    } else $('#cR').remove();
    // reading time: 0.8 s + 0.25 s per new word (plus a little air); the magnifier needs at least 1.3 s per detail
    const ler = (...x) => 1.05 + 0.25 * x.join(' ').split(/\s+/).filter(Boolean).length;
    const d = [Math.max(2.4, ler($('#selo').textContent, F.nome)), Math.max(4.6, 0.6 + ler(...F.atributos.map(a => a.texto)))];
    if (D.temPreco) d.push(Math.max(2.4, ler(F.nome, $('#preco').textContent, F.unidade || '')));
    return { duracoes: d };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, lerp, ini } = $m;
    const S1 = ini(1), S2 = ini(2), L1 = S2 - S1;
    $m.cena('#cP', t, 0, 1, { push: 0.02 });
    // which photo: the first on the hero, then the one of the attribute being shown
    const step = Math.max(1.1, (L1 - 0.6) / 3), k = t < S1 + 0.5 ? 0 : Math.min(2, Math.floor((t - S1 - 0.5) / step));
    const nf = F.fotos.length, fk = t < S1 + 0.5 ? 0 : k % nf;
    $$('#quadro img.f').forEach(i => { i.style.opacity = +i.dataset.k === fk ? 1 : 0; });
    // frame: full bleed hero → rounded card
    const c = eio(p(t, S1 - 0.1, 0.7)), q = $('#quadro');
    const x = lerp(0, CARD.x, c), y = lerp(0, CARD.y, c), w = lerp(1080, CARD.w, c), h = lerp(1160, CARD.h, c);
    Object.assign(q.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: 44 * c + 'px', boxShadow: c > 0.5 ? 'var(--sombra)' : 'none' });
    $('#veu').style.opacity = 0; $('#veuTopo').style.opacity = 0;
    // hero: the photo fades out at the top (under the watermark) and at the bottom (under the name) with a mask, so it
    // melts into any background (gradient, bokeh, paper) without a seam; the mask opens up as it becomes a card
    const fd = 1 - c, mk = `linear-gradient(transparent 0, #000 ${380 * fd}px, #000 ${h - 560 * fd}px, transparent ${h - 40 * fd}px)`;
    q.style.maskImage = q.style.webkitMaskImage = fd > 0.001 ? mk : 'none';
    const img = $(`#quadro img.f[data-k="${fk}"]`);
    // hero push toward the first detail
    const [f0x, f0y] = foco(F, 0, $('#quadro img.f[data-k="0"]'), 1080, 1160), pz = t < S1 ? 1.05 + 0.25 * eio(p(t, 0, S1)) : 1;
    img.style.transformOrigin = `${f0x * 100}% ${f0y * 100}%`; img.style.transform = `scale(${pz})`;
    $m.entra('#selo', t, 0.3, 0.4, 30); $m.revela('#nome', t, 0.5, 0.08);
    const hs = 1 - eo(p(t, S1 - 0.2, 0.3)); $('#selo').style.opacity = Math.min(hs, eo5(p(t, 0.3, 0.4))); $('#nome').style.opacity = hs;
    // magnifier: glides from one detail to the next, zooming the photo under it
    const vis = t >= S1 + 0.45;
    $('#lupa').style.opacity = vis ? eo(p(t, S1 + 0.45, 0.3)) : 0; $('#fio').style.opacity = vis ? 1 : 0;
    if (vis) {
      const ta = t - S1 - 0.5, kk = Math.min(2, Math.max(0, Math.floor(ta / step))), mv = eio(p(ta - kk * step, 0, 0.5));
      const ka = Math.max(0, kk - (mv < 1 && kk > 0 ? 1 : 0)), fi = j => $(`#quadro img.f[data-k="${j % nf}"]`);
      const a = foco(F, ka, fi(ka)), b = foco(F, kk, fi(kk)), m = kk === 0 ? 1 : mv;
      const fx = lerp(a[0], b[0], m), fy = lerp(a[1], b[1], m);
      // the loupe stays inside the photo card (it never covers the list); it still magnifies the exact point
      const lx = Math.min(CARD.x + CARD.w - 150, Math.max(CARD.x + 150, CARD.x + fx * CARD.w)), ly = Math.min(CARD.y + CARD.h - 150, Math.max(CARD.y + 150, CARD.y + fy * CARD.h));
      const pop = eb(p(t, S1 + 0.45, 0.5));
      $('#lupa').style.left = lx + 'px'; $('#lupa').style.top = ly + 'px'; $('#lupa').style.transform = `scale(${0.4 + 0.6 * pop})`;
      const li = $('#lupaImg'); if (li.getAttribute('src') !== img.getAttribute('src')) li.src = img.getAttribute('src');
      zoom(li, img, CARD.w, CARD.h, fx, fy, R - 12, Z);
      // line from the magnifier to the attribute it explains
      const ty = 1150 + kk * 108 + 50 + 6, tx0 = 90 + 39;
      const d = `M ${lx} ${ly + 130} C ${lx} ${1150}, ${60} ${1100}, ${60} ${1160} L 60 ${ty - 6} L ${tx0 - 40} ${ty - 6}`;
      $('#fioP').setAttribute('d', d); const L = $('#fioP').getTotalLength(), dr = eo(p(ta - kk * step, 0.35, 0.4));
      $('#fioP').setAttribute('stroke-dasharray', `${L * dr} ${L}`); $('#fioC').setAttribute('cx', tx0 - 40); $('#fioC').setAttribute('cy', ty - 6); $('#fioC').style.opacity = dr;
    }
    $$('#attrs .at').forEach(d => { const j = +d.dataset.k, a0 = S1 + 0.5 + j * step + 0.45, qq = eo5(p(t, a0, 0.45));
      d.style.opacity = t < a0 ? 0 : j === k ? qq : 0.6; d.style.transform = `translateX(${(1 - qq) * 80}px)`; });
    // 2: price
    if (D.temPreco) { $m.cena('#cR', t, 2);
      $$('#thumbs div').forEach((d, j) => { const qq = eb(p(t, S2 + 0.1 + j * 0.12, 0.5)); d.style.opacity = cl(qq * 2); d.style.transform = `scale(${0.6 + 0.4 * qq}) rotate(${(j - (nf - 1) / 2) * 6 * qq}deg)`; });
      $m.revela('#pNome', t, S2 + 0.3);
      const pr = eo5(p(t, S2 + 0.6, 0.6)); $('#preco').style.opacity = pr; $('#preco').style.transform = `translateY(${(1 - pr) * 60}px)`; $('#preco').style.letterSpacing = `${(1 - pr) * 0.2}em`;
      $('#pLinha').style.transform = `scaleX(${eo(p(t, S2 + 1.0, 0.5))})`;
      $m.entra('#unid', t, S2 + 1.2, 0.4, 20); }
  },
  slides(F, M, $m) {
    const { brl } = $m, palco = $m.$('#palco');
    if (F.preco != null && !['dono', 'sistema'].includes((F._origem || {}).preco)) $m.erro('preco: dado real sem origem (_origem: dono ou sistema)');
    $m.$$('.cena', palco).forEach(c => c.remove());
    // 1: hero with name (and price)
    const s1 = document.createElement('div'); s1.className = 'slide';
    s1.innerHTML = '<div id="quadro"><img class="f" alt=""><div id="veu"></div></div><div class="chip t seg" id="selo"></div><div class="ctr tit t seg" id="nome"></div>';
    s1.querySelector('img').src = $m.midia(F.fotos[0]); s1.querySelector('img').style.opacity = 1;
    s1.querySelector('#selo').textContent = F.selo || 'Em destaque'; s1.querySelector('#nome').textContent = F.nome;
    if (F.preco != null) { const c = document.createElement('div'); c.className = 'prc chip t seg'; c.textContent = brl(F.preco).replace(' ', ' ') + (F.unidade ? ' ' + F.unidade : ''); s1.appendChild(c); }
    palco.appendChild(s1);
    // 2: the details, three magnifiers pinned on the photo
    const s2 = document.createElement('div'); s2.className = 'slide det';
    s2.innerHTML = '<div class="cardF"><img class="f" alt=""></div><div class="tt tit t seg">Repara nos detalhes</div><div id="attrs"></div>';
    const fimg = s2.querySelector('.cardF img'); fimg.src = $m.midia(F.fotos[0]);
    const W = 912, Hh = 700, X = 84, Y = 130;
    const nf = F.fotos.length, P = [];
    // the three loupes sit in a row on the bottom edge of the photo, in the left-to-right order of their points, each
    // tied to its point by a line, so they never pile up on one another
    s2.insertAdjacentHTML('beforeend', '<svg class="fios" viewBox="0 0 1080 1350"></svg>');
    const arruma = () => { if (P.filter(Boolean).length < F.atributos.length) return;
      const ord = P.map((q, k) => [q[0], k]).sort((a, b) => a[0] - b[0]).map(x => x[1]), sv = s2.querySelector('.fios'); sv.innerHTML = '';
      ord.forEach((k, j) => { const mx = X + W * (0.18 + 0.32 * j), my = Y + Hh - 30, mi = s2.querySelectorAll('.mini')[k];
        mi.style.left = mx + 'px'; mi.style.top = my + 'px';
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); Object.entries({ x1: P[k][0], y1: P[k][1], x2: mx, y2: my - 125, stroke: 'var(--texto)', 'stroke-width': 5, 'stroke-linecap': 'round' }).forEach(([a, b]) => l.setAttribute(a, b)); sv.appendChild(l); }); };
    F.atributos.forEach((a, k) => {
      const mi = document.createElement('div'); mi.className = 'mini'; const im = document.createElement('img'); im.src = $m.midia(F.fotos[k % nf]); mi.appendChild(im);
      const n = document.createElement('div'); n.className = 'n tit'; n.textContent = k + 1; mi.appendChild(n);
      const pin = document.createElement('div'); pin.className = 'pino'; if (k % nf) pin.style.display = 'none';
      s2.append(pin, mi);
      // placed once the photo is loaded (the point depends on its size); the loupes sit beside their point
      const go = () => { const [fx, fy] = foco(F, k, im, W, Hh); P[k] = [X + fx * W, Y + fy * Hh];
        pin.style.left = P[k][0] + 'px'; pin.style.top = P[k][1] + 'px'; zoom(im, im, W, Hh, fx, fy, 115, Z); arruma(); };
      if (im.complete && im.naturalWidth) go(); else im.addEventListener('load', go);
      const d = document.createElement('div'); d.className = 'at'; d.innerHTML = '<div class="n tit"></div><div class="tx t seg"></div>'; d.querySelector('.n').textContent = k + 1; d.querySelector('.tx').textContent = a.texto; s2.querySelector('#attrs').appendChild(d);
    });
    palco.appendChild(s2);
  },
});
</script></body></html>
