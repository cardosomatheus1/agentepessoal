<script>
// "Data especial": the business calendar of the year. The template knows each date (Easter by computus, Mother's

// passed (reference: ficha._hoje, default today) or that falls after the date, and counts the days left.
const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);

const DATAS = {
  maes: { nome: 'Dia das Mães', ic: 'coracao', mot: 'coracao', quando: y => nDomingo(y, 4, 2) },
  pais: { nome: 'Dia dos Pais', ic: 'presente', mot: 'estrela', quando: y => nDomingo(y, 7, 2) },
  namorados: { nome: 'Dia dos Namorados', ic: 'coracao', mot: 'coracao', quando: y => new Date(y, 5, 12) },
  pascoa: { nome: 'Páscoa', ic: 'presente', mot: 'ovo', quando: pascoa },
  carnaval: { nome: 'Carnaval', ic: 'brilho', mot: 'confete', quando: y => { const p = pascoa(y); return new Date(y, p.getMonth(), p.getDate() - 47); } },
  mulher: { nome: 'Dia da Mulher', ic: 'coracao', mot: 'folha', quando: y => new Date(y, 2, 8) },
  consumidor: { nome: 'Dia do Consumidor', ic: 'etiqueta', mot: 'etiqueta', quando: y => new Date(y, 2, 15) },
  'sao-joao': { nome: 'São João', ic: 'fogo', mot: 'bandeira', quando: y => new Date(y, 5, 24) },
  avos: { nome: 'Dia dos Avós', ic: 'coracao', mot: 'coracao', quando: y => new Date(y, 6, 26) },
  cliente: { nome: 'Dia do Cliente', ic: 'estrela', mot: 'estrela', quando: y => new Date(y, 8, 15) },
  criancas: { nome: 'Dia das Crianças', ic: 'brilho', mot: 'balao', quando: y => new Date(y, 9, 12) },
  professores: { nome: 'Dia dos Professores', ic: 'estrela', mot: 'estrela', quando: y => new Date(y, 9, 15) },
  'black-friday': { nome: 'Black Friday', ic: 'etiqueta', mot: 'etiqueta', quando: y => { const d = new Date(y, 10, 1), q = 1 + (4 - d.getDay() + 7) % 7 + 21; return new Date(y, 10, q + 1); } },
  natal: { nome: 'Natal', ic: 'estrela', mot: 'neve', quando: y => new Date(y, 11, 25) },
  'ano-novo': { nome: 'Ano Novo', ic: 'brilho', mot: 'brilho', quando: y => new Date(y, 11, 31) },

// motif shapes (24x24 boxes) in the brand colors
const FORMAS = {
  coracao: c => `<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6-8 11-8 11z" fill="${c}"/>`,
  estrela: c => `<path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.2 1.3-6.6L2.5 9l6.6-.8z" fill="${c}"/>`,
  ovo: c => `<ellipse cx="12" cy="12.5" rx="7.5" ry="10" fill="${c}"/><path d="M5 10q3.5-2 7 0t7 0M4.6 14.5q3.7 2 7.4 0t7.4 0" stroke="var(--fundo)" stroke-width="1.6" fill="none" opacity=".6"/>`,
  confete: c => `<rect x="7" y="3" width="10" height="18" rx="2" fill="${c}"/>`,
  folha: c => `<path d="M5 19C5 10 10 5 20 4c0 10-5 15-15 15z" fill="${c}"/>`,
  etiqueta: c => `<path d="M3 12V4h8l10 10-8 8z" fill="${c}"/><circle cx="7.5" cy="8.5" r="1.6" fill="var(--fundo)"/>`,
  bandeira: c => `<path d="M2 3h20l-10 18z" fill="${c}"/>`,
  balao: c => `<ellipse cx="12" cy="9" rx="7" ry="8.5" fill="${c}"/><path d="M12 17.5q-2 3 1 6" stroke="${c}" stroke-width="1.2" fill="none"/>`,
  neve: c => `<g stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></g>`,
  brilho: c => `<path d="M12 1l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z" fill="${c}"/>`,

let D = {};
function calcular(F, $m) {
  const hoje = F._hoje || iso(new Date()), E = DATAS[F.data];

  if (F.prazo > quando) $m.erro(`o prazo (${ddmm(F.prazo)}) é depois da data (${ddmm(quando)})`);
  if (dias(hoje, quando) > 90) $m.erro(`${E.nome} só em ${ddmm(quando)}: cedo demais para este post`);

const faltaTxt = n => n === 0 ? 'último dia: hoje' : n === 1 ? 'falta 1 dia' : `faltam ${n} dias`;

  f.innerHTML = '<div class="mb"><div class="t"></div></div><div class="dn tit t"></div><div class="ds t"></div>';

  return f;
}
function cartaoItem(it, $m, w, h) {
  const c = document.createElement('div'); c.className = 'gc'; c.style.width = w + 'px';
  c.innerHTML = '<div class="ph"><img alt=""><i class="fita"></i></div><div class="nm t seg"></div>';
  c.querySelector('.ph').style.height = h + 'px'; c.querySelector('img').src = $m.midia(it.foto); c.querySelector('.nm').textContent = it.nome;
  if (it.preco != null) { const p = document.createElement('span'); p.className = 'pr chip t seg'; p.textContent = $m.brl(it.preco); c.appendChild(p); }
  return c;
}
function motivos(cont, mot, n, W, H, $m, foraDe) {
  const cores = ['var(--destaque)', 'var(--c2)', 'var(--c1)'];
  let h = ''; for (let i = 0; i < n; i++) { const s = 40 + $m.rnd(i * 2.3) * 70; let x = $m.rnd(i * 4.1) * W, y = $m.rnd(i * 7.9) * H;
    if (foraDe && foraDe(x, y)) continue;
    h += `<svg viewBox="0 0 24 24" data-i="${i}" data-x="${x}" data-y="${y}" width="${s}" height="${s}" style="opacity:${0.35 + $m.rnd(i) * 0.5}">${FORMAS[mot](cores[i % 3])}</svg>`; }
  cont.innerHTML = h;
}
Motor.molde({
  id: 'data-especial', formatos: ['reel', 'story', 'carrossel'],
  montar(F, M, $m) {
    const { $, $$ } = $m, C = D = calcular(F, $m), reel = $m.FORMATO === 'reel';

    $m.filmagem($('#bg'), F.fundo || F.itens[0].foto, 0);
    $('#emb').innerHTML = $m.icone(C.E.ic); $('#tema').textContent = F.titulo || C.E.nome;
    const q = dt(C.quando); $('#quandoT').textContent = `${DIAS[q.getDay()]}, ${q.getDate()} de ${MESES[q.getMonth()]}`;
    $('#c1T').textContent = F.subtitulo || 'Pra encomendar'; $('#c1S').textContent = 'feitos sob encomenda para a data';
    if (F.descricao) $('#c1S').textContent = F.descricao;
    const n = F.itens.length, larg = reel ? 790 : 900, gap = 20, w = Math.floor((larg - gap * (n - 1)) / n), x0 = reel ? 90 : 90;
    F.itens.forEach((it, k) => { const c = cartaoItem(it, $m, w, n === 3 ? Math.round(w * 1.42) : Math.round(w * 1.12)); c.style.left = (x0 + k * (w + gap)) + 'px'; c.dataset.k = k; c.dataset.r = (k - (n - 1) / 2) * (n === 3 ? 4 : 3); $('#gcs').appendChild(c); });
    // calendar pages from today to the deadline (at most 8, evenly spaced)
    const tot = C.falta, np = Math.min(tot, 7), pags = [];
    for (let i = 0; i <= np; i++) { const d = dt(C.hoje); d.setDate(d.getDate() + Math.round(tot * i / Math.max(1, np))); pags.push(iso(d)); }
    D.pags = pags.reverse(); D.pags.forEach((s, i) => { const f = folha(s); f.dataset.i = i; f.style.zIndex = 10 + i; $('#fls').appendChild(f); });
    $('#c2T').textContent = 'Encomendas até';
    $('#falta').textContent = faltaTxt(C.falta);
    $('#falta2').textContent = `para garantir o seu no ${C.E.nome}`.replace('no Páscoa', 'na Páscoa').replace('no Black', 'na Black');
    $('#pIc').innerHTML = $m.icone(F.icone || 'chat'); $('#pTx').textContent = F.como_pedir; $('#pAteT').textContent = 'pedidos ' + ateTxt(F.prazo);
    $('#nota').textContent = F.nota || '';
    if (reel) $$('#tema,#c1T,#c1S,#pTx').forEach(e => { e.style.right = '170px'; });
    return { duracoes: [2.6, 3.3, 3.3, 2.4] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, ini, fim, rnd } = $m;

    $('#motivo').style.opacity = forte * fimV;
    $$('#motivo svg').forEach(s => { const i = +s.dataset.i, x = +s.dataset.x + Math.sin(t * (0.6 + rnd(i) * 0.8) + i) * 30, y0 = +s.dataset.y;
      const y = ((y0 + t * (40 + rnd(i * 3) * 70)) % 2050) - 100; s.style.transform = `translate(${x}px,${y}px) rotate(${Math.sin(t + i) * 25}deg)`; });
    // 0: theme
    $m.cena('#c0', t, 0); $m.filmagem($('#bg'), F.fundo || F.itens[0].foto, t);
    const e0 = el(p(t, 0.1, 1.0)); $('#emb').style.transform = `scale(${e0}) rotate(${(1 - e0) * -40}deg)`; $('#emb').style.opacity = cl(e0 * 3);
    $m.revela('#tema', t, 0.35, 0.1); const qc = eb(p(t, 1.1, 0.5)); $('#quando').style.opacity = cl(qc * 2); $('#quando').style.transform = `scale(${0.6 + 0.4 * qc})`;
    // 1: fan of cards
    const a1 = ini(1); $m.cena('#c1', t, 1); $m.revela('#c1T', t, a1 + 0.1); $m.entra('#c1S', t, a1 + 0.45, 0.5, 20);
    $$('.gc').forEach(c => { const k = +c.dataset.k, q = eo5(p(t, a1 + 0.35 + k * 0.22, 0.75)), r = +c.dataset.r;
      c.style.opacity = cl(q * 2); c.style.transform = `translateY(${(1 - q) * 700 + Math.abs(r) * 6}px) rotate(${r * q + (1 - q) * r * 4}deg)`; });
