<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo kallaway -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* ---- kallaway kit: aurora bloom from below, dot grid, glass hairline, glow (all from brand tokens) ---- */
.aura{position:absolute;inset:0;pointer-events:none}
.aura .bloom{position:absolute;left:-25%;right:-25%;bottom:-28%;height:70%;transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 62%,color-mix(in srgb,var(--destaque) 40%,transparent) 0%,color-mix(in srgb,var(--destaque) 12%,transparent) 46%,transparent 76%)}
.aura .pontos{position:absolute;inset:-60px;background-image:radial-gradient(circle,color-mix(in srgb,var(--texto) 15%,transparent) 1.7px,transparent 2.3px);background-size:46px 46px;
  -webkit-mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%)}
body.e-claro .aura .bloom,body.e-papel .aura .bloom{opacity:.55}
body.e-pop .aura .bloom{opacity:.35}
body.e-vidro .vid,body.e-noite .vid{box-shadow:var(--sombra),inset 0 1.5px 0 color-mix(in srgb,var(--texto) 24%,transparent)}
body.e-vidro .glow,body.e-noite .glow{text-shadow:0 0 26px color-mix(in srgb,var(--destaque) 55%,transparent)}
.kick{font-size:32px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);white-space:nowrap;line-height:50px}
.kick .pt{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--destaque);margin-right:18px;vertical-align:2px;box-shadow:0 0 16px var(--destaque)}
/* ad close: the product with its real photo */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
body.e-vidro .pvf,body.e-noite .pvf{box-shadow:var(--sombra),0 0 0 2px color-mix(in srgb,var(--destaque) 70%,transparent),0 0 60px color-mix(in srgb,var(--destaque) 35%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1058px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}


/* ---- scene 0: title over a wireframe pyramid that draws itself ---- */
#k0{position:absolute;left:90px;top:400px;width:820px;height:50px}
#tit0{position:absolute;left:90px;width:830px;top:470px;height:420px;font-size:96px}
#fio{position:absolute;left:240px;width:600px;top:960px;height:460px;overflow:visible}
#fio path{fill:none;stroke:var(--destaque);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
#fio .base{stroke-width:6}
body.e-vidro #fio,body.e-noite #fio{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--destaque) 70%,transparent))}

/* ---- scene 1: the pyramid built from the base up, labels on the side ---- */
#tit1{position:absolute;left:90px;width:830px;top:392px;height:130px;font-size:56px}
#pir{position:absolute;inset:0;transform-origin:300px 600px}
.lv{position:absolute;left:0;width:1080px}
.lv .lj{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--destaque) 34%,var(--cartao)),color-mix(in srgb,var(--destaque) 14%,var(--cartao)));border-top:2px solid color-mix(in srgb,var(--destaque) 70%,transparent)}
body.e-pop .lv .lj{background:var(--fundo2);border-top:6px solid var(--texto)}
.lv.topo .lj{background:linear-gradient(180deg,var(--destaque),color-mix(in srgb,var(--destaque) 70%,var(--fundo)))}
.lv .nu{position:absolute;width:120px;height:70px;font-size:56px;line-height:70px;text-align:center;color:var(--texto)}
.lv.topo .nu{color:var(--sobre-destaque)}
.lv .lig{position:absolute;height:0;border-top:3px dashed color-mix(in srgb,var(--destaque) 75%,transparent);transform-origin:0 50%}
.lv .no{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--destaque);box-shadow:0 0 18px var(--destaque)}
.lv .rot{position:absolute;left:585px;width:330px}
.lv .rot .nm{width:330px;font-size:42px;line-height:46px}
.lv .rot .dt{width:330px;font-size:30px;line-height:33px;font-weight:600;margin-top:6px}
.lv.topo .rot .nm{color:var(--destaque)}

/* ---- scene 2: the top ---- */
#luz{position:absolute;left:190px;width:700px;top:400px;height:410px;background:conic-gradient(from 180deg at 50% 100%,transparent 150deg,color-mix(in srgb,var(--destaque) 30%,transparent) 180deg,transparent 210deg);filter:blur(24px);transform-origin:50% 100%}
#ap{position:absolute;left:340px;width:400px;top:500px;height:300px;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(180deg,var(--destaque),color-mix(in srgb,var(--destaque) 60%,var(--fundo)))}
#apn{position:absolute;left:480px;width:120px;top:690px;height:90px;font-size:76px;line-height:90px;text-align:center;color:var(--sobre-destaque)}
#k2{position:absolute;left:90px;top:850px;width:820px;height:50px;text-align:center}
#nm2{position:absolute;left:90px;width:820px;top:915px;height:210px;font-size:92px;text-align:center}
#fecho{position:absolute;left:110px;width:780px;top:1150px;height:250px;font-size:50px;font-weight:800;line-height:1.15;text-align:center}

/* ---- scene 3: product ---- */
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="tit0" class="tit glow t seg rv"></div>
 <svg id="fio" viewBox="0 0 600 460"></svg>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="tit1" class="tit t seg"></div>
 <div id="pir"></div>
</div></div>

<div class="cena" id="c2"><div class="cam full">
 <div id="g2" class="full"><div id="luz"></div><div id="ap"></div><div id="apn" class="tit t seg"></div>
 <div id="k2" class="kick t seg"></div>
 <div id="nm2" class="tit glow t seg rv"></div>
 <div id="fecho" class="t seg rv"></div></div>
</div></div>

<div class="cena" id="c3"><div class="cam full" id="c3in"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// Pyramid of priorities or quality: 3 to 5 levels from the base (what everything rests on) to the top (what the
// customer gets in the end). The slabs land one by one from the base up, each one with its label on a dashed
// connector; then the camera dives into the top. Geometry is computed by the code from the number of levels.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const SVG_SIM = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M4 12.5l5 5L20 6.5"/></svg>';
const SVG_NAO = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M6 6l12 12M18 6L6 18"/></svg>';
// focus pull: glides up while the blur resolves to sharp
function foco(e, t, t0, dur = 0.7, dy = 50, blur = 16) {
  if (typeof e === 'string') e = Motor.$(e); if (!e) return 0;
  const q = Motor.eo5(Motor.p(t, t0, dur)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * dy}px)`; e.style.filter = q < 1 ? `blur(${((1 - q) * blur).toFixed(1)}px)` : 'none'; return q;
}
function aura($m) { const a = mk('div', 'aura'); mk('div', 'bloom', null, a); mk('div', 'pontos', null, a); $m.$('#fundo').after(a); return a; }
function auraQuadro($m, t) { const a = $m.$('.aura'); if (!a) return; a.firstChild.style.transform = `scale(${1 + 0.05 * Math.sin(t * 0.9)})`; a.lastChild.style.transform = `translateY(${-(t * 7) % 46}px)`; }
function kick(e, txt) { e.textContent = ''; mk('span', 'pt', null, e); e.append(txt); }
function vitrine(F, $m, pai, convite) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk mao t seg', P.convite || convite, v);
  const n = mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  const d = P.detalhe ? mk('div', 'pvd t t2 seg', P.detalhe, v) : null;
  const linhas = P.nome.length > 17 ? 2 : 1; n.style.height = (linhas * 86) + 'px';
  if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = (F, convite) => ler(F.produto.convite || convite, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.8)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`; f.style.filter = q < 1 ? `blur(${(1 - q) * 14}px)` : 'none';
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  foco(v.querySelector('.pvk'), t, a + 0.35, 0.6, 24, 10);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) foco(pd, t, a + 1.0, 0.6, 20, 8);
}

// ---- end of kit ----

let PV = null, GEO = null;
const X0 = 70, BASE = 460, CX = X0 + BASE / 2, Y0 = 590, Y1 = 1440, TOPO = 70, GAP = 12;
const larg = y => TOPO + (BASE - TOPO) * (y - Y0) / (Y1 - Y0);
function checar(F, $m) {
  const vistos = new Set(); F.niveis.forEach(l => { const k = l.nome.trim().toLowerCase(); if (vistos.has(k)) $m.erro('niveis: nível repetido: ' + l.nome); vistos.add(k); });
}
const CONV = 'conheça';

Motor.molde({
  id: 'piramide', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m; checar(F, $m); aura($m);
    const N = F.niveis, n = N.length;
    kick($('#k0'), 'Da base ao topo');
    $('#tit0').textContent = F.titulo;
    const lt = Math.min(4, Math.ceil(F.titulo.length / 15)), ht = lt * 100;
    const g0 = 390 + Math.max(0, Math.floor((1060 - (70 + ht + 40 + 400)) / 2));
    $('#k0').style.top = g0 + 'px'; $('#tit0').style.top = (g0 + 70) + 'px'; $('#tit0').style.height = (ht + 10) + 'px';
    $('#fio').style.top = (g0 + 70 + ht + 40) + 'px'; $('#fio').style.height = '400px';
    // wireframe: the outline and one line per level, from the base up
    let w = '<path class="base" pathLength="1" d="M20 440 L580 440"/>';
    w += '<path pathLength="1" d="M20 440 L265 20 L335 20 L580 440"/>';
    for (let i = 1; i < n; i++) { const y = 440 - 420 * i / n, x = 20 + (245) * i / n; w += `<path pathLength="1" d="M${x.toFixed(1)} ${y.toFixed(1)} L${(600 - x).toFixed(1)} ${y.toFixed(1)}"/>`; }
    $('#fio').setAttribute('viewBox', '0 0 600 460'); $('#fio').innerHTML = w;
    $('#fio').querySelectorAll('path').forEach(p => { p.setAttribute('stroke-dasharray', '1'); p.setAttribute('stroke-dashoffset', '1'); });
    // scene 1: slabs (base = level 1 at the bottom)
    $('#tit1').textContent = F.titulo;
    const h = (Y1 - Y0 - GAP * (n - 1)) / n, pir = $('#pir');
    GEO = N.map((l, i) => {
      const yb = Y1 - i * (h + GAP), yt = yb - h, wb = larg(yb), wt = larg(yt);
      const d = mk('div', 'lv' + (i === n - 1 ? ' topo' : ''), null, pir); d.style.top = yt + 'px'; d.style.height = h + 'px';
      const lj = mk('div', 'lj', null, d); lj.style.left = (CX - wb / 2) + 'px'; lj.style.width = wb + 'px';
      const k = (wb - wt) / 2 / wb * 100; lj.style.clipPath = `polygon(${k.toFixed(2)}% 0, ${(100 - k).toFixed(2)}% 0, 100% 100%, 0 100%)`;
      const nu = mk('div', 'nu tit t seg', String(i + 1), d); nu.style.left = (CX - 60) + 'px'; nu.style.top = Math.max(0, h * 0.62 - 35) + 'px';
      const xr = CX + larg(yt + h / 2) / 2 + 4, ym = h / 2;
      const lig = mk('div', 'lig', null, d); lig.style.left = xr + 'px'; lig.style.top = ym + 'px'; lig.style.width = (575 - xr) + 'px';
      const no = mk('div', 'no', null, d); no.style.left = '575px'; no.style.top = ym + 'px';
      const r = mk('div', 'rot', null, d);
      // a long name takes two lines only when the level is tall enough for name and detail; otherwise one line that shrinks
      const ln = l.nome.length > 14 && (!l.detalhe || h >= 46 * 2 + 33 * 2 + 16) ? 2 : 1, hn = ln * 46;
      const nm = mk('div', 'nm tit t seg', l.nome, r); nm.style.height = hn + 'px'; if (ln === 1) nm.style.whiteSpace = 'nowrap';
      let hd = 0; if (l.detalhe) { hd = Math.min(Math.max(33, h - hn - 16), 33 * 3); const dt = mk('div', 'dt t t2 seg', l.detalhe, r); dt.style.height = hd + 'px'; }
      const hr = hn + (hd ? hd + 6 : 0); r.style.top = (ym - hr / 2) + 'px'; r.style.height = hr + 'px';
      return { d, yt, h };
    });
    pir.style.transformOrigin = `${CX}px ${GEO[n - 1].yt + 20}px`;
    // scene 2: the top
    const T = N[n - 1];
    $('#apn').textContent = String(n);
    kick($('#k2'), 'O topo');
    $('#nm2').textContent = T.nome;
    const l2 = T.nome.length > 16 ? 2 : 1; $('#nm2').style.height = (l2 * 100) + 'px';
    let fim2 = 915 + l2 * 100;
    if (F.fecho) { $('#fecho').textContent = F.fecho; $('#fecho').style.top = (fim2 + 40) + 'px'; const lf = Math.ceil(F.fecho.length / 28); $('#fecho').style.height = (lf * 58 + 8) + 'px'; fim2 += 40 + lf * 58 + 8; } else $('#fecho').remove();
    // the group (apex to the last line) sits in the middle of the free area
    $('#g2').style.top = Math.max(0, Math.floor((1440 - fim2) / 2) - 40) + 'px';
    PV = vitrine(F, $m, $('#c3in'), CONV);
    const txt = N.map(l => l.nome + ' ' + (l.detalhe || '')).join(' ');
    return { duracoes: [
      Math.max(3.4, ler('Da base ao topo', F.titulo)),
      Math.max(1.2 + n * 1.0 + 1.6, ler(txt, N.map((l, i) => i + 1).join(' ')) + 0.5),
      Math.max(3.4, ler('O topo', F.fecho) + 0.8),
      Math.max(3.6, vitrineLer(F, CONV)),
    ] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, cl, ini } = $m;
    auraQuadro($m, t);
    const n = GEO.length;
    // 0: title and the wireframe drawing from the base up
    $m.cena('#c0', t, 0); const a0 = ini(0);
    foco('#k0', t, a0 + 0.1, 0.6, 20, 8);
    $m.revela('#tit0', t, a0 + 0.3, 0.07);
    $$('#fio path').forEach((pa, j) => pa.style.strokeDashoffset = 1 - eio(p(t, a0 + 0.8 + j * 0.18, 0.7)));
    // 1: slabs land one by one; each landing bumps the camera and lights the connector and label
    $m.cena('#c1', t, 1, 1, { push: 0.03 }); const a1 = ini(1), a2 = ini(2);
    foco('#tit1', t, a1 + 0.05, 0.6, 20, 10);
    let shake = 0;
    GEO.forEach((g, i) => {
      const ti = a1 + 0.5 + i * 1.0, q = p(t, ti, 0.55), qe = eb(q);
      const lj = g.d.querySelector('.lj'), nu = g.d.querySelector('.nu');
      lj.style.opacity = cl(q * 4); lj.style.transform = `translateY(${(1 - qe) * -260}px)`; lj.style.filter = q < 1 ? `blur(${((1 - q) * 12).toFixed(1)}px)` : 'none';
      nu.style.opacity = cl(q * 4); nu.style.transform = lj.style.transform;
      const hit = t - ti - 0.42; if (hit > 0) shake += Math.exp(-hit * 9) * Math.sin(hit * 60) * 7;
      const fl = hit > 0 ? Math.exp(-hit * 3) : 0; lj.style.boxShadow = 'none'; lj.style.filter = q < 1 ? lj.style.filter : (fl > 0.02 ? `brightness(${1 + fl * 0.5})` : 'none');
      const lq = eio(p(t, ti + 0.45, 0.4)); g.d.querySelector('.lig').style.transform = `scaleX(${lq})`; g.d.querySelector('.lig').style.opacity = lq > 0 ? 1 : 0;
      const nq = eb(p(t, ti + 0.75, 0.35)); g.d.querySelector('.no').style.transform = `scale(${nq})`; g.d.querySelector('.no').style.opacity = cl(nq * 3);
      foco(g.d.querySelector('.rot'), t, ti + 0.7, 0.6, 0, 12); g.d.querySelector('.rot').style.transform = `translateX(${(1 - eo5(p(t, ti + 0.7, 0.6))) * 50}px)`;
    });
    // the dive: into the top as the next scene starts
    const dv = eio(p(t, a2 - 0.1, 0.6));
    $('#pir').style.transform = `translateY(${shake}px) scale(${1 + dv * 3})`;
    $('#pir').style.opacity = 1 - cl(dv * 1.6);
    $('#tit1').style.opacity = t > a1 + 0.65 ? 1 - cl(dv * 3) : $('#tit1').style.opacity;
    // 2: the top glows under a beam of light
    $m.cena('#c2', t, 2);
    const qa = eb(p(t, a2 + 0.15, 0.7)); $('#ap').style.opacity = cl(qa * 2); $('#ap').style.transform = `scale(${0.6 + 0.4 * qa})`;
    $('#apn').style.opacity = cl(qa * 2); $('#apn').style.transform = `scale(${0.6 + 0.4 * qa})`;
    const lz = eo(p(t, a2 + 0.3, 1.0)); $('#luz').style.opacity = lz * (0.85 + 0.15 * Math.sin(t * 2.2)); $('#luz').style.transform = `scaleY(${lz})`;
    foco('#k2', t, a2 + 0.5, 0.6, 20, 8);
    $m.revela('#nm2', t, a2 + 0.65, 0.08);
    if ($('#fecho')) $m.revela('#fecho', t, a2 + 1.2, 0.05);
    // 3: product
    $m.cena('#c3', t, 3); vitrineQuadro(PV, F, $m, t, ini(3));
  },
});
</script></body></html>
