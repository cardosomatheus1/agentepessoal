<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* the two panels: red "don't" with an X drawn in two strokes, green "do" with a tick */
.pn{position:absolute;left:80px;width:830px;height:360px;border-radius:var(--raio);border:5px solid var(--cor);background:color-mix(in srgb,var(--cor) 13%,var(--fundo));box-shadow:var(--sombra)}
.pn.ruim{--cor:var(--ruim);--sobre:var(--sobre-ruim)}.pn.bom{--cor:var(--bom);--sobre:var(--sobre-bom)}
body.e-pop .pn{background:color-mix(in srgb,var(--cor) 26%,var(--fundo));border-width:6px;box-shadow:12px 12px 0 var(--texto)}
body.e-papel .pn{border-radius:12px}
.pn .ic{position:absolute;left:36px;top:36px;width:128px;height:128px;border-radius:50%;background:var(--cor);color:var(--sobre)}
.pn .ic svg{width:128px;height:128px}
.pn .lb{position:absolute;left:196px;top:40px;width:600px;height:48px;font-size:36px;font-weight:900;letter-spacing:5px;color:var(--cor);white-space:nowrap}
body.e-pop .pn .lb,body.e-claro .pn .lb,body.e-papel .pn .lb{color:var(--texto)}
.pn .tx{position:absolute;left:196px;right:40px;top:100px;bottom:34px;font-size:60px;font-weight:800;line-height:1.16;color:var(--texto)}
.vazio{position:absolute;left:80px;width:830px;height:360px;border-radius:var(--raio);border:5px dashed var(--borda);display:flex;align-items:center;justify-content:center;font-family:var(--ft),sans-serif;font-weight:900;font-size:150px;color:var(--borda)}
.seta{position:absolute;left:445px;width:100px;height:100px;border-radius:50%;background:var(--texto);color:var(--fundo);display:flex;align-items:center;justify-content:center;font-size:60px;z-index:3}
.seta .ico{transform:rotate(90deg)}
.hd{position:absolute;left:84px;width:840px;height:84px;display:flex;align-items:center;gap:24px}
.hd .n{flex:none;font-size:36px;height:62px;line-height:62px;padding:0 24px;white-space:nowrap}
.hd .s{flex:1;height:84px;font-size:64px;line-height:84px;white-space:nowrap}
.par .hd{top:385px}.par .pn.ruim{top:490px;height:440px}.par .pn.bom,.par .vazio{top:965px;height:440px}.par .seta{top:898px}
.par .pn .tx{top:108px;font-size:68px}
/* pair with a photo of the thing it talks about */
.pft{position:absolute;left:80px;width:830px;top:485px;height:300px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
.pft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.par.cf .pn.ruim{top:805px;height:300px}.par.cf .pn.bom,.par.cf .vazio{top:1148px;height:300px}.par.cf .seta{top:1078px}
.par.cf .pn .tx{top:92px;font-size:54px;bottom:24px}.par.cf .pn .ic{top:28px;width:100px;height:100px}.par.cf .pn .ic svg{width:100px;height:100px}.par.cf .pn .lb{top:30px}
/* cover */
#bg{position:absolute;left:0;top:0;width:1080px;height:980px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
#bgI{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bg:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.7))}
.bola{position:absolute;width:310px;height:310px;border-radius:50%;box-shadow:var(--sombra)}
.bola svg{width:310px;height:310px}
#bx{left:170px;top:420px;background:var(--ruim);color:var(--sobre-ruim)}
#bv{left:560px;top:450px;background:var(--bom);color:var(--sobre-bom)}
#k0{position:absolute;left:90px;width:820px;top:810px;height:64px;font-size:50px;font-weight:800;white-space:nowrap}
#t0{position:absolute;left:90px;width:820px;top:890px;height:330px;font-size:112px}
#m0{position:absolute;left:90px;width:820px;top:1250px;height:80px;font-size:62px;color:var(--destaque);white-space:nowrap}
.foto #k0{color:#fff}
/* carousel */
.slide .bola{width:280px;height:280px}.slide .bola svg{width:280px;height:280px}
.slide #bx{left:200px;top:170px}.slide #bv{left:560px;top:200px}
.slide #k0{left:84px;width:912px;top:540px}
.slide #t0{left:84px;width:912px;top:620px;height:360px;font-size:120px}
.slide #m0{left:84px;width:912px;top:1010px}
.slide .pe{position:absolute;left:84px;right:84px;top:1196px;height:70px;font-size:52px;color:var(--destaque);white-space:nowrap}
.slide.par .hd{top:150px;left:84px;width:912px}
.slide.par .pn{left:84px;width:912px;height:420px}.slide.par .pn.ruim{top:255px}.slide.par .pn.bom{top:745px}.slide.par .seta{top:665px;left:490px}.slide.par .pn .tx{font-size:66px;top:104px}
.slide .pft{left:84px;width:912px;top:240px;height:250px}
.slide.par.cf .pn{height:300px}.slide.par.cf .pn.ruim{top:510px}.slide.par.cf .pn.bom{top:860px}.slide.par.cf .seta{top:787px}.slide.par.cf .pn .tx{font-size:54px;top:92px}
.slide .pg{position:absolute;right:84px;top:1196px;height:44px;font-size:32px;font-weight:800;color:var(--texto2)}
.slide .mm{position:absolute;left:84px;width:700px;top:1186px;height:66px;font-size:50px;color:var(--destaque);white-space:nowrap}
/* ad close: the product or service with its real photo (every post ends selling, AR Board 13/10) */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1058px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}
.slide .pvf{left:84px;width:912px;top:130px;height:640px}
.slide .pvp{left:114px;top:700px;font-size:56px;height:90px;line-height:90px}
.slide .pvk{left:84px;width:912px;top:800px}
.slide .pvn{left:84px;width:912px;top:872px;height:200px;font-size:84px}
.slide .pvd{left:84px;width:912px;top:1084px;height:120px;font-size:42px}
</style></head><body><div id="palco">
<div class="cena" id="c0"><div class="cam full">
 <div id="bg"><img id="bgI" alt=""></div>
 <div class="bola" id="bx"><svg viewBox="0 0 100 100"><path class="tr" d="M31 31 L69 69" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path class="tr" d="M69 31 L31 69" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>
 <div class="bola" id="bv"><svg viewBox="0 0 100 100"><path class="tr" d="M27 53 L43 69 L74 33" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>
 <div id="k0" class="t t2 seg"></div>
 <div id="t0" class="tit t seg rv"></div>
 <div id="m0" class="mao t seg">e o jeito certo de cada um</div>
</div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// "Não faça x Faça": common mistakes and the right way, side by side. Each pair is about one thing (`sobre`), so the
// mistake and the fix always talk about the same subject. The X and the tick are drawn stroke by stroke.
// Optional narration: cover, then mistake and fix of each pair, call to action.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
// ad close: the product with photo, name, price and a nudge (every post ends taking the viewer to the product)
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(Boolean).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
// the product of the ad (`produto`, or `oferta` where `produto` already names what the post talks about)
const OF = F => (F.produto && typeof F.produto === 'object' ? F.produto : F.oferta);
function vitrine(F, $m, pai, kick) {
  const P = OF(F), v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk mao t seg', P.convite || kick, v);
  mk('div', 'pvn tit t seg' + ($m.FORMATO === 'carrossel' ? '' : ' rv'), P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  if (P.detalhe) mk('div', 'pvd t t2 seg', P.detalhe, v);
  // stack name and detail by the name's length (one or two lines)
  const car = $m.FORMATO === 'carrossel', linhas = P.nome.length > (car ? 19 : 17) ? 2 : 1, n = v.querySelector('.pvn'), d = v.querySelector('.pvd');
  const y0 = car ? 872 : 1130, lh = car ? 92 : 86; n.style.height = (linhas * lh) + 'px';
  if (d) d.style.top = (y0 + linhas * lh + 14) + 'px';
  return v;
}
const vitrineLer = (F, kick) => ler(OF(F).convite || kick, OF(F).nome, OF(F).detalhe, OF(F).preco != null ? 'R$ 0' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.7)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`;
  $m.filmagem(v.querySelector('.pvf img'), OF(F).foto, t);
  $m.entra(v.querySelector('.pvk'), t, a + 0.35, 0.5, 20);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) $m.entra(pd, t, a + 1.0, 0.5, 20);
}
const fontes = () => [...document.fonts].forEach(f => f.load().catch(() => {}));
const X = '<svg viewBox="0 0 100 100"><path class="tr" d="M31 31 L69 69" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path class="tr" d="M69 31 L31 69" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
const V = '<svg viewBox="0 0 100 100"><path class="tr" d="M27 53 L43 69 L74 33" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
function checar(F, $m) {
  const n = F.pares.length, voz = window.TEMPOS && window.TEMPOS.length > 1;
  if (voz && F.falas.length !== 3 + 2 * n) $m.erro(`falas: são ${3 + 2 * n} (capa, erro e certo de cada par, produto, chamada); vieram ${F.falas.length}`);
  F.pares.forEach((q, i) => { if (q.erro.trim().toLowerCase() === q.certo.trim().toLowerCase()) $m.erro(`pares[${i + 1}]: erro e certo iguais`); });
}
function capa(F, $m, raiz) {
  raiz.querySelector('#k0').textContent = F.tema;
  raiz.querySelector('#t0').textContent = `${F.pares.length} erros que custam caro`;
}
function painel(cls, rot, txt, icon, pai) {
  const p = mk('div', 'pn ' + cls, null, pai); const ic = mk('div', 'ic', null, p); ic.innerHTML = icon;
  mk('div', 'lb t seg', rot, p); mk('div', 'tx t seg rv', txt, p); return p;
}
function par(F, q, i, pai) {
  if (q.foto) { pai.closest('.cena, .slide').classList.add('cf'); $m0().filmagem(mk('img', null, null, mk('div', 'pft', null, pai)), q.foto, 0); }
  const hd = mk('div', 'hd', null, pai); mk('div', 'n chip t seg', `${i + 1}/${F.pares.length}`, hd); mk('div', 's tit t seg', q.sobre, hd);
  const r = painel('ruim', 'NÃO FAÇA', q.erro, X, pai);
  const se = mk('div', 'seta', null, pai); se.innerHTML = Motor.icone('seta');
  const b = painel('bom', 'FAÇA', q.certo, V, pai);
  return { hd, r, b, se };
}
const tr = (e, k) => e.setAttribute('stroke-dashoffset', (1 - k).toFixed(3));
let PS = [], VD = null;
const KICK = 'faz certo com a gente';
const $m0 = () => Motor;
Motor.molde({
  id: 'faca-nao-faca', formatos: ['carrossel', 'reel'],
  montar(F, M, $m) {
    const { $ } = $m; checar(F, $m);
    if (F.midia) $('#c0').classList.add('foto'); else $('#bg').remove();
    capa(F, $m, document);
    F.pares.forEach((q, i) => {
      const sc = mk('div', 'cena par', null, $('#palco')); const cam = mk('div', 'cam full', null, sc);
      const v = mk('div', 'vazio', '?', cam);
      PS.push(Object.assign(par(F, q, i, cam), { sc, v }));
    });
    const pv = mk('div', 'cena', null, $('#palco')); pv.id = 'prod'; VD = vitrine(F, $m, mk("div", "cam full", null, pv), KICK);
    const d = [ler(F.tema, F.pares.length + ' erros que custam caro e o jeito certo de cada um')];
    F.pares.forEach((q, i) => d.push(0.3 + ler(q.erro, q.sobre, '0/0 NÃO FAÇA'), 0.3 + ler(q.certo, 'FAÇA')));
    d.push(vitrineLer(F, KICK));
    return { duracoes: d };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, ini } = $m;
    // cover: X and tick circles roll in, strokes drawn
    $m.cena('#c0', t, 0);
    if ($('#bg')) $m.filmagem($('#bgI'), F.midia, t);
    const bx = eb(p(t, 0.1, 0.6)), bv = eb(p(t, 0.35, 0.6));
    $('#bx').style.transform = `translateX(${(1 - bx) * -500}px) rotate(${(1 - bx) * -200}deg)`; $('#bv').style.transform = `translateX(${(1 - bv) * 500}px) rotate(${(1 - bv) * 200}deg)`;
    $$('#bx .tr').forEach((e, k) => tr(e, eio(p(t, 0.6 + k * 0.18, 0.22)))); $$('#bv .tr').forEach(e => tr(e, eio(p(t, 0.95, 0.35))));
    $m.entra('#k0', t, 0.6, 0.5, 30); $m.revela('#t0', t, 0.8, 0.07); $m.entra('#m0', t, 1.6, 0.5, 20);
    const ip = 1 + 2 * PS.length; $m.cena('#prod', t, ip); vitrineQuadro(VD, F, $m, t, ini(ip));
    PS.forEach((o, i) => {
      const a = ini(1 + 2 * i), b = ini(2 + 2 * i); $m.cena(o.sc, t, 1 + 2 * i, 2 + 2 * i);
      const ft = o.sc.querySelector('.pft'); if (ft) { const fq = eo5(p(t, a + 0.05, 0.6)); ft.style.opacity = fq; ft.style.transform = `scale(${0.94 + 0.06 * fq})`; $m.filmagem(ft.querySelector('img'), F.pares[i].foto, t); }
      const h = eo5(p(t, a + 0.05, 0.5)); o.hd.style.opacity = h; o.hd.style.transform = `translateY(${(1 - h) * -40}px)`;
      // mistake: panel slams from the left, X drawn, a "no" shake
      const r = eb(p(t, a + 0.1, 0.55)), dim = eo(p(t, b, 0.4));
      const sh = t > a + 0.95 && t < a + 1.45 ? Math.sin((t - a - 0.95) * 38) * 22 * (1 - (t - a - 0.95) / 0.5) : 0;
      o.r.style.opacity = cl(r * 2) * (1 - 0.45 * dim); o.r.style.transform = `translateX(${(1 - r) * -900 + sh}px) scale(${1 - 0.04 * dim})`;
      $$('.tr', o.r).forEach((e, k) => tr(e, eio(p(t, a + 0.5 + k * 0.2, 0.2))));
      $m.revela($('.tx', o.r), t, a + 0.35, 0.05);
      // empty slot waits for the fix
      o.v.style.opacity = 0.6 * eo(p(t, a + 0.6, 0.4)) * (1 - eo(p(t, b, 0.2)));
      // fix: panel rises, tick drawn, arrow between
      const g = eb(p(t, b + 0.05, 0.55)); o.b.style.opacity = t >= b ? cl(g * 2) : 0; o.b.style.transform = `translateY(${(1 - g) * 300}px)`;
      $$('.tr', o.b).forEach(e => tr(e, eio(p(t, b + 0.45, 0.35))));
      const ping = p(t, b + 0.8, 0.35); $('.ic', o.b).style.transform = `scale(${1 + 0.25 * Math.sin(Math.PI * ping)})`;
      $m.revela($('.tx', o.b), t, b + 0.3, 0.05);
      const s = el(p(t, b + 0.2, 0.7)); o.se.style.opacity = t >= b + 0.2 ? 1 : 0; o.se.style.transform = `scale(${s})`;
    });
  },
  slides(F, M, $m) {
    checar(F, $m); fontes();
    const palco = $m.$('#palco'), c0 = $m.$('#c0');
    const s1 = mk('div', 'slide', null, palco);
    if (F.midia) { s1.classList.add('foto'); const b = $m.$('#bg'); s1.appendChild(b); b.style.height = '640px'; $m.filmagem($m.$('#bgI', s1), F.midia, 0); } else $m.$('#bg').remove();
    ['#bx', '#bv', '#k0', '#t0', '#m0'].forEach(x => s1.appendChild($m.$(x)));
    $m.$('#t0', s1).classList.remove('rv');
    $m.$$('.tr', s1).forEach(e => tr(e, 1));
    capa(F, $m, s1);
    mk('div', 'pe mao t seg', 'arrasta e confere →', s1).style.textAlign = 'right';
    $m.$('#m0', s1).style.textAlign = 'left';
    c0.remove();
    F.pares.forEach((q, i) => {
      const s = mk('div', 'slide par', null, palco); const o = par(F, q, i, s);
      $m.$$('.tr', s).forEach(e => tr(e, 1)); $m.$$('.rv', s).forEach(e => e.classList.remove('rv'));
      // no page counter: next to the pair's own "1/3" chip it read as a numbering mistake (Crítico, 22/10)
      if (i === 0) mk('div', 'mm mao t seg', 'salva pra lembrar depois', s);
    });
    vitrine(F, $m, mk('div', 'slide', null, palco), KICK);
  },
});
</script></body></html>
