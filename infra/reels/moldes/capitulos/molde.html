<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo kallaway -->
<style>
/* Kallaway layer (dark, lit instruments): aurora bloom from below, dot grid, glowing kicker and numbers */
.aur{position:absolute;left:-25%;right:-25%;bottom:-28%;height:80%;z-index:1;pointer-events:none;transform-origin:50% 100%;
  background:radial-gradient(50% 55% at 50% 100%,color-mix(in srgb,var(--destaque) 50%,transparent) 0%,color-mix(in srgb,var(--destaque) 16%,transparent) 45%,transparent 75%)}
.pts{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.55;background-image:radial-gradient(color-mix(in srgb,var(--texto) 22%,transparent) 2px,transparent 2.6px);background-size:48px 48px;
  -webkit-mask-image:radial-gradient(90% 70% at 50% 55%,#000 30%,transparent 80%);mask-image:radial-gradient(90% 70% at 50% 55%,#000 30%,transparent 80%)}
body.e-claro .aur,body.e-papel .aur{opacity:.55}body.e-pop .aur{opacity:.35}
.cena{z-index:2}
.kick{font-family:var(--fb),sans-serif;font-weight:800;font-size:34px;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);white-space:nowrap;height:46px;line-height:46px}
.luz{text-shadow:0 0 26px color-mix(in srgb,var(--destaque) 60%,transparent),0 0 80px color-mix(in srgb,var(--destaque) 30%,transparent)}
body.e-claro .luz,body.e-papel .luz,body.e-pop .luz{text-shadow:none}
.num{font-family:var(--ft),sans-serif;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.gnum{background-image:linear-gradient(170deg,var(--texto) 20%,var(--destaque) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
body.e-pop .gnum{background-image:none;color:var(--texto)}
/* scene 0: the subject */
#k0{position:absolute;left:90px;top:400px;width:820px}
#tit0{position:absolute;left:90px;top:470px;width:820px;height:520px;font-size:116px;line-height:1.0}
#n0{position:absolute;left:90px;top:1080px;height:76px;line-height:76px;font-size:40px;padding:0 32px;white-space:nowrap}
#pl0{position:absolute;left:90px;top:1200px;width:820px;height:12px;display:flex;gap:16px}
#pl0 i{flex:1;border-radius:999px;background:color-mix(in srgb,var(--texto) 18%,transparent)}
#pl0 i b{display:block;height:100%;border-radius:999px;background:var(--destaque);box-shadow:0 0 18px var(--destaque);transform-origin:0 50%}

/* chapter cards: shared text slots */
.cap .kc{position:absolute;left:90px;top:400px;width:820px;text-align:center}
.cap .ct{position:absolute;left:90px;top:1060px;width:820px;height:200px;font-size:92px;text-align:center}
.cap .cd{position:absolute;left:120px;top:1270px;width:760px;height:110px;font-size:42px;font-weight:700;text-align:center;line-height:1.25}
.cap .nn{position:absolute;font-size:200px;text-align:center}
/* portal: a lit ring opens from a point; the number emerges inside */
.portal .halo{position:absolute;left:190px;top:430px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--destaque) 40%,transparent) 0%,transparent 68%)}
.portal .aro{position:absolute;left:290px;top:530px;width:400px;height:400px;border-radius:50%;border:6px solid var(--destaque);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--texto) 60%,transparent),0 0 40px 8px color-mix(in srgb,var(--destaque) 60%,transparent),inset 0 0 40px 6px color-mix(in srgb,var(--destaque) 35%,transparent)}
.portal .aro2{position:absolute;left:250px;top:490px;width:480px;height:480px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--destaque) 50%,transparent)}
.portal .nn{left:290px;top:620px;width:400px;height:220px}
/* ascend: words rise out of blur over a giant outlined number */
.ascend .nn{left:90px;top:450px;width:820px;height:600px;font-size:500px;line-height:600px;padding-bottom:0;background-image:none;text-shadow:none;color:transparent;-webkit-text-stroke:4px color-mix(in srgb,var(--destaque) 70%,transparent)}
.ascend .placa{position:absolute;left:140px;top:960px;width:700px;height:380px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--destaque) 30%,transparent),transparent)}
body.e-pop .ascend .nn{color:transparent;-webkit-text-stroke-color:var(--texto)}
/* tunnel: rings come from outside and push in; the number is at the end of the tunnel */
.tunnel .anel{position:absolute;border-radius:60px;border:3px solid color-mix(in srgb,var(--destaque) 55%,transparent)}
.tunnel .fundo{position:absolute;left:390px;top:640px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--destaque) 70%,transparent),transparent 70%)}
.tunnel .nn{left:290px;top:630px;width:400px;height:220px}
/* glow rule: a line of light draws from the center; title glides down onto it, the detail glides up */
.grule .nn{left:90px;top:560px;width:820px;height:300px;font-size:300px}
.grule .regra{position:absolute;left:110px;top:1117px;width:760px;height:6px;border-radius:3px;background:var(--texto);box-shadow:0 0 16px 3px var(--destaque),0 0 50px 10px color-mix(in srgb,var(--destaque) 40%,transparent)}
.grule .no{position:absolute;top:1106px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--destaque);box-shadow:0 0 0 6px color-mix(in srgb,var(--destaque) 30%,transparent),0 0 30px var(--destaque)}
.grule .ct{top:900px}
.grule .cd{top:1160px}
body.e-claro .grule .regra,body.e-papel .grule .regra{background:var(--destaque)}

/* the index: every chapter, lit in turn */
#kI{position:absolute;left:90px;top:400px;width:820px}
#idx{position:absolute;left:90px;top:470px;width:820px;height:760px}
.li{position:absolute;left:0;width:820px;height:150px;display:flex;align-items:center;gap:30px;padding:0 30px;border-radius:32px}
.li .b{flex:none;width:100px;height:100px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:50px;background:color-mix(in srgb,var(--texto) 10%,transparent)}
.li .b.on{background:var(--destaque);color:var(--sobre-destaque);box-shadow:0 0 36px color-mix(in srgb,var(--destaque) 60%,transparent)}
.li .x{flex:1;min-width:0;height:64px;font-size:52px;white-space:nowrap}
#fecho{position:absolute;left:90px;top:1250px;width:820px;height:150px;font-size:56px;line-height:1.12}

/* ad close */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:0 0 0 3px color-mix(in srgb,var(--destaque) 70%,transparent),0 0 60px color-mix(in srgb,var(--destaque) 40%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1062px;height:50px;line-height:50px}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}
</style></head><body><div id="palco">
<div class="aur" id="aur"></div><div class="pts"></div>

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="tit0" class="tit t seg rv"></div>
 <div id="n0" class="chip t seg"></div>
 <div id="pl0"></div>
</div></div>

<div id="caps"></div>

<div class="cena" id="cI"><div class="cam full">
 <div id="kI" class="kick t seg">NESTE VÍDEO</div>
 <div id="idx"></div>
 <div id="fecho" class="tit dest t seg rv"></div>
</div></div>

<div class="cena" id="cV"><div class="cam full" id="cVin"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// "Capítulos": a kinetic chapter intro for a longer explanation. The subject opens, then each of the 3 or 4 topics
// gets its own section card (portal, ascend, tunnel, glow rule, in that order), then the index lights every chapter in
// turn and the post ends on the product. The numbering and the "N de N" come from the list, by the code.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(Boolean).length;
// reading time: the check asks 0.8 s + 0.25 s per new word; a little margin on top
const ler = (...s) => 1.0 + 0.25 * palavras(...s);
function foco(e, t, t0, d = 0.7, dy = 40, bl = 16) {
  if (typeof e === 'string') e = Motor.$(e); if (!e) return 0;
  const q = Motor.eo5(Motor.p(t, t0, d)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * dy}px)`; e.style.filter = q < 1 ? `blur(${((1 - q) * bl).toFixed(1)}px)` : 'none'; return q;
}
function vitrine(F, $m, pai) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk kick t seg', P.convite || 'tem aqui pra você', v);
  mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  if (P.detalhe) mk('div', 'pvd t t2 seg', P.detalhe, v);
  const linhas = P.nome.length > 20 ? 2 : 1, n = v.querySelector('.pvn'), d = v.querySelector('.pvd');
  n.style.height = (linhas * 86) + 'px'; if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = F => ler(F.produto.convite || 'tem aqui pra você', F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$ 0' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.8)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`; f.style.filter = q < 1 ? `blur(${(1 - q) * 18}px)` : 'none';
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  foco(v.querySelector('.pvk'), t, a + 0.35, 0.6, 20, 10);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) foco(pd, t, a + 1.0, 0.6, 20, 8);
}
const TIPOS = ['portal', 'ascend', 'tunnel', 'grule'];
const p2 = x => String(x).padStart(2, '0');
let CAPS = [], PV = null;
// words rise one by one out of a blur (Kallaway "ascend")
function sobe(e, t, t0, passo = 0.14) {
  if (!e.dataset.pal) Motor.palavras(e);
  Motor.$$('.wi', e).forEach((w, i) => { const q = Motor.eo5(Motor.p(t, t0 + i * passo, 0.65)); w.style.transform = `translateY(${(1 - q) * 70}%)`; w.style.opacity = q; w.style.filter = q < 1 ? `blur(${((1 - q) * 14).toFixed(1)}px)` : 'none'; });
}
function capitulo(c, i, n, $m) {
  const tipo = TIPOS[i % 4], cena = mk('div', 'cena cap ' + tipo, null, $m.$('#caps')); cena.id = 'cc' + i;
  const cam = mk('div', 'cam full', null, cena);
  if (tipo === 'portal') { mk('div', 'halo', null, cam); mk('div', 'aro2', null, cam); mk('div', 'aro', null, cam); }
  if (tipo === 'ascend') mk('div', 'placa', null, cam);
  if (tipo === 'tunnel') { for (let k = 0; k < 6; k++) { const s = 620 - k * 84, a = mk('div', 'anel', null, cam); Object.assign(a.style, { left: (490 - s / 2) + 'px', top: (740 - s / 2) + 'px', width: s + 'px', height: s + 'px', borderRadius: (90 + k * 12) + 'px' }); } mk('div', 'fundo', null, cam); }
  if (tipo === 'grule') { mk('div', 'regra', null, cam); const a = mk('div', 'no', null, cam); a.style.left = '110px'; const b = mk('div', 'no', null, cam); b.style.left = '870px'; }
  mk('div', 'nn num gnum luz t', p2(i + 1), cam);
  mk('div', 'kc kick t seg', `CAPÍTULO ${i + 1} DE ${n}`, cam);
  mk('div', 'ct tit t seg' + (tipo === 'ascend' ? ' rv' : ''), c.titulo, cam);
  mk('div', 'cd t t2 seg', c.detalhe, cam);
  return { cena, tipo, cam };
}

Motor.molde({
  id: 'capitulos', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m;
    const n = F.capitulos.length;
    $('#k0').textContent = F.serie || 'EXPLICADO EM PARTES';
    $('#tit0').textContent = F.assunto;
    $('#n0').textContent = `${n} capítulos`;
    for (let i = 0; i < n; i++) mk('b', null, null, mk('i', null, null, $('#pl0')));
    CAPS = F.capitulos.map((c, i) => capitulo(c, i, n, $m));
    const alto = Math.min(170, Math.floor(760 / n));
    F.capitulos.forEach((c, i) => { const l = mk('div', 'li cartao', null, $('#idx')); l.style.top = (i * (alto + 14)) + 'px'; l.style.height = alto + 'px';
      mk('div', 'b num', p2(i + 1), l); mk('div', 'x tit t seg', c.titulo, l); });
    $('#fecho').textContent = F.fecho; $('#fecho').style.top = (470 + n * (alto + 14) + 40) + 'px';
    PV = vitrine(F, $m, $('#cVin'));
    return { duracoes: [
      Math.max(3.4, 0.2 + ler(F.serie || 'EXPLICADO EM PARTES', F.assunto, 'X capítulos')),
      ...F.capitulos.map(c => Math.max(3.4, 0.5 + ler('CAPÍTULO X DE X', c.titulo, c.detalhe))),
      Math.max(3.6, 0.6 + n * 0.3 + ler('NESTE VÍDEO', F.fecho)),
      Math.max(3.4, vitrineLer(F)) ] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, cl, ini, fim, lerp } = $m;
    const n = F.capitulos.length;
    $('#aur').style.transform = `scale(${1 + 0.05 * Math.sin(t * 0.9)})`;
    // 0: subject; one bar per chapter fills in
    let a = ini(0); $m.cena('#c0', t, 0, 0, { sobra: 0.15 });
    foco('#k0', t, a + 0.1, 0.6, 20, 8);
    $m.revela('#tit0', t, a + 0.3, 0.07);
    const s0 = eb(p(t, a + 1.0, 0.5)); $('#n0').style.opacity = cl(s0 * 2); $('#n0').style.transform = `scale(${s0})`;
    $$('#pl0 b').forEach((b, i) => { b.style.transform = `scaleX(${eo(p(t, a + 1.2 + i * 0.2, 0.5))})`; });
    // chapter cards
    CAPS.forEach((C, i) => {
      const k = i + 1; a = ini(k); $m.cena(C.cena, t, k, k, { sobra: 0.15 });
      if (t < a - 0.05 || t > fim(k) + 0.5) return;
      const q = (x, d = 0.7) => eo5(p(t, a + x, d)), $c = s => C.cena.querySelector(s);
      foco($c('.kc'), t, a + 0.1, 0.6, 20, 8);
      const nn = $c('.nn'), ct = $c('.ct'), cd = $c('.cd');
      if (C.tipo === 'portal') {
        const o = eb(p(t, a + 0.15, 0.75)); $c('.aro').style.transform = `scale(${Math.max(0.02, o)}) translateY(${-16 * eio(p(t, a + 1.5, 3))}px)`; $c('.aro').style.opacity = cl(o * 3);
        const h = eo5(p(t, a + 0.3, 1.2)); $c('.halo').style.transform = `scale(${0.1 + 0.9 * h + 0.06 * Math.sin(t * 2)})`; $c('.halo').style.opacity = h;
        $c('.aro2').style.transform = `rotate(${(t - a) * 12}deg) scale(${0.6 + 0.4 * h})`; $c('.aro2').style.opacity = h;
        const nq = eb(p(t, a + 0.6, 0.6)); nn.style.opacity = cl(nq * 2); nn.style.transform = `scale(${0.7 + 0.3 * nq})`;
        foco(ct, t, a + 0.85, 0.9, 0, 18); ct.style.transform = `scale(${0.8 + 0.2 * q(0.85, 0.9)})`;
        foco(cd, t, a + 1.2, 0.7, 20, 10);
      } else if (C.tipo === 'ascend') {
        const nq = q(0.1, 1.2); nn.style.opacity = nq * 0.9; nn.style.transform = `translateY(${(1 - nq) * 120 - 20 * p(t, a, 4)}px)`;
        sobe(ct, t, a + 0.4); foco(cd, t, a + 0.5 + palavrasEm(ct) * 0.14, 0.7, 30, 12);
        const pl = q(1.0, 0.9); $c('.placa').style.opacity = pl * (0.75 + 0.25 * Math.sin(t * 2.2));
      } else if (C.tipo === 'tunnel') {
        $$('.anel', C.cena).forEach((r, k2) => { const e = eo5(p(t, a + 0.05 + k2 * 0.07, 1.0)); r.style.opacity = e * (0.35 + k2 * 0.1); r.style.transform = `scale(${1.18 - 0.18 * e - 0.06 * eio(p(t, a + 1.2, 3.5))})`; });
        const f = eo5(p(t, a + 0.6, 1.0)); $c('.fundo').style.opacity = f; $c('.fundo').style.transform = `scale(${0.3 + 0.7 * f + 0.15 * Math.sin(t * 2.5)})`;
        const nq = eo5(p(t, a + 0.7, 0.9)); nn.style.opacity = nq; nn.style.transform = `scale(${0.4 + 0.6 * nq})`; nn.style.filter = nq < 1 ? `blur(${(1 - nq) * 16}px)` : 'none';
        foco(ct, t, a + 0.95, 0.9, 0, 18); ct.style.transform = `scale(${0.85 + 0.15 * q(0.95, 0.9)})`;
        foco(cd, t, a + 1.3, 0.7, 20, 10);
      } else {
        const r = eo5(p(t, a + 0.3, 0.75)); $c('.regra').style.transform = `scaleX(${r})`;
        const pul = p(t, a + 1.2, 0.01) ? 0.75 + 0.25 * Math.sin((t - a) * 3.5) : 1; $c('.regra').style.opacity = pul;
        $$('.no', C.cena).forEach(no => { const z = p(t, a + 0.95, 0.45); no.style.opacity = z > 0 ? 1 : 0; no.style.transform = `scale(${z < 0.45 ? lerp(0, 1.4, z / 0.45) : lerp(1.4, 1, eb(cl((z - 0.45) / 0.55)))})`; });
        const nq = eo5(p(t, a + 0.1, 0.9)); nn.style.opacity = nq; nn.style.transform = `translateY(${(1 - nq) * -60}px)`; nn.style.filter = nq < 1 ? `blur(${(1 - nq) * 14}px)` : 'none';
        foco(ct, t, a + 0.75, 0.9, -40, 14); foco(cd, t, a + 1.0, 0.75, 30, 8);
      }
    });
    // index: chapters light up in turn, a glow passes over each
    const kI = n + 1; a = ini(kI); $m.cena('#cI', t, kI);
    foco('#kI', t, a + 0.1, 0.6, 20, 8);
    $$('#idx .li').forEach((l, i) => {
      const e = eo5(p(t, a + 0.2 + i * 0.12, 0.6)); l.style.opacity = e; l.style.transform = `translateX(${(1 - e) * 80}px)`;
      const on = p(t, a + 0.7 + i * 0.3, 0.01) > 0; l.querySelector('.b').classList.toggle('on', on);
      const g = p(t, a + 0.7 + i * 0.3, 0.5); l.style.boxShadow = g > 0 && g < 1 ? `0 0 ${50 * Math.sin(Math.PI * g)}px color-mix(in srgb,var(--destaque) 45%,transparent)` : '';
    });
    $m.revela('#fecho', t, a + 0.8 + n * 0.3, 0.06);
    // product
    $m.cena('#cV', t, n + 2); vitrineQuadro(PV, F, $m, t, ini(n + 2));
  },
});
const palavrasEm = e => Motor.$$('.wi', e).length || e.textContent.split(/\s+/).length;
</script></body></html>
