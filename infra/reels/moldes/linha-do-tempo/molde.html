<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo kallaway -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* ---- kallaway kit: aurora bloom from below, dot grid, glass hairline, glow (all from brand tokens) ---- */
.aura{position:absolute;inset:0;pointer-events:none}
.aura .bloom{position:absolute;left:-25%;right:-25%;bottom:-28%;height:70%;transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 62%,color-mix(in srgb,var(--destaque) 40%,transparent) 0%,color-mix(in srgb,var(--destaque) 12%,transparent) 46%,transparent 76%)}
.aura .pontos{position:absolute;inset:-60px;background-image:radial-gradient(circle,color-mix(in srgb,var(--texto) 15%,transparent) 1.7px,transparent 2.3px);background-size:46px 46px;
  -webkit-mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%)}
body.e-claro .aura .bloom,body.e-papel .aura .bloom{opacity:.55}
body.e-pop .aura .bloom{opacity:.35}
body.e-vidro .vid,body.e-noite .vid{box-shadow:var(--sombra),inset 0 1.5px 0 color-mix(in srgb,var(--texto) 24%,transparent)}
body.e-vidro .glow,body.e-noite .glow{text-shadow:0 0 26px color-mix(in srgb,var(--destaque) 55%,transparent)}
.kick{font-size:32px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);white-space:nowrap;line-height:50px}
.kick .pt{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--destaque);margin-right:18px;vertical-align:2px;box-shadow:0 0 16px var(--destaque)}
/* ad close: the product with its real photo */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
body.e-vidro .pvf,body.e-noite .pvf{box-shadow:var(--sombra),0 0 0 2px color-mix(in srgb,var(--destaque) 70%,transparent),0 0 60px color-mix(in srgb,var(--destaque) 35%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1058px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}


/* ---- scene 0 ---- */
#k0{position:absolute;left:90px;top:400px;width:820px;height:50px}
#tit0{position:absolute;left:90px;width:830px;top:470px;height:420px;font-size:96px}
#de0{position:absolute;left:90px;width:820px;height:90px;font-size:64px;line-height:90px;white-space:nowrap;color:var(--texto2)}

/* ---- scenes 1..n: the rail ---- */
#ano{position:absolute;left:90px;width:820px;top:392px;height:230px;font-size:230px;line-height:230px;text-align:center;letter-spacing:-.04em}
#trilho{position:absolute;left:0;top:720px;width:1080px;height:120px}
#via{position:absolute;left:0;top:0;height:0;border-top:4px solid color-mix(in srgb,var(--texto) 22%,transparent)}
#feito{position:absolute;left:0;top:-2px;height:8px;border-radius:8px;background:linear-gradient(90deg,transparent,var(--destaque));box-shadow:0 0 24px color-mix(in srgb,var(--destaque) 70%,transparent)}
.pt2{position:absolute;top:0;width:0;height:0}
.pt2 b{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:var(--fundo);border:5px solid color-mix(in srgb,var(--texto) 40%,transparent)}
.pt2.on b{background:var(--destaque);border-color:var(--destaque);box-shadow:0 0 30px var(--destaque)}
.pt2 .an{position:absolute;left:-80px;top:34px;width:160px;height:48px;font-size:36px;line-height:48px;font-weight:800;text-align:center;white-space:nowrap}
.pt2.on .an{color:var(--destaque)}
.mc{position:absolute;left:70px;width:840px;top:880px;height:560px;overflow:hidden}
.mc .fo{position:absolute;left:0;top:0;width:840px;height:390px;overflow:hidden;border-radius:var(--raio) var(--raio) 0 0}
.mc .fo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc .tx{position:absolute;left:44px;width:760px;top:412px;height:124px;font-size:54px;line-height:1.1}
.mc.sem{height:420px;top:900px}
.mc.sem .tx{top:0;bottom:0;height:auto;font-size:68px;display:flex;align-items:center}
.mc.sem .tx>div{width:100%}

/* ---- resume ---- */
#k9{position:absolute;left:90px;top:440px;width:820px;height:50px;text-align:center}
#n9{position:absolute;left:90px;width:820px;top:510px;height:300px;font-size:300px;line-height:300px;text-align:center}
#l9{position:absolute;left:90px;width:820px;top:820px;height:90px;font-size:72px;line-height:90px;text-align:center;white-space:nowrap}
#mini{position:absolute;left:170px;width:650px;top:1000px;height:110px}
#mini .ln{position:absolute;left:0;right:0;top:0;border-top:4px solid var(--destaque);transform-origin:0 50%}
#mini .d{position:absolute;top:-11px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--destaque)}
#mini .y{position:absolute;top:26px;width:110px;margin-left:-55px;height:44px;font-size:30px;line-height:44px;font-weight:800;text-align:center;white-space:nowrap}
#fecho{position:absolute;left:110px;width:780px;top:1150px;height:250px;font-size:50px;font-weight:800;line-height:1.15;text-align:center}
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="tit0" class="tit glow t seg rv"></div>
 <div id="de0" class="tit t seg"></div>
</div></div>

<div class="cena" id="cT"><div class="cam full">
 <div id="ano" class="tit glow dest t seg"></div>
 <div id="trilho"><div id="via"></div><div id="feito"></div></div>
</div></div>

<div class="cena" id="cR"><div class="cam full">
 <div id="k9" class="kick t seg"></div>
 <div id="n9" class="tit glow dest t seg"></div>
 <div id="l9" class="tit t seg"></div>
 <div id="mini" data-leitura="nao"><div class="ln"></div></div>
 <div id="fecho" class="t t2 seg rv"></div>
</div></div>

<div class="cena" id="cV"><div class="cam full" id="cVin"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// The history of the business: 3 to 6 dated points on a horizontal rail. The camera travels along the rail while a
// big year counter rolls from one date to the next, and each point opens a card with what happened (and a real
// photo, when there is one). The code sorts the points by year, refuses a year in the future and computes the
// years of history; the dates and facts come from the owner (_origem).
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const SVG_SIM = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M4 12.5l5 5L20 6.5"/></svg>';
const SVG_NAO = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M6 6l12 12M18 6L6 18"/></svg>';
// focus pull: glides up while the blur resolves to sharp
function foco(e, t, t0, dur = 0.7, dy = 50, blur = 16) {
  if (typeof e === 'string') e = Motor.$(e); if (!e) return 0;
  const q = Motor.eo5(Motor.p(t, t0, dur)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * dy}px)`; e.style.filter = q < 1 ? `blur(${((1 - q) * blur).toFixed(1)}px)` : 'none'; return q;
}
function aura($m) { const a = mk('div', 'aura'); mk('div', 'bloom', null, a); mk('div', 'pontos', null, a); $m.$('#fundo').after(a); return a; }
function auraQuadro($m, t) { const a = $m.$('.aura'); if (!a) return; a.firstChild.style.transform = `scale(${1 + 0.05 * Math.sin(t * 0.9)})`; a.lastChild.style.transform = `translateY(${-(t * 7) % 46}px)`; }
function kick(e, txt) { e.textContent = ''; mk('span', 'pt', null, e); e.append(txt); }
function vitrine(F, $m, pai, convite) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk mao t seg', P.convite || convite, v);
  const n = mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  const d = P.detalhe ? mk('div', 'pvd t t2 seg', P.detalhe, v) : null;
  const linhas = P.nome.length > 17 ? 2 : 1; n.style.height = (linhas * 86) + 'px';
  if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = (F, convite) => ler(F.produto.convite || convite, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.8)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`; f.style.filter = q < 1 ? `blur(${(1 - q) * 14}px)` : 'none';
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  foco(v.querySelector('.pvk'), t, a + 0.35, 0.6, 24, 10);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) foco(pd, t, a + 1.0, 0.6, 20, 8);
}

// ---- end of kit ----

let PV = null, H = [], ANOS = 0, HOJE = 0;
const D = 300, CXR = 540;
function checar(F, $m) {
  HOJE = new Date().getFullYear();
  const L = F.marcos.map((m, i) => ({ ...m, i })).sort((a, b) => a.ano - b.ano || a.i - b.i);
  L.forEach(m => { if (!Number.isInteger(m.ano)) $m.erro('marcos: ano sem casas decimais: ' + m.ano); if (m.ano > HOJE) $m.erro(`marcos: ${m.ano} ainda não chegou; linha do tempo é só do que já aconteceu`); });
  return L;
}
const CONV = 'venha conhecer';
const anosTxt = a => a === 1 ? 'ano de história' : 'anos de história';

Motor.molde({
  id: 'linha-do-tempo', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m; H = checar(F, $m); aura($m);
    const n = H.length;
    kick($('#k0'), 'Nossa história');
    $('#tit0').textContent = F.titulo;
    $('#de0').textContent = `de ${H[0].ano} até hoje`;
    const lt = Math.min(4, Math.ceil(F.titulo.length / 15)), ht = lt * 100, g0 = 390 + Math.max(0, Math.floor((1060 - (70 + ht + 30 + 90)) / 2));
    $('#k0').style.top = g0 + 'px'; $('#tit0').style.top = (g0 + 70) + 'px'; $('#tit0').style.height = (ht + 10) + 'px'; $('#de0').style.top = (g0 + 70 + ht + 30) + 'px';
    // the rail: one point per date plus "hoje", D px apart
    const tr = $('#trilho'), larg = (n + 1) * D;
    $('#via').style.width = (larg + 2000) + 'px'; $('#via').style.left = '-1000px';
    H.forEach((m, i) => {
      const pt = mk('div', 'pt2', null, tr); pt.style.left = (i * D) + 'px'; mk('b', null, null, pt); mk('div', 'an t seg', String(m.ano), pt);
      const c = mk('div', 'mc cartao vid' + (m.foto ? '' : ' sem'), null, $('#cT .cam'));
      if (m.foto) { const f = mk('div', 'fo', null, c); $m.filmagem(mk('img', null, null, f), m.foto, 0); }
      const tx = mk('div', 'tx tit t seg', null, c); if (m.foto) tx.textContent = m.texto; else mk('div', null, m.texto, tx);
      m.el = c; m.pt = pt;
    });
    const ph = mk('div', 'pt2', null, tr); ph.style.left = (n * D) + 'px'; mk('b', null, null, ph); mk('div', 'an t seg', 'hoje', ph); H.ph = ph;
    $('#ano').textContent = String(H[n - 1].ano);
    // resume: years of history counted by the code
    ANOS = HOJE - H[0].ano;
    kick($('#k9'), 'Até aqui');
    if (ANOS >= 1) { $('#n9').textContent = String(ANOS); $('#l9').textContent = anosTxt(ANOS); }
    else { $('#n9').textContent = String(H[0].ano); $('#l9').textContent = 'foi onde tudo começou'; }
    const ys = [...new Set(H.map(m => m.ano))].map(String).concat('hoje');
    ys.forEach((y, j) => { const x = ys.length === 1 ? 325 : j * 650 / (ys.length - 1); const d = mk('div', 'd', null, $('#mini')); d.style.left = x + 'px'; const l = mk('div', 'y t seg', y, $('#mini')); l.style.left = x + 'px'; });
    if (F.fecho) $('#fecho').textContent = F.fecho; else $('#fecho').remove();
    PV = vitrine(F, $m, $('#cVin'), CONV);
    return { duracoes: [
      Math.max(3.0, ler('Nossa história', F.titulo, `de ${H[0].ano} até hoje`)),
      // a point is one short line: the reading minimum (0.8 s + 0.25 s a word) plus a little air, so six points fit in 40 s
      ...H.map((m, i) => Math.max(2.8, 1.0 + 0.25 * palavras(String(m.ano), m.texto, 'ano', i === 0 ? 'hoje' : ''))),
      Math.max(3.4, ler('Até aqui', $('#n9').textContent, $('#l9').textContent, F.fecho)),
      Math.max(3.6, vitrineLer(F, CONV)),
    ] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, cl, ini, fim, lerp } = $m;
    auraQuadro($m, t);
    const n = H.length;
    // 0: title, the time span
    $m.cena('#c0', t, 0); const a0 = ini(0);
    foco('#k0', t, a0 + 0.1, 0.6, 20, 8);
    $m.revela('#tit0', t, a0 + 0.3, 0.07);
    foco('#de0', t, a0 + 0.9, 0.7, 30, 12);
    // 1..n: the camera rides the rail; the year rolls; the card of the point opens
    $m.cena('#cT', t, 1, n, { push: 0.02 });
    let k = 0; for (let i = 0; i < n; i++) if (t >= ini(i + 1)) k = i;
    const ai = ini(k + 1), mv = eio(p(t, ai, 0.8)), de = k === 0 ? -0.6 : k - 1, pos = lerp(de, k, mv);
    $('#trilho').style.transform = `translateX(${CXR - pos * D}px)`;
    $('#feito').style.left = (-600) + 'px'; $('#feito').style.width = (600 + Math.max(0, pos) * D) + 'px';
    const anoDe = k === 0 ? H[0].ano - Math.min(3, Math.max(0, H[0].ano - 1900)) : H[k - 1].ano;
    $m.conta('#ano', t, ai, 0.8, H[k].ano, v => String(Math.round(v)), anoDe);
    const pulso = Math.exp(-Math.max(0, t - ai - 0.8) * 4) * (t > ai + 0.8);
    $('#ano').style.transform = `scale(${1 + 0.06 * pulso})`;
    [...H.map(m => m.pt), H.ph].forEach((pt, i) => {
      const dx = Math.abs(i - pos) * D, op = dx <= D ? 1 : cl(1 - (dx - D) / 150);
      pt.style.opacity = op; pt.classList.toggle('on', i <= pos + 0.02);
      const b = pt.querySelector('b'); b.style.transform = `scale(${i === k ? 1 + 0.5 * pulso : 1})`;
    });
    H.forEach((m, i) => {
      const c = m.el;
      if (i !== k && !(i === k - 1 && t < ai + 0.5)) { c.style.opacity = 0; c.style.visibility = 'hidden'; return; }
      c.style.visibility = 'visible';
      if (i === k - 1) { const q = eio(p(t, ai, 0.45)); c.style.opacity = 1 - q; c.style.transform = `translateY(${-q * 80}px)`; c.style.filter = `blur(${(q * 16).toFixed(1)}px)`; return; }
      foco(c, t, ai + 0.35, 0.75, 90, 18);
      const im = c.querySelector('img'); if (im) $m.filmagem(im, m.foto, t - ai);
    });
    // resume
    const aR = ini(n + 1); $m.cena('#cR', t, n + 1);
    foco('#k9', t, aR + 0.1, 0.6, 20, 8);
    const qn = eb(p(t, aR + 0.25, 0.7)); $('#n9').style.opacity = cl(qn * 2); $('#n9').style.transform = `scale(${0.5 + 0.5 * qn})`;
    if (ANOS >= 1) $m.conta('#n9', t, aR + 0.25, 1.0, ANOS, v => String(Math.round(v)), 0);
    foco('#l9', t, aR + 0.6, 0.6, 30, 10);
    const ql = eio(p(t, aR + 0.7, 0.9)); $('#mini .ln').style.transform = `scaleX(${ql})`;
    const ds = $$('#mini .d'), yl = $$('#mini .y'); ds.forEach((d, j) => { const q = eb(p(t, aR + 0.7 + 0.9 * j / Math.max(1, ds.length - 1), 0.35)); d.style.transform = `scale(${q})`; d.style.opacity = cl(q * 3); yl[j].style.opacity = cl(q * 2); });
    if ($('#fecho')) $m.revela('#fecho', t, aR + 1.4, 0.05);
    // product
    $m.cena('#cV', t, n + 2); vitrineQuadro(PV, F, $m, t, ini(n + 2));
  },
});
</script></body></html>
