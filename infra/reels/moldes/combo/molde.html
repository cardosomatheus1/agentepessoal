<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* video: items (scene 0) fly into the box (1), the closed box gets its price tag (2), the receipt prints (3) */
#titulo{left:90px;width:820px;top:390px;height:110px;font-size:84px;line-height:1.1;white-space:nowrap}
#grade{position:absolute;left:90px;width:820px;top:540px}
.it{position:absolute;display:flex;align-items:center;gap:22px;padding:18px 22px 18px 18px}
.it .ph{flex:none;border-radius:50%;overflow:hidden;background:var(--fundo2);display:flex;align-items:center;justify-content:center;color:var(--destaque)}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it .ph .ico{font-size:80px}
.it .tx{flex:1;min-width:0}
.it .nm{font-size:42px;font-weight:800;line-height:1.12;height:96px;display:flex;align-items:center}
.it .pr{display:inline-block;margin-top:8px;font-size:38px;padding:8px 22px;white-space:nowrap}
.it.vert{flex-direction:column;justify-content:center;text-align:center;gap:14px;padding:20px}
.it.vert .tx{flex:none;width:100%}.it.vert .nm{justify-content:center;font-size:38px;height:88px}
/* the box, front view: open top (interior + two flaps), front panel with a window */
#caixa{position:absolute;left:250px;top:1030px;width:580px;height:420px}
#interior{position:absolute;left:0;top:40px;width:580px;height:90px;background:color-mix(in srgb,var(--destaque) 45%,var(--fundo));border-radius:10px 10px 0 0}
.aba{position:absolute;top:40px;width:290px;height:90px;background:color-mix(in srgb,var(--destaque) 80%,var(--texto));border:3px solid color-mix(in srgb,var(--destaque) 60%,var(--fundo));border-radius:8px;z-index:4}
#abaE{left:0;transform-origin:0 100%}#abaD{left:290px;transform-origin:100% 100%}
#fita{position:absolute;left:262px;top:28px;width:56px;height:130px;background:var(--c2);z-index:6;transform-origin:50% 0;opacity:.95}
#frente{position:absolute;left:0;top:120px;width:580px;height:300px;background:var(--destaque);border-radius:10px 10px 22px 22px;z-index:3;box-shadow:var(--sombra);overflow:hidden}
body.e-pop #frente{border:6px solid var(--texto);box-shadow:12px 12px 0 var(--texto)}
body.e-noite #frente{box-shadow:0 0 0 2px var(--destaque),0 0 50px color-mix(in srgb,var(--destaque) 55%,transparent)}
#janela{position:absolute;left:40px;top:34px;width:220px;height:220px;border-radius:30px;overflow:hidden;border:6px solid var(--sobre-destaque);background:var(--fundo2)}
#janela img{width:100%;height:100%;object-fit:cover}
#rotulo{position:absolute;left:290px;top:40px;width:260px;height:210px;font-size:46px;line-height:1.05;color:var(--sobre-destaque);display:flex;align-items:center}
#voo{position:absolute;inset:0;z-index:2;pointer-events:none}
#voo .ph{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--fundo2);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;color:var(--destaque)}
#voo .ph img{width:100%;height:100%;object-fit:cover}#voo .ph .ico{font-size:80px}
/* price tag hanging from the box */
#tagW{position:absolute;left:285px;top:410px;width:10px;height:10px;z-index:7;transform-origin:5px 5px}
#corda{position:absolute;left:3px;top:0;width:5px;height:70px;background:var(--texto);opacity:.7}
#tag{position:absolute;left:-235px;top:66px;width:480px;height:236px;border-radius:26px 26px 26px 26px;padding:26px 30px;text-align:center}
#tag .k{height:48px;font-size:38px;font-weight:800}
#tag .v{height:140px;font-size:126px;line-height:1.1;white-space:nowrap}
/* receipt */
#impressora{position:absolute;left:110px;width:860px;top:400px;height:44px;border-radius:22px;background:var(--texto);opacity:.9}
#cupomW{position:absolute;left:150px;width:780px;top:420px;height:1060px;overflow:hidden}
#cupom{position:absolute;left:0;top:0;width:780px;padding:46px 48px 40px;background:var(--texto);color:var(--fundo);font-family:var(--fb);box-shadow:var(--sombra)}
body.e-claro #cupom,body.e-papel #cupom,body.e-pop #cupom{background:var(--cartao);color:var(--texto)}
body.e-pop #cupom{border:5px solid var(--texto)}
#cupom:after{content:'';position:absolute;left:0;right:0;bottom:-18px;height:18px;background:radial-gradient(circle at 18px 0,var(--texto) 17px,transparent 18px) 0 0/36px 18px repeat-x}
body.e-claro #cupom:after,body.e-papel #cupom:after,body.e-pop #cupom:after{background-image:radial-gradient(circle at 18px 0,var(--cartao) 17px,transparent 18px)}
#cupom .cab{height:54px;font-size:38px;font-weight:900;letter-spacing:.12em;text-align:center}
#cupom .ln{display:flex;justify-content:space-between;gap:20px;height:58px;font-size:40px;font-weight:700;align-items:center}
#cupom .ln .a{flex:1;min-width:0;height:54px;line-height:54px;white-space:nowrap}
#cupom .ln .b{flex:none;width:230px;height:54px;line-height:54px;text-align:right;white-space:nowrap}
#cupom .div{border-top:4px dashed currentColor;opacity:.35;margin:18px 0}
#cupom .tot{font-size:46px;font-weight:900;height:66px}
#cupom .tot .a,#cupom .tot .b{height:62px;line-height:62px}
#cupom .riscado{position:relative}
#risco{position:absolute;right:0;top:30px;height:8px;width:0;background:var(--ruim);border-radius:4px;transform:rotate(-6deg);transform-origin:100% 50%}
#eco{position:absolute;left:150px;width:600px;top:1180px;padding:24px 30px;border-radius:28px;background:var(--bom);color:var(--sobre-bom);text-align:center;transform-origin:50% 50%;box-shadow:var(--sombra)}
#eco .k{height:50px;font-size:40px;font-weight:800}
#eco .v{height:118px;font-size:104px;line-height:1.12;white-space:nowrap}
#eco .p{height:44px;font-size:34px;font-weight:700}
body.f-story #grade,body.f-story #titulo{width:900px}

/* carousel */
.slide .tt{position:absolute;left:84px;right:84px;top:150px;height:96px;font-size:76px;line-height:1.1}
.slide .st{position:absolute;left:84px;right:84px;top:252px;height:60px;font-size:42px;font-weight:700}
.slide.capa .fotos{position:absolute;left:84px;right:84px;top:150px;height:560px}
.slide.capa .fotos div{position:absolute;width:400px;height:400px;border-radius:50%;overflow:hidden;box-shadow:var(--sombra);border:10px solid var(--cartao);background:var(--fundo2);display:flex;align-items:center;justify-content:center;color:var(--destaque)}
.slide.capa .fotos div .ico{font-size:160px}
.slide.capa .fotos img{width:100%;height:100%;object-fit:cover}
.slide.capa .nome{position:absolute;left:84px;right:84px;top:760px;height:230px;font-size:120px;line-height:.98}
.slide.capa .por{position:absolute;left:84px;top:1020px;font-size:64px;padding:18px 40px;white-space:nowrap}
.slide.capa .pe,.slide .pe{position:absolute;left:84px;right:84px;bottom:76px;height:50px;font-size:34px;font-weight:700;text-align:right}
.slide .grade2{position:absolute;left:84px;right:84px;top:340px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.slide .grade2 .it{position:relative;flex-direction:column;align-items:center;text-align:center;padding:24px 20px;gap:14px}
.slide .grade2 .it .nm{justify-content:center;font-size:38px;height:88px}
.slide .grade2.n1 .it{flex-direction:row;text-align:left}
.slide.cupom-s .pilha{position:absolute;left:84px;right:84px;top:150px;bottom:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px}
.slide.cupom-s #cupomW{position:relative;left:auto;top:auto;height:auto;width:800px;overflow:visible}
.slide.cupom-s #cupom{position:relative;width:800px}
.slide.cupom-s #eco{position:relative;left:auto;top:auto;width:600px}
.slide .grade2.n1 .it{text-align:left}
</style></head><body><div id="palco">

<div class="cena" id="cK"><div class="cam full">
 <div class="ctr tit t seg" id="titulo"></div>
 <div id="grade"></div>
 <div id="caixa">
  <div id="interior"></div>
  <div id="voo"></div>
  <div class="aba" id="abaE"></div><div class="aba" id="abaD"></div>
  <div id="frente"><div id="janela"><img id="janImg" alt=""></div><div class="tit t seg" id="rotulo"></div></div>
  <div id="fita"></div>
  <div id="tagW"><div id="corda"></div><div id="tag" class="cartao"><div class="k t t2 seg">tudo por</div><div class="v tit t seg" id="tagV"></div></div></div>
 </div>
</div></div>

<div class="cena" id="cR"><div class="cam full">
 <div id="impressora"></div>
 <div id="cupomW"><div id="cupom"></div></div>
 <div id="eco"><div class="k t seg">economia de</div><div class="v tit t seg" id="ecoV"></div><div class="p t seg" id="ecoP"></div></div>
</div></div>

</div>
<script src="../motor/motor.js"></script>
<script>
// "Combo ou kit": items come together in a box, and the saving against buying each one apart is worked out by the
// code (the template refuses a combo that is not cheaper). Scenes (and falas): 0 items enter one by one with their
// own price, 1 they fly into the box and the flaps close, 2 the box gets the combo price tag, 3 a receipt prints the
// sum apart, the combo price and the saving, 4 call (engine's final scene).
const nb = s => s.replace(/ /g, ' ');
const c2 = v => Math.round(v * 100) / 100;
let D = {};
function conta(F, $m) {
  if (F.falas && F.falas.length !== 5) $m.erro('falas: 5 (itens, caixa, preço do combo, economia, chamada)');
  const soma = c2(F.itens.reduce((s, i) => s + i.preco, 0));
  if (F.preco_combo >= soma) $m.erro(`o combo (${$m.brl(F.preco_combo)}) não é mais barato que os itens separados (${$m.brl(soma)})`);
  if (F.itens.some(i => !i.foto) && !F.foto_kit) $m.erro('item sem foto: mande a foto do kit montado (foto_kit)');
  const eco = c2(soma - F.preco_combo);
  return { soma, eco, pct: Math.floor(eco / soma * 100) };
}
function bola(it, $m, icone) {
  const d = document.createElement('div'); d.className = 'ph';
  if (it.foto) { const i = document.createElement('img'); i.src = $m.midia(it.foto); i.alt = it.nome; d.appendChild(i); } else d.innerHTML = $m.icone(icone || 'caixa');
  return d;
}
function cartao(it, $m, icone) {
  const d = document.createElement('div'); d.className = 'it cartao';
  const tx = document.createElement('div'); tx.className = 'tx';
  const nm = document.createElement('div'); nm.className = 'nm t seg'; nm.textContent = it.nome;
  const pr = document.createElement('div'); pr.className = 'pr chip t seg'; pr.textContent = nb($m.brl(it.preco));
  tx.append(nm, pr); d.append(bola(it, $m, icone), tx); return d;
}
function cupom(F, $m, alvo) {
  const { brl } = $m, c = alvo; c.innerHTML = '';
  const add = (cls, a, b) => { const l = document.createElement('div'); l.className = cls; if (b === undefined) { l.textContent = a; } else { const x = document.createElement('div'); x.className = 'a t'; x.textContent = a; const y = document.createElement('div'); y.className = 'b t'; y.textContent = b; l.append(x, y); } l.classList.add('t'); c.appendChild(l); return l; };
  add('cab', 'COMPRANDO SEPARADO');
  F.itens.forEach(i => add('ln', i.nome, nb(brl(i.preco))));
  const dv = document.createElement('div'); dv.className = 'div'; c.appendChild(dv);
  const sp = add('ln tot riscado', 'Separado', nb(brl(D.soma))); const r = document.createElement('div'); r.id = 'risco'; sp.appendChild(r);
  add('ln tot', 'No combo', nb(brl(F.preco_combo)));
  // the lines do not shrink like headings: they keep a single size so the columns line up
  c.querySelectorAll('.t').forEach(e => { e.dataset.min = $m.FORMATO === 'carrossel' ? 26 : 30; });
}
Motor.molde({
  id: 'combo', formatos: ['reel', 'carrossel'],
  montar(F, M, $m) {
    const { $, brl } = $m;
    D = conta(F, $m);
    const n = F.itens.length;
    $('#titulo').textContent = F.nome;
    // grid: one column up to 3 items, two columns from 4
    const col = n <= 3 ? 1 : 2, lin = Math.ceil(n / col), gap = 24, w = col === 1 ? 820 : 398, h = Math.min(col === 1 ? 260 : 440, Math.floor((900 - gap * (lin - 1)) / lin)), ph = col === 1 ? Math.min(h - 36, 200) : Math.min(h - 190, 220);
    D.pos = [];
    F.itens.forEach((it, k) => { const d = cartao(it, $m, F.icone); const x = (k % col) * (w + gap), y = Math.floor(k / col) * (h + gap);
      Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); d.dataset.k = k;
      const b = d.querySelector('.ph'); b.style.width = b.style.height = ph + 'px';
      if (col === 2) { d.classList.add('vert'); }
      $('#grade').appendChild(d); D.pos.push(col === 2 ? [90 + x + w / 2, 540 + y + 20 + ph / 2] : [90 + x + 18 + ph / 2, 540 + y + h / 2]);
      const v = bola(it, $m, F.icone); v.dataset.k = k; $('#voo').appendChild(v); });
    $('#janImg').src = $m.midia(F.foto_kit || (F.itens.find(i => i.foto) || {}).foto);
    $('#rotulo').textContent = F.nome;
    $('#tagV').textContent = nb(brl(F.preco_combo));
    cupom(F, $m, $('#cupom'));
    $('#ecoV').textContent = nb(brl(D.eco)); $('#ecoP').textContent = D.pct >= 1 ? D.pct + '% a menos que separado' : 'a menos que separado';
    return { duracoes: [0.9 + n * 0.45, 2.4, 2.6, 3.0] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, lerp, ini } = $m;
    const S1 = ini(1), S2 = ini(2), S3 = ini(3);
    $m.cena('#cK', t, 0, 2);
    // title: "monte o combo" while items arrive, the combo name takes over when the box is priced
    $('#titulo').style.opacity = eo(p(t, 0.05, 0.4)) * (1 - eo(p(t, S2 - 0.1, 0.3)));
    // 0: cards pop in one by one
    $$('#grade .it').forEach(d => { const k = +d.dataset.k, q = eb(p(t, 0.3 + k * 0.4, 0.5)), ida = p(t, S1 + 0.15 + k * 0.18, 0.25);
      d.style.opacity = cl(q * 2) * (1 - ida); d.style.transform = `translateY(${(1 - q) * 80}px) scale(${(0.8 + 0.2 * q) * (1 - 0.3 * ida)})`; });
    // the box rises from the bottom as the items start to leave
    const cx = eo5(p(t, S1, 0.55)), sobe = eio(p(t, S2 - 0.05, 0.7));
    $('#caixa').style.transform = `translate(${-lerp(0, 0, sobe)}px,${(1 - cx) * 700 - lerp(0, 520, sobe)}px) scale(${lerp(1, 1.08, sobe)})`;
    $('#caixa').style.opacity = t < S1 ? 0 : 1;
    // 1: each item flies in an arc into the open box and drops behind the front panel
    const bx = 250, by = 1030;
    $$('#voo .ph').forEach(v => { const k = +v.dataset.k, a = S1 + 0.15 + k * 0.18, q = p(t, a, 0.75); if (q <= 0 || q >= 1) { v.style.opacity = 0; return; }
      const [x0, y0] = D.pos[k], x1 = 290 + (k % 3 - 1) * 90, y1 = 120, e = eio(q);
      const x = lerp(x0 - bx, x1, e), y = lerp(y0 - by, y1, e) - Math.sin(e * Math.PI) * 260;
      v.style.opacity = 1; v.style.transform = `translate(${x - 75}px,${y - 75}px) scale(${lerp(1, 0.55, e)}) rotate(${e * 200}deg)`; });
    // flaps: wide open, then they close one after the other, then the tape
    const n = F.itens.length, fecha = S1 + 0.15 + n * 0.18 + 0.75;
    const fe = eb(p(t, fecha, 0.35)), fd = eb(p(t, fecha + 0.18, 0.35));
    $('#abaE').style.transform = `rotate(${lerp(-104, 0, fe)}deg)`; $('#abaD').style.transform = `rotate(${lerp(104, 0, fd)}deg)`;
    $('#interior').style.opacity = 1 - p(t, fecha + 0.3, 0.2);
    $('#fita').style.transform = `scaleY(${eo(p(t, fecha + 0.5, 0.35))})`;
    const pula = p(t, fecha + 0.18, 0.4); $('#frente').style.translate = `0 ${-Math.sin(pula * Math.PI) * 14}px`;
    // 2: price tag drops and swings
    const tg = p(t, S2 + 0.35, 2.2), ti = eo5(p(t, S2 + 0.35, 0.5));
    $('#tagW').style.opacity = t >= S2 + 0.35 ? 1 : 0;
    $('#tagW').style.transform = `translateY(${(1 - ti) * -300}px) rotate(${-18 * Math.exp(-tg * 3) * Math.cos(tg * 14)}deg)`;
    // 3: receipt prints out of the slot, the sum apart is struck, the saving is stamped
    $m.cena('#cR', t, 3);
    const ch = $('#cupom').offsetHeight + 20, pr = eio(p(t, S3 + 0.2, 1.3));
    $('#cupom').style.transform = `translateY(${-ch + pr * ch}px)`;
    $('#risco').style.width = eo(p(t, S3 + 1.5, 0.3)) * 230 + 'px';
    const ec = $('#eco'); const cy = Math.min(420 + ch + 10, 1480 - ec.offsetHeight); ec.style.top = cy + 'px';
    const q = p(t, S3 + 1.85, 0.35), s = q === 0 ? 0 : 1 + 1.2 * Math.pow(1 - eo(q), 2);
    ec.style.opacity = q > 0 ? 1 : 0; ec.style.transform = `scale(${s}) rotate(-4deg)`;
  },
  slides(F, M, $m) {
    const { $$, brl } = $m;
    D = conta(F, $m);
    const palco = $m.$('#palco');
    const cupomOrig = $m.$('#cR'); const cup = $m.$('#cupomW', cupomOrig), eco = $m.$('#eco', cupomOrig);
    $$('.cena', palco).forEach(c => c.remove());
    // 1 cover: item photos, name, combo price
    const capa = document.createElement('div'); capa.className = 'slide capa';
    capa.innerHTML = '<div class="fotos"></div><div class="nome tit t seg"></div><div class="por chip t seg"></div><div class="pe t2 t">arrasta para ver a conta</div>';
    const fs = F.foto_kit ? [{ foto: F.foto_kit, nome: F.nome }] : F.itens.slice(0, 3);
    const pos = fs.length === 1 ? [[180, 20, 1.3, -3]] : fs.length === 2 ? [[40, 60, 1, -6], [440, 0, 1, 5]] : [[0, 90, .9, -6], [300, 0, 1, 3], [560, 120, .85, 8]];
    fs.forEach((it, k) => { const b = bola(it, $m, F.icone); b.className = ''; const [x, y, s, r] = pos[k]; Object.assign(b.style, { left: x + 'px', top: y + 'px', transform: `scale(${s}) rotate(${r}deg)` }); capa.querySelector('.fotos').appendChild(b); });
    capa.querySelector('.nome').textContent = F.nome;
    capa.querySelector('.por').textContent = 'tudo por ' + nb(brl(F.preco_combo));
    palco.appendChild(capa);
    // 2 what comes in it
    const s2 = document.createElement('div'); s2.className = 'slide';
    s2.innerHTML = '<div class="tt tit t seg"></div><div class="st t t2 seg"></div><div class="grade2"></div>';
    s2.querySelector('.tt').textContent = 'O que vem no combo'; s2.querySelector('.st').textContent = F.itens.length + ' itens, com o preço de cada um separado';
    const g = s2.querySelector('.grade2'), n = F.itens.length; if (n <= 3) { g.classList.add('n1'); g.style.gridTemplateColumns = '1fr'; }
    const lin = n <= 3 ? n : Math.ceil(n / 2), h = Math.floor((880 - 24 * (lin - 1)) / lin);
    F.itens.forEach(it => { const c = cartao(it, $m, F.icone); c.style.height = h + 'px'; const b = c.querySelector('.ph'); const ph = Math.min(h - (n <= 3 ? 40 : 170), 200); b.style.width = b.style.height = Math.max(90, ph) + 'px'; g.appendChild(c); });
    palco.appendChild(s2);
    // 3 the receipt
    const s3 = document.createElement('div'); s3.className = 'slide cupom-s'; const pl = document.createElement('div'); pl.className = 'pilha'; pl.append(cup, eco); s3.appendChild(pl); palco.appendChild(s3);
    cupom(F, $m, $m.$('#cupom', s3));
    $m.$('#ecoV', s3).textContent = nb(brl(D.eco)); $m.$('#ecoP', s3).textContent = D.pct >= 1 ? D.pct + '% a menos que separado' : 'a menos que separado';
    $m.$('#risco', s3).style.width = '230px'; eco.style.transform = 'rotate(-4deg)';
  },
});
</script></body></html>
