<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* versus screen: two photos smash together on a diagonal seam, an OU coin slams in the middle, the choice
   ping-pongs between the sides */
:root{--y0:430px;--ph:950px}
body.f-story{--y0:400px;--ph:790px}
#capT{left:110px;top:520px;width:860px;height:300px;font-size:190px;line-height:.95}
#capS{left:150px;top:830px;width:780px;height:70px;font-size:46px;font-weight:700}
#capA,#capB{position:absolute;top:980px;width:380px;height:460px;border-radius:40px;overflow:hidden;box-shadow:var(--sombra)}
body.f-story #capA,body.f-story #capB{top:940px;height:300px}
#capA{left:110px}#capB{right:110px}
#capA img,#capB img{width:100%;height:100%;object-fit:cover}
#capOu{position:absolute;left:440px;top:1110px;width:200px;height:200px}
body.f-story #capOu{top:990px}
.lado{position:absolute;top:var(--y0);height:var(--ph);width:610px;overflow:hidden}
.lado.a{left:0;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);transform-origin:0 50%}
.lado.b{left:470px;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%);transform-origin:100% 50%}
.lado img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lado .gr{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78))}
.lado .nm{position:absolute;bottom:40px;width:380px;height:150px;font-size:58px;line-height:1.05;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.lado.a .nm{left:90px}
.lado.b .nm{left:100px;width:310px;text-align:right}
.lado .lt{position:absolute;top:34px;width:84px;height:84px;border-radius:50%;background:var(--destaque);color:var(--sobre-destaque);font-family:var(--ft);font-weight:900;font-size:48px;line-height:84px;text-align:center}
.lado.a .lt{left:90px}.lado.b .lt{right:110px}
.ou{position:absolute;width:210px;height:210px;border-radius:50%;background:var(--destaque);color:var(--sobre-destaque);display:flex;align-items:center;justify-content:center;font-family:var(--ft);font-weight:900;font-size:92px;box-shadow:0 0 0 12px var(--fundo),0 20px 50px rgba(0,0,0,.35)}
body.e-pop .ou{box-shadow:0 0 0 10px var(--texto),12px 12px 0 10px var(--texto)}
body.e-noite .ou{box-shadow:0 0 0 8px var(--fundo),0 0 60px var(--destaque)}
.par .ou{left:435px;top:calc(var(--y0) + var(--ph) / 2 - 105px)}
.par .cont{position:absolute;left:390px;top:calc(var(--y0) - 46px);width:300px;height:72px;line-height:72px;padding:0;text-align:center;font-size:38px;z-index:3}
#fimT{left:110px;top:410px;width:860px;height:300px;font-size:128px;line-height:1}
#fimL{position:absolute;left:110px;top:760px;width:760px;display:flex;flex-direction:column;gap:22px}
#fimL .lin{display:flex;align-items:center;gap:18px;height:120px}
#fimL .n{flex:none;width:76px;font-family:var(--ft);font-weight:900;font-size:60px;color:var(--destaque);text-align:center}
#fimL .fa,#fimL .fb{flex:none;width:120px;height:120px;border-radius:30px;overflow:hidden}
#fimL img{width:100%;height:100%;object-fit:cover}
#fimL .o{flex:none;width:64px;height:64px;border-radius:50%;background:var(--destaque);color:var(--sobre-destaque);font-family:var(--ft);font-weight:900;font-size:28px;line-height:64px;text-align:center;margin:0 -30px;z-index:1}
#fimL .tx{flex:1;height:110px;font-size:40px;font-weight:700;line-height:1.15;display:flex;align-items:center;margin-left:18px}
#seta{position:absolute;left:485px;top:1150px;font-size:110px;color:var(--destaque);display:none}
body.f-story #seta{display:block}
body.f-story #fimT{height:220px}
body.f-story #fimL{top:650px;gap:12px}
body.f-story #fimL .lin{height:90px}
body.f-story #fimL .fa,body.f-story #fimL .fb{width:90px;height:90px}
body.f-story #fimL .tx{height:90px}
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="capT" class="ctr tit t seg rv"></div>
 <div id="capS" class="ctr t t2 seg"></div>
 <div id="capA"><img alt=""></div><div id="capB"><img alt=""></div>
 <div class="ou" id="capOu">OU</div>
</div></div>

<div class="cena" id="cf"><div class="cam full">
 <div id="fimT" class="ctr tit t seg"></div>
 <div id="fimL"></div>
 <div id="seta"></div>
</div></div>

</div>
<script src="../motor/motor.js"></script>
<script>
// "Isso ou aquilo": pairs of the business's own products. Each pair is a versus screen: the two photos smash in on a
// diagonal seam, the OU coin slams between them and the choice ping-pongs from side to side. Closes asking for the
// answer in the comments (Reel) or in the native poll (story keeps the bottom band empty for the poll sticker).
let D = {};
Motor.molde({
  id: 'escolha', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $, midia, icone } = $m, n = F.pares.length, story = $m.FORMATO === 'story';
    F.pares.forEach((q, i) => { if (q.foto_a === q.foto_b) $m.erro(`pares[${i + 1}]: as duas fotos são a mesma`); if (q.nome_a.trim().toLowerCase() === q.nome_b.trim().toLowerCase()) $m.erro(`pares[${i + 1}]: os dois nomes são iguais`); });
    $('#capT').textContent = F.titulo || 'Escolhe um';
    $('#capS').textContent = F.subtitulo || `${n} rodadas, sem pensar muito`;
    $('#capA img').src = midia(F.pares[0].foto_a); $('#capB img').src = midia(F.pares[0].foto_b);
    const fim = $('#cf');
    F.pares.forEach((q, i) => {
      const c = document.createElement('div'); c.className = 'cena par'; c.id = 'par' + i;
      c.innerHTML = '<div class="cam full"><div class="lado a"><img alt=""><div class="gr"></div><div class="lt">A</div><div class="nm tit t seg"></div></div>' +
        '<div class="lado b"><img alt=""><div class="gr"></div><div class="lt">B</div><div class="nm tit t seg"></div></div><div class="ou">OU</div><div class="cont chip t seg"></div></div>';
      c.querySelector('.a img').src = midia(q.foto_a); c.querySelector('.b img').src = midia(q.foto_b);
      c.querySelector('.a .nm').textContent = q.nome_a; c.querySelector('.b .nm').textContent = q.nome_b;
      c.querySelector('.cont').textContent = `${i + 1} de ${n}`;
      fim.before(c);
    });
    $('#fimT').textContent = story ? (F.final || 'Vota na enquete') : (F.final || 'Conta nos comentários');
    F.pares.forEach((q, i) => { const l = document.createElement('div'); l.className = 'lin';
      l.innerHTML = '<div class="n"></div><div class="fa"><img alt=""></div><div class="o">ou</div><div class="fb"><img alt=""></div><div class="tx t seg"></div>';
      l.querySelector('.n').textContent = i + 1; l.querySelector('.fa img').src = midia(q.foto_a); l.querySelector('.fb img').src = midia(q.foto_b);
      l.querySelector('.tx').textContent = story ? `${q.nome_a} ou ${q.nome_b}` : `${i + 1}A ${q.nome_a}, ${i + 1}B ${q.nome_b}`; $('#fimL').appendChild(l); });
    $('#seta').innerHTML = icone('seta'); $('#seta').style.transform = 'rotate(90deg)';
    const por = Math.min(2.6, Math.max(1.8, 8.4 / n));
    const d = [1.9, ...F.pares.map(() => +por.toFixed(2)), 2.6];
    D.ult = d.length - 1;
    // render.py's contact sheet breaks on a last row of one picture (7 or 13 scenes with the final): split the close
    if ((d.length + 1) % 6 === 1) d.splice(d.length - 1, 1, 1.3, 1.3);
    return { duracoes: d };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, ini } = $m, n = F.pares.length;
    // both photos of a pair must look alike in quality: compare pixels once all pictures are loaded
    if (!D.qual) { D.qual = 1; F.pares.forEach((q, i) => { const a = $(`#par${i} .a img`), b = $(`#par${i} .b img`);
      const pa = a.naturalWidth * a.naturalHeight, pb = b.naturalWidth * b.naturalHeight;
      if (Math.min(a.naturalWidth, a.naturalHeight, b.naturalWidth, b.naturalHeight) < 480) $m.erro(`pares[${i + 1}]: foto pequena demais (menos de 480 px)`);
      else if (Math.min(pa, pb) / Math.max(pa, pb) < 0.45) $m.erro(`pares[${i + 1}]: as duas fotos têm qualidade muito diferente; use fotos parecidas`); }); }
    // cover
    $m.cena('#c0', t, 0, 0, { sobra: 0.05 });
    $m.revela('#capT', t, 0.1, 0.1); $m.entra('#capS', t, 0.6, 0.4, 30);
    const ca = eo5(p(t, 0.3, 0.6)), cb = eo5(p(t, 0.45, 0.6));
    $('#capA').style.transform = `translateX(${(1 - ca) * -600}px) rotate(${-7 + Math.sin(t * 2) * 1.5}deg)`;
    $('#capB').style.transform = `translateX(${(1 - cb) * 600}px) rotate(${7 - Math.sin(t * 2) * 1.5}deg)`;
    const co = el(p(t, 0.9, 0.8)); $('#capOu').style.transform = `scale(${Math.max(0, co)}) rotate(${(1 - cl(co)) * -200}deg)`;
    // pairs
    F.pares.forEach((q, i) => {
      const k = 1 + i, a = ini(k), b = ini(k + 1), sel = '#par' + i;
      $m.cena(sel, t, k, k, { trans: 'corte', sobra: 0.3 });
      const ent = eo5(p(t, a, 0.38)), sai = eio(p(t, b, 0.3));
      const A = $(sel + ' .a'), B = $(sel + ' .b');
      // smash: both sides slam to the seam, the screen jolts on impact
      const imp = Math.exp(-Math.max(0, t - a - 0.3) * 9) * (t > a + 0.3 ? 1 : 0);
      const jx = Math.sin(t * 80) * 14 * imp;
      A.style.translate = `${(1 - ent) * -640 - sai * 700 + jx}px 0`; B.style.translate = `${(1 - ent) * 640 + sai * 700 + jx}px 0`;
      // ping-pong of the choice
      const pp = t - a - 0.85, lado = pp > 0 && pp < 1.0 ? (Math.floor(pp / 0.25) % 2) : -1;
      const fa = lado === 1 ? 0.45 : 1, fb = lado === 0 ? 0.45 : 1;
      A.querySelector('img').style.filter = `brightness(${fa})`; B.querySelector('img').style.filter = `brightness(${fb})`;
      A.style.scale = lado === 0 ? '1.025' : '1'; B.style.scale = lado === 1 ? '1.025' : '1';
      $$(sel + ' img').forEach(im => { im.style.transform = `scale(${1.06 + 0.04 * p(t, a, b - a)})`; });
      const ou = el(p(t, a + 0.3, 0.75)), o = $(sel + ' .ou');
      o.style.transform = `scale(${Math.max(0, ou) * (1 - sai)}) rotate(${(1 - cl(ou)) * 260}deg)`;
      const cn = $(sel + ' .cont'); cn.style.opacity = eo(p(t, a + 0.2, 0.3)) * (1 - sai);
    });
    // close
    const F0 = ini(D.ult); $m.cena('#cf', t, D.ult, $m.N - 2);
    $m.entra('#fimT', t, F0 + 0.1, 0.45, 40);
    $$('#fimL .lin').forEach((l, j) => $m.entra(l, t, F0 + 0.35 + j * 0.12, 0.45, 40));
    if ($m.FORMATO === 'story') { const s = $('#seta'); s.style.opacity = eo(p(t, F0 + 0.9, 0.3)); s.style.translate = `0 ${Math.abs(Math.sin((t - F0) * 5)) * 30}px`; }
  },
});
</script></body></html>
