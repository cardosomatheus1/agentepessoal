<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* "Oferta completa": the whole offer in one narrated Reel. The result the viewer wants, the offer's name, then
   what goes in: each piece lands on a receipt with its value while a big card tells what it is; the receipt adds up
   (the code sums it), the price arrives next to the value (never as a struck-out "from" price: the value is a
   reference, not a price that was charged), the guarantee is stamped by a seal and the real capacity limit shows as
   slots, with no countdown. Then the engine's final scene. */
/* softer gradient than the engine's: the second brand color is often too light for a light background */
.grad,#nNome .wi{background-image:linear-gradient(100deg,var(--destaque),color-mix(in srgb,var(--c2) 50%,var(--destaque)))}
#nota{top:342px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);padding:4px 20px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--fundo) 80%,transparent)}
/* 0 result */
#hero{position:absolute;inset:0;overflow:hidden}
#heroI{position:absolute;left:-420px;top:0;width:1920px;height:1920px;object-fit:cover}
#hero:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.62) 35%,rgba(0,0,0,.78) 70%,rgba(0,0,0,.6))}
#pq{position:absolute;left:90px;top:440px;font-size:38px;white-space:nowrap}
#res{position:absolute;left:90px;width:820px;top:540px;height:780px;font-size:104px;line-height:1.08;display:flex;align-items:center}
#res>div{width:100%}
#c0.foto #res{color:#fff}
#c0.foto #res .mk{color:var(--sobre-destaque)}
/* 1 name */
#raios{position:absolute;left:-160px;top:100px;width:1400px;height:1400px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--destaque) 20%,transparent) 0deg 7deg,transparent 7deg 22.5deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 66%);mask-image:radial-gradient(circle,#000 18%,transparent 66%)}
#nSelo{position:absolute;left:50%;top:520px;font-size:40px;white-space:nowrap}
#nNome{position:absolute;left:100px;width:810px;top:620px;height:380px;font-size:132px;line-height:1.0;text-align:center;display:flex;align-items:center;justify-content:center}
#nNome>div{width:100%}
/* the gradient goes on each word: a parent's background-clip:text does not reach transformed word boxes */
#nNome .wi{-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em}
#nSub{position:absolute;left:130px;width:750px;top:1030px;height:130px;font-size:46px;font-weight:700;line-height:1.3;text-align:center}
/* 2.. receipt + focus card */
#rec{position:absolute;left:80px;width:830px;top:384px;padding:20px 28px 18px}
#recCab{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:3px dashed var(--borda)}
#recTit{height:44px;font-size:34px;font-weight:900;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
#recVal{height:44px;font-size:30px;font-weight:800;letter-spacing:2px;white-space:nowrap}
.lin{position:relative;display:flex;align-items:center;gap:14px;height:58px;padding:0 6px;border-radius:14px}
.lin .li{flex:none;width:40px;height:40px;border-radius:50%;background:var(--destaque);color:var(--sobre-destaque);font-size:26px;display:flex;align-items:center;justify-content:center}
.lin .ln{flex:1;height:42px;font-size:32px;font-weight:800;white-space:nowrap}
.lin .lv{flex:none;width:170px;height:42px;font-size:34px;text-align:right;white-space:nowrap}
.lin .lv.inc{font-family:var(--fb),sans-serif;font-size:30px;font-weight:800;color:var(--destaque)}
.lin.agora{background:color-mix(in srgb,var(--destaque) 18%,transparent)}
#recTot{display:flex;justify-content:space-between;align-items:center;height:76px;margin-top:6px;border-top:3px dashed var(--borda)}
#recTotK{height:44px;font-size:34px;font-weight:900;white-space:nowrap}
#recTotV{width:300px;height:56px;font-size:48px;text-align:right;white-space:nowrap}
#foco{position:absolute;left:80px;width:830px;top:980px;height:460px;overflow:hidden}
.fc{position:absolute;inset:0}
.fc .fi{position:absolute;left:40px;top:40px;width:116px;height:116px;border-radius:34px;background:var(--destaque);color:var(--sobre-destaque);font-size:66px;display:flex;align-items:center;justify-content:center}
body.e-pop .fc .fi{border:5px solid var(--texto)}
.fc .fk{position:absolute;left:184px;top:76px;height:44px;font-size:32px;font-weight:800;white-space:nowrap}
.fc .fv{position:absolute;right:40px;top:44px;width:360px;height:110px;font-size:100px;text-align:right;white-space:nowrap}
.fc .fv.inc{top:62px;height:76px;width:auto;font-size:44px;line-height:76px;padding:0 30px}
.fc .fn{position:absolute;left:40px;width:750px;top:186px;height:136px;font-size:62px;line-height:1.08}
.fc .fd{position:absolute;left:40px;width:750px;top:330px;height:104px;font-size:38px;font-weight:700;line-height:1.3}
#tot{position:absolute;left:80px;width:830px;top:990px;height:440px;text-align:center}
#totK{height:64px;font-size:50px;font-weight:800;white-space:nowrap}
#totV{height:230px;margin-top:20px;font-size:200px;line-height:1.1;white-space:nowrap}
#totS{height:52px;margin-top:10px;font-size:36px;font-weight:700;white-space:nowrap}
/* price */
#pValor{position:absolute;left:100px;width:810px;top:420px;height:64px;font-size:46px;font-weight:800;text-align:center;white-space:nowrap}
#pVoce{position:absolute;left:100px;width:810px;top:520px;height:110px;font-size:96px;line-height:110px;text-align:center;color:var(--destaque);white-space:nowrap}
#pPreco{position:absolute;left:100px;width:810px;top:630px;height:270px;font-size:240px;line-height:1.1;text-align:center;white-space:nowrap}
#pPer{position:absolute;left:100px;width:810px;top:900px;height:64px;font-size:50px;font-weight:800;text-align:center;white-space:nowrap}
.cond{position:absolute;left:100px;width:810px;height:100px;display:flex;justify-content:center}
.cond>div{display:flex;align-items:center;gap:18px;height:100px;padding:0 40px;border-radius:999px;background:var(--cartao);border:1.5px solid var(--borda);box-shadow:var(--sombra)}
body.e-pop .cond>div{border:5px solid var(--texto);box-shadow:8px 8px 0 var(--texto)}
.cond .ico{flex:none;font-size:48px;color:var(--destaque)}
.cond .ct{height:56px;font-size:46px;font-weight:900;white-space:nowrap}
/* guarantee */
#gSelo{position:absolute;left:350px;top:390px;width:380px;height:380px}
#gSelo svg{width:100%;height:100%;overflow:visible}
#gTit{position:absolute;left:100px;width:810px;top:790px;height:110px;font-size:92px;text-align:center;white-space:nowrap}
#gCard{position:absolute;left:90px;width:820px;top:930px;padding:40px 46px}
#gTx{width:728px;font-size:46px;font-weight:800;line-height:1.3}
/* long guarantee (over 150 letters): smaller seal, the card starts higher and the letters are smaller */
#cG.longa #gSelo{left:390px;top:380px;width:300px;height:300px}
#cG.longa #gTit{top:690px;height:100px;font-size:84px}
#cG.longa #gCard{top:800px;padding:34px 44px}
#cG.longa #gTx{width:732px;font-size:42px;line-height:1.28}
/* capacity */
#vK{position:absolute;left:50%;top:420px;font-size:40px;white-space:nowrap}
#vNum{position:absolute;left:100px;width:810px;top:500px;height:330px;font-size:320px;line-height:1.0;text-align:center;white-space:nowrap}
#vRot{position:absolute;left:100px;width:810px;top:840px;height:170px;font-size:76px;line-height:1.06;text-align:center}
.slot{position:absolute;width:120px;height:120px;border-radius:30px;border:6px solid var(--destaque);color:var(--destaque);font-size:64px;display:flex;align-items:center;justify-content:center}
.slot.on{background:var(--destaque);color:var(--sobre-destaque)}
body.e-pop .slot{border-color:var(--texto)}
#vMot{position:absolute;left:100px;width:810px;height:70px;font-size:44px;font-weight:800;text-align:center;white-space:nowrap}
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="hero"><img id="heroI" alt=""></div>
 <div class="chip t seg" id="pq"></div>
 <div class="tit t seg" id="res"><div class="rv" id="resT"></div></div>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="raios"></div>
 <div class="chip t seg" id="nSelo"></div>
 <div class="tit t seg" id="nNome"><div class="rv" id="nNomeT"></div></div>
 <div class="t t2 seg" id="nSub"></div>
</div></div>

<div class="cena" id="cI"><div class="cam full">
 <div id="rec" class="cartao">
  <div id="recCab"><div class="t t2 seg" id="recTit"></div><div class="t t2 seg" id="recVal">VALOR</div></div>
  <div id="linhas"></div>
  <div id="recTot"><div class="t seg" id="recTotK">Total</div><div class="tit t seg" id="recTotV"></div></div>
 </div>
 <div id="foco" class="cartao"></div>
 <div id="tot"><div class="t t2 seg" id="totK"></div><div class="tit grad t seg" id="totV"></div><div class="t t2 seg" id="totS"></div></div>
</div></div>

<div class="cena" id="cP"><div class="cam full">
 <div class="t t2 seg" id="pValor"></div>
 <div class="mao t seg" id="pVoce">Você paga</div>
 <div class="tit grad t seg" id="pPreco"></div>
 <div class="t t2 seg" id="pPer"></div>
 <div id="pConds"></div>
</div></div>

<div class="cena" id="cG"><div class="cam full">
 <div id="gSelo"><svg viewBox="0 0 200 200">
  <g id="gAnel"><circle cx="100" cy="100" r="96" fill="none" style="stroke:var(--destaque)" stroke-width="5" stroke-dasharray="5 9" stroke-linecap="round"/></g>
  <circle cx="100" cy="100" r="80" style="fill:var(--destaque)"/>
  <circle cx="100" cy="100" r="70" fill="none" style="stroke:var(--sobre-destaque)" stroke-opacity=".35" stroke-width="2.5"/>
  <path d="M100 50 L138 64 V98 C138 124 121 141 100 151 C79 141 62 124 62 98 V64 Z" style="fill:var(--sobre-destaque)"/>
  <path id="gCheck" d="M82 100 L96 114 L120 86" fill="none" style="stroke:var(--destaque)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
 </svg></div>
 <div class="tit t seg" id="gTit"></div>
 <div id="gCard" class="cartao"><div class="t seg" id="gTx"><div class="rv" id="gTxT"></div></div></div>
</div></div>

<div class="cena" id="cV"><div class="cam full">
 <div class="chip t seg" id="vK">Vagas limitadas</div>
 <div class="tit grad t seg" id="vNum"></div>
 <div class="tit t seg" id="vRot"></div>
 <div id="vSlots"></div>

</div></div>

</div>
<script src="../motor/motor.js"></script>
<script>
// Scenes follow the narration (falas): 0 result, 1 the offer's name, 2..n+1 one per piece (n = 3 to 6), the total,
// the price, the guarantee (if any), the capacity (if any) and the call (engine's final scene). So falas = n + 5,
// plus 1 for the guarantee and 1 for the capacity. Every number on screen comes from the ficha; the total is summed here.
let D = {};
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
// the scene enters with the style's transition and the old one also fades out (no two layouts mixed)
const cena = ($m, sel, t, i, j, o) => { const q = $m.cena(sel, t, i, j, o), b = $m.fim(j), e = $m.$(sel); if (t >= b) e.style.opacity = Math.min(+e.style.opacity, 1 - $m.p(t, b, 0.25)); return q; };
const din = ($m, v) => $m.brl(v, Number.isInteger(Math.round(v * 100) / 100) ? 0 : 2);
// the result sentence with its highlighted parts as .mk spans (each part must be in the sentence, written the same)
function frase($m, alvo, texto, partes) {
  const low = texto.toLocaleLowerCase('pt-BR'), marcas = [];
  (partes || []).forEach(k => { const j = low.indexOf(k.trim().toLocaleLowerCase('pt-BR'));
    if (!k.trim() || j < 0) $m.erro(`destaques: "${k}" não está na frase do resultado`);
    else if (marcas.some(m => j < m[1] && j + k.trim().length > m[0])) $m.erro(`destaques: "${k}" repete um trecho já destacado`);
    else marcas.push([j, j + k.trim().length]); });
  marcas.sort((a, b) => a[0] - b[0]); let pos = 0;
  // the highlight and the punctuation right after it stay on one line (a lone comma never opens a line)
  marcas.forEach(([a, b]) => { alvo.append(texto.slice(pos, a)); const pont = /^[.,;:!?)]+/.exec(texto.slice(b)), junto = mk('span', null, null, alvo);
    junto.style.whiteSpace = 'nowrap'; mk('span', 'mk', texto.slice(a, b), junto); if (pont) { junto.append(pont[0]); b += pont[0].length; } pos = b; });
  alvo.append(texto.slice(pos));
}

Motor.molde({
  id: 'oferta-completa', formatos: ['reel'],
  montar(F, M, $m) {
    const { $ } = $m, n = F.itens.length, G = !!F.garantia, V = !!F.vagas;
    const T = n + 2, P = n + 3, GA = G ? n + 4 : -1, VA = V ? n + 4 + (G ? 1 : 0) : -1;
    const esperadas = n + 5 + (G ? 1 : 0) + (V ? 1 : 0);
    if (F.falas.length !== esperadas) $m.erro(`falas: são ${esperadas} (resultado, nome, uma por peça (${n}), total, preço${G ? ', garantia' : ''}${V ? ', vagas' : ''}, chamada); vieram ${F.falas.length}`);
    const comValor = F.itens.filter(x => x.valor != null);
    if (comValor.length < 2) $m.erro('itens: pelo menos 2 peças com valor (sem valor, a peça aparece como incluso)');
    const total = Math.round(comValor.reduce((s, x) => s + x.valor, 0) * 100) / 100;
    if (F.preco >= total) $m.erro(`preço ${din($m, F.preco)} não é menor que o valor somado das peças (${din($m, total)}): a oferta não fecha, use outro molde`);
    if (window.TEMPOS && window.TEMPOS.length > 1) { const dur = window.TEMPOS[window.TEMPOS.length - 1];
      if (dur < 35 || dur > 55) $m.erro(`a narração dura ${dur.toFixed(1)} s; a oferta completa dura de 35 a 55 s (${dur < 35 ? 'alongue' : 'encurte'} as falas)`); }
    D = { n, T, P, GA, VA, total };
    // 0 result
    if (F.midia) $('#c0').classList.add('foto'); else $('#hero').remove();
    if (F.para_quem) $('#pq').textContent = F.para_quem; else $('#pq').remove();
    frase($m, $('#resT'), F.resultado, F.destaques);
    // 1 name
    $('#nSelo').textContent = F.selo || 'Conheça o';
    $('#nNomeT').textContent = F.nome;
    if (F.subtitulo) $('#nSub').textContent = F.subtitulo; else $('#nSub').remove();
    // receipt and focus cards
    $('#recTit').textContent = F.titulo_lista || 'O que entra';
    $('#recTotV').textContent = din($m, total);
    F.itens.forEach((x, k) => {
      const l = mk('div', 'lin', null, $('#linhas')); l.innerHTML = `<div class="li">${$m.icone(x.icone || 'check')}</div>`;
      mk('div', 'ln t seg', x.nome, l); mk('div', 'lv' + (x.valor == null ? ' inc' : ' tit') + ' t seg', x.valor == null ? 'incluso' : din($m, x.valor), l);
      const c = mk('div', 'fc', null, $('#foco')); c.innerHTML = `<div class="fi">${$m.icone(x.icone || 'check')}</div>`;
      mk('div', 'fk t t2 seg', `${k + 1} de ${n}`, c);
      mk('div', x.valor == null ? 'fv inc chip t seg' : 'fv tit grad t seg', x.valor == null ? 'incluso' : din($m, x.valor), c);
      mk('div', 'fn tit t seg', x.nome, c);
      if (x.detalhe) mk('div', 'fd t t2 seg', x.detalhe, c);
    });
    $('#totK').textContent = F.total_rotulo || 'Valor de tudo isso';
    $('#totV').textContent = din($m, total);
    $('#totS').textContent = `${comValor.length} peças com valor` + (n > comValor.length ? ` e ${n - comValor.length} inclusa${n - comValor.length > 1 ? 's' : ''}` : '');
    // price: next to the value, never a struck-out "from" price
    $('#pValor').textContent = (F.total_rotulo || 'Valor de tudo isso') + ': ' + din($m, total);
    $('#pPreco').textContent = din($m, F.preco);
    if (F.periodo) $('#pPer').textContent = F.periodo; else $('#pPer').remove();
    (F.condicoes || []).forEach((c, k) => { const e = mk('div', 'cond', null, $('#pConds')); e.style.top = (1000 + k * 124) + 'px';
      const in_ = mk('div', null, null, e); in_.innerHTML = $m.icone('check'); mk('div', 'ct t seg', c, in_); });
    // guarantee
    if (G) { $('#gTit').textContent = F.garantia.titulo || 'Garantia'; $('#gTxT').textContent = F.garantia.texto;
      const longa = F.garantia.texto.length > 150; if (longa) $('#cG').classList.add('longa');
      const linhas = Math.ceil(F.garantia.texto.length / (longa ? 29 : 27)) + 1; $('#gTx').style.height = Math.min(longa ? 600 : 480, linhas * (longa ? 54 : 60)) + 'px'; }
    else $('#cG').remove();
    // capacity: the real limit as slots (up to 10), never a countdown
    if (V) { const v = F.vagas; $('#vNum').textContent = String(v.numero); $('#vRot').textContent = v.rotulo;
      let fimY = 1030;
      if (v.numero <= 10) { const por = Math.min(5, v.numero), linhas = Math.ceil(v.numero / 5);
        for (let i = 0; i < v.numero; i++) { const r = Math.floor(i / 5), c = i % 5, nr = r === linhas - 1 ? v.numero - r * 5 : por;
          const x0 = 505 - (nr * 120 + (nr - 1) * 24) / 2; const s = mk('div', 'slot', null, $('#vSlots')); s.innerHTML = $m.icone('pessoa');
          Object.assign(s.style, { left: (x0 + c * 144) + 'px', top: (1040 + r * 144) + 'px' }); }
        fimY = 1040 + linhas * 144 + 20; }
      if (v.motivo) { $('#vMot').textContent = v.motivo; $('#vMot').style.top = fimY + 'px'; } else $('#vMot').remove(); }
    else $('#cV').remove();
    $('#nota').textContent = F.nota || '';
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, ini, fim } = $m, n = D.n;
    // 0 result: words come up fast (the hook), then the highlights are marked
    cena($m, '#c0', t, 0, 0, { push: 0.04 });
    if ($('#heroI')) { $m.filmagem($('#heroI'), F.midia, t); }
    if ($('#pq')) $m.entra('#pq', t, 0.05, 0.45, -20);
    $m.revela('#resT', t, 0.12, 0.05);
    const nPal = $$('#resT .wi').length;
    $$('#resT .mk').forEach((e, k) => $m.marcador(e, t, 0.12 + nPal * 0.05 + 0.2 + k * 0.35));
    // 1 name: rays turn, the name rises word by word, light sweeps
    const a1 = ini(1); cena($m, '#c1', t, 1, 1, { push: 0.03 });
    $('#raios').style.transform = `rotate(${(t - a1) * 9}deg) scale(${0.6 + 0.4 * eo5(p(t, a1, 0.9))})`;
    $('#raios').style.opacity = eo(p(t, a1 + 0.1, 0.6));
    $m.entra('#nSelo', t, a1 + 0.05, 0.45, -30); $('#nSelo').style.transform += ' translateX(-50%)';
    $m.revela('#nNomeT', t, a1 + 0.25, 0.09, 0.6);
    if ($('#nSub')) $m.entra('#nSub', t, a1 + 0.8, 0.5, 30);
    // 2..n+1 pieces: receipt line + focus card; T: the total
    const aI = ini(2); cena($m, '#cI', t, 2, D.T, { push: 0.015 });
    const ri = eo5(p(t, aI + 0.05, 0.7)); $('#rec').style.opacity = ri; $('#rec').style.transform = `translateY(${(1 - ri) * -80}px)`;
    let soma = 0, atual = -1;
    $$('.lin').forEach((l, k) => { const a = ini(2 + k), q = eo5(p(t, a + 0.35, 0.5)), v = F.itens[k].valor;
      l.style.opacity = cl(q * 1.5); l.style.transform = `translateX(${(1 - q) * 60}px)`;
      if (t >= a) atual = k;
      l.classList.toggle('agora', t >= a && t < fim(2 + k));
      if (v != null) { soma += v * eo5(p(t, a + 0.45, 0.7)); $m.conta(l.querySelector('.lv'), t, a + 0.45, 0.7, v, x => din($m, x)); } });
    const totV = $('#recTotV'); totV.textContent = din($m, Math.round(soma * 100) / 100);
    const pulso = $$('.lin').reduce((m, _, k) => { const d = t - ini(2 + k) - 0.5; return d > 0 && d < 0.45 ? Math.max(m, Math.sin(d / 0.45 * Math.PI)) : m; }, 0);
    totV.style.transform = `scale(${1 + 0.12 * pulso})`; totV.style.transformOrigin = '100% 50%';
    const sai = eio(p(t, ini(D.T), 0.45));
    $('#foco').style.opacity = eo5(p(t, aI + 0.15, 0.6)) * (1 - sai); $('#foco').style.transform = `translateY(${(1 - eo5(p(t, aI + 0.15, 0.6))) * 160 + sai * 120}px)`;
    $$('#foco .fc').forEach((c, k) => { const a = ini(2 + k), q = k === 0 ? 1 : eo5(p(t, a, 0.5)), fora = k < n - 1 ? eio(p(t, ini(3 + k), 0.4)) : 0;
      c.style.visibility = t >= a - 0.01 || k === 0 ? (fora < 1 ? 'visible' : 'hidden') : 'hidden';
