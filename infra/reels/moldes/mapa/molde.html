<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo kallaway -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* ---- kallaway kit: aurora bloom from below, dot grid, glass hairline, glow (all from brand tokens) ---- */
.aura{position:absolute;inset:0;pointer-events:none}
.aura .bloom{position:absolute;left:-25%;right:-25%;bottom:-28%;height:70%;transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 62%,color-mix(in srgb,var(--destaque) 40%,transparent) 0%,color-mix(in srgb,var(--destaque) 12%,transparent) 46%,transparent 76%)}
.aura .pontos{position:absolute;inset:-60px;background-image:radial-gradient(circle,color-mix(in srgb,var(--texto) 15%,transparent) 1.7px,transparent 2.3px);background-size:46px 46px;
  -webkit-mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%)}
body.e-claro .aura .bloom,body.e-papel .aura .bloom{opacity:.55}
body.e-pop .aura .bloom{opacity:.35}
body.e-vidro .vid,body.e-noite .vid{box-shadow:var(--sombra),inset 0 1.5px 0 color-mix(in srgb,var(--texto) 24%,transparent)}
body.e-vidro .glow,body.e-noite .glow{text-shadow:0 0 26px color-mix(in srgb,var(--destaque) 55%,transparent)}
.kick{font-size:32px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);white-space:nowrap;line-height:50px}
.kick .pt{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--destaque);margin-right:18px;vertical-align:2px;box-shadow:0 0 16px var(--destaque)}
/* ad close: the product with its real photo */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
body.e-vidro .pvf,body.e-noite .pvf{box-shadow:var(--sombra),0 0 0 2px color-mix(in srgb,var(--destaque) 70%,transparent),0 0 60px color-mix(in srgb,var(--destaque) 35%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1058px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}


/* ---- scene 0: the question ---- */
#k0{position:absolute;left:90px;top:400px;width:820px;height:50px}
#tit0{position:absolute;left:90px;width:830px;top:470px;height:420px;font-size:96px}
#orb0{position:absolute;left:390px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--destaque) 85%,var(--texto)),var(--destaque) 45%,color-mix(in srgb,var(--destaque) 40%,transparent) 70%,transparent 72%)}
#orb0 i{position:absolute;inset:-60px;border-radius:50%;border:3px dashed color-mix(in srgb,var(--destaque) 55%,transparent)}

/* ---- scene 1: the map ---- */
#tit1{position:absolute;left:90px;width:830px;top:385px;height:124px;font-size:54px}
#mapa{position:absolute;inset:0}
#fios{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
#fios path{fill:none;stroke:color-mix(in srgb,var(--destaque) 75%,transparent);stroke-width:4;stroke-dasharray:1;stroke-linecap:round}
#fios circle{fill:var(--destaque)}
body.e-vidro #fios,body.e-noite #fios{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--destaque) 70%,transparent))}
#cen{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--destaque) 80%,var(--texto)),var(--destaque) 60%);box-shadow:0 0 90px color-mix(in srgb,var(--destaque) 50%,transparent)}
body.e-pop #cen{border:6px solid var(--texto);box-shadow:10px 10px 0 var(--texto)}
#cen .t{width:250px;height:190px;font-size:50px;line-height:1.02;text-align:center;color:var(--sobre-destaque);display:flex;align-items:center;justify-content:center}
#cen .t>div{width:100%}
#cen .anel{position:absolute;inset:-26px;border-radius:50%;border:3px solid color-mix(in srgb,var(--destaque) 60%,transparent)}
.fo{position:absolute;width:212px;height:200px;margin:-58px 0 0 -106px}
.fo .ic{position:absolute;left:56px;top:0;width:100px;height:100px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--destaque)}
.fo .nm{position:absolute;left:0;top:114px;width:212px;height:80px;font-size:32px;line-height:38px;font-weight:800;text-align:center;display:flex;align-items:center;hyphens:manual}
.fo.cima .nm{top:0;align-items:flex-end}.fo.cima .ic{top:94px}.fo.cima{margin-top:-152px}
.fo .nm>div{width:100%}

/* ---- scene 2: all in one place ---- */
#k2{position:absolute;left:90px;top:620px;width:820px;height:50px;text-align:center}
#n2{position:absolute;left:90px;width:820px;top:690px;height:300px;font-size:300px;line-height:300px;text-align:center}
#l2{position:absolute;left:90px;width:820px;top:1000px;height:170px;font-size:72px;text-align:center}
#fecho{position:absolute;left:110px;width:780px;top:1200px;height:200px;font-size:46px;font-weight:800;line-height:1.15;text-align:center}
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="tit0" class="tit glow t seg rv"></div>
 <div id="orb0"><i></i></div>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="tit1" class="tit t seg"></div>
 <div id="mapa"><svg id="fios" viewBox="0 0 1080 1920"></svg>
  <div id="cen"><div class="anel"></div><div class="tit t seg"><div></div></div></div>
 </div>
</div></div>

<div class="cena" id="c2"><div class="cam full">
 <div id="k2" class="kick t seg"></div>
 <div id="n2" class="tit glow dest t seg"></div>
 <div id="l2" class="tit t seg rv"></div>
 <div id="fecho" class="t t2 seg rv"></div>
</div></div>

<div class="cena" id="c3"><div class="cam full" id="c3in"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// Everything the business offers as a mind map: a glowing center (the business or what it does) and 4 to 8
// branches that draw out one by one, each ending in an icon tile with the name. Positions are computed by the code
// on an ellipse that keeps every label inside the free area of the Instagram screen; the count is the code's.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const SVG_SIM = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M4 12.5l5 5L20 6.5"/></svg>';
const SVG_NAO = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M6 6l12 12M18 6L6 18"/></svg>';
// focus pull: glides up while the blur resolves to sharp
function foco(e, t, t0, dur = 0.7, dy = 50, blur = 16) {
  if (typeof e === 'string') e = Motor.$(e); if (!e) return 0;
  const q = Motor.eo5(Motor.p(t, t0, dur)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * dy}px)`; e.style.filter = q < 1 ? `blur(${((1 - q) * blur).toFixed(1)}px)` : 'none'; return q;
}
function aura($m) { const a = mk('div', 'aura'); mk('div', 'bloom', null, a); mk('div', 'pontos', null, a); $m.$('#fundo').after(a); return a; }
function auraQuadro($m, t) { const a = $m.$('.aura'); if (!a) return; a.firstChild.style.transform = `scale(${1 + 0.05 * Math.sin(t * 0.9)})`; a.lastChild.style.transform = `translateY(${-(t * 7) % 46}px)`; }
function kick(e, txt) { e.textContent = ''; mk('span', 'pt', null, e); e.append(txt); }
function vitrine(F, $m, pai, convite) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk mao t seg', P.convite || convite, v);
  const n = mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  const d = P.detalhe ? mk('div', 'pvd t t2 seg', P.detalhe, v) : null;
  const linhas = P.nome.length > 17 ? 2 : 1; n.style.height = (linhas * 86) + 'px';
  if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = (F, convite) => ler(F.produto.convite || convite, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.8)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`; f.style.filter = q < 1 ? `blur(${(1 - q) * 14}px)` : 'none';
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  foco(v.querySelector('.pvk'), t, a + 0.35, 0.6, 24, 10);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) foco(pd, t, a + 1.0, 0.6, 20, 8);
}

// ---- end of kit ----

let PV = null, POS = [];
const CX = 490, CY = 1010, RX = 290, RY_CIMA = 350, RY_BAIXO = 330;
function checar(F, $m) {
  const vistos = new Set(); F.ramos.forEach(r => { const k = r.nome.trim().toLowerCase(); if (vistos.has(k)) $m.erro('ramos: ramo repetido: ' + r.nome); vistos.add(k); });
}
const CONV = 'conheça';
const ICONES = ['check', 'estrela', 'relogio', 'calendario', 'local', 'telefone', 'chat', 'carrinho', 'moto', 'cartao', 'dinheiro', 'presente', 'coracao', 'fogo', 'etiqueta', 'caixa', 'camera', 'tesoura', 'chave', 'bolo', 'xicara', 'pata', 'casa', 'pessoa', 'pessoas', 'megafone', 'brilho', 'folha', 'link', 'alerta', 'grafico', 'percentual', 'trofeu', 'balao', 'lupa', 'carro', 'haltere', 'dente', 'vestido', 'garfo'];
const oQue = n => n === 1 ? 'coisa' : 'coisas';

Motor.molde({
  id: 'mapa', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m; checar(F, $m); aura($m);
    const R = F.ramos, n = R.length;
    kick($('#k0'), 'Tudo o que tem aqui');
    $('#tit0').textContent = F.titulo;
    const lt = Math.min(4, Math.ceil(F.titulo.length / 15)), ht = lt * 100, g0 = 390 + Math.max(0, Math.floor((1060 - (70 + ht + 80 + 300)) / 2));
    $('#k0').style.top = g0 + 'px'; $('#tit0').style.top = (g0 + 70) + 'px'; $('#tit0').style.height = (ht + 10) + 'px'; $('#orb0').style.top = (g0 + 70 + ht + 80) + 'px';
    $('#tit1').textContent = F.titulo;
    $('#cen').style.left = CX + 'px'; $('#cen').style.top = CY + 'px'; $('#cen .t div').textContent = F.centro;
    // branches on an ellipse; with an even count the ring turns half a step so no branch sits right on top
    const a0 = -Math.PI / 2 + (n % 2 ? 0 : Math.PI / n);
    let svg = '';
    POS = R.map((r, i) => {
      const a = a0 + i * 2 * Math.PI / n, cima = Math.sin(a) < -0.35, x = CX + RX * Math.cos(a), y = CY + (Math.sin(a) < 0 ? RY_CIMA : RY_BAIXO) * Math.sin(a);
      // the line leaves the center circle and stops at the icon tile, bending a little for a hand-drawn map
      const sx = CX + 160 * Math.cos(a), sy = CY + 160 * Math.sin(a), ex = x, ey = y - 6;
      const mx = (sx + ex) / 2 - (ey - sy) * 0.12, my = (sy + ey) / 2 + (ex - sx) * 0.12;
      svg += `<path pathLength="1" stroke-dashoffset="1" d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"/><circle r="9" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" opacity="0"/>`;
      // upper branches carry the name above the tile, so the line never crosses a label
      const fo = mk('div', 'fo' + (cima ? ' cima' : ''), null, $('#mapa')); fo.style.left = x + 'px'; fo.style.top = y + 'px';
      const ic = mk('div', 'ic cartao vid', null, fo); ic.innerHTML = $m.icone(ICONES.includes(r.icone) ? r.icone : 'brilho');
      const nm = mk('div', 'nm t seg', null, fo); mk('div', null, r.nome, nm);
      return { fo, a, sx, sy, mx, my, ex, ey };
    });
    $('#fios').innerHTML = svg;
    // scene 2: how many things, counted by the code
    kick($('#k2'), 'Num lugar só');
    $('#n2').textContent = String(n);
    $('#l2').textContent = oQue(n) + ' ' + (F.onde || 'pra você');
    if (F.fecho) $('#fecho').textContent = F.fecho; else { $('#fecho').remove(); ['#k2', '#n2', '#l2'].forEach(s => $(s).style.top = (parseInt(getComputedStyle($(s)).top) + 100) + 'px'); }
    PV = vitrine(F, $m, $('#c3in'), CONV);
    return { duracoes: [
      Math.max(3.4, ler('Tudo o que tem aqui', F.titulo)),
      Math.max(1.6 + n * 0.6 + 1.8, ler(F.centro, R.map(r => r.nome).join(' ')) + 0.8),
      Math.max(3.2, ler('Num lugar só', String(n), oQue(n), F.onde || 'pra você', F.fecho) + 0.6),
      Math.max(3.6, vitrineLer(F, CONV)),
    ] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, cl, ini, lerp } = $m;
    auraQuadro($m, t);
    // 0: title, the core orb pulsing
    $m.cena('#c0', t, 0); const a0 = ini(0);
    foco('#k0', t, a0 + 0.1, 0.6, 20, 8);
    $m.revela('#tit0', t, a0 + 0.3, 0.07);
    const qo = eb(p(t, a0 + 0.9, 0.8)); $('#orb0').style.opacity = cl(qo * 2); $('#orb0').style.transform = `scale(${qo * (1 + 0.04 * Math.sin(t * 3))})`;
    $('#orb0 i').style.transform = `rotate(${t * 30}deg)`;
    // 1: center blooms, branches draw out one by one, a spark rides each line, the tile springs in
    $m.cena('#c1', t, 1, 1, { push: 0.02, y: CY }); const a1 = ini(1);
    foco('#tit1', t, a1 + 0.05, 0.6, 20, 10);
    const qc = eb(p(t, a1 + 0.3, 0.7)); $('#cen').style.opacity = cl(qc * 2); $('#cen').style.transform = `scale(${qc})`; $('#cen').style.filter = qc < 1 ? `blur(${((1 - cl(qc)) * 16).toFixed(1)}px)` : 'none';
    const an = $('#cen .anel'), w = (t - a1 - 0.8) % 1.6 / 1.6; an.style.opacity = t > a1 + 0.8 ? (1 - w) * 0.8 : 0; an.style.transform = `scale(${1 + w * 0.35})`;
    const ps = $$('#fios path'), cs = $$('#fios circle');
    POS.forEach((P, i) => {
      const ti = a1 + 0.9 + i * 0.6, q = eio(p(t, ti, 0.55));
      ps[i].setAttribute('stroke-dashoffset', (1 - q).toFixed(3));
      // spark: along the quadratic curve while drawing, then a slow trip back and forth
      const u = q < 1 ? q : 0.5 + 0.5 * Math.sin((t - ti) * 1.6 + i);
      const bx = (1 - u) * (1 - u) * P.sx + 2 * (1 - u) * u * P.mx + u * u * P.ex, by = (1 - u) * (1 - u) * P.sy + 2 * (1 - u) * u * P.my + u * u * P.ey;
      cs[i].setAttribute('cx', bx.toFixed(1)); cs[i].setAttribute('cy', by.toFixed(1)); cs[i].setAttribute('opacity', q > 0 ? (q < 1 ? 1 : 0.7) : 0);
      const qf = eb(p(t, ti + 0.4, 0.55));
      P.fo.style.opacity = cl(qf * 2); P.fo.style.transform = `translate(${(1 - qf) * -Math.cos(P.a) * 120}px,${(1 - qf) * -Math.sin(P.a) * 120 + Math.sin(t * 1.3 + i) * 5}px) scale(${0.6 + 0.4 * qf})`;
      P.fo.style.filter = qf < 1 ? `blur(${((1 - cl(qf)) * 10).toFixed(1)}px)` : 'none';
    });
    // 2: the count
    $m.cena('#c2', t, 2); const a2 = ini(2);
    foco('#k2', t, a2 + 0.1, 0.6, 20, 8);
    const qn = eb(p(t, a2 + 0.25, 0.7)); $('#n2').style.opacity = cl(qn * 2); $('#n2').style.transform = `scale(${0.5 + 0.5 * qn})`;
    $m.conta('#n2', t, a2 + 0.25, 0.9, POS.length, v => String(Math.round(v)), 0);
    $m.revela('#l2', t, a2 + 0.7, 0.07);
    if ($('#fecho')) $m.revela('#fecho', t, a2 + 1.1, 0.05);
    // 3: product
    $m.cena('#c3', t, 3); vitrineQuadro(PV, F, $m, t, ini(3));
  },
});
</script></body></html>
