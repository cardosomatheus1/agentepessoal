</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="tag0" class="chip t seg"></div>
 <div id="ph0"><img id="ph0i" alt=""></div>
 <div id="qm" class="tit">?</div>
 <div id="perg" class="tit t seg rv"></div>
</div></div>

<div class="cena" id="c1"><div class="cam full">

 <div id="ring"><svg viewBox="0 0 380 380"><circle cx="190" cy="190" r="164" fill="none" stroke="var(--borda)" stroke-width="26"/>
   <circle id="arco" cx="190" cy="190" r="164" fill="none" stroke="var(--destaque)" stroke-width="26" stroke-linecap="round" stroke-dasharray="1030.4" stroke-dashoffset="0"/></svg>
  <div class="n tit t seg" id="num">3</div><div class="chk" id="chk"></div></div>
 <div id="pausa" class="tit t seg">Pausa e responde</div>
 <div id="pausa2" class="t t2 seg">comenta a sua letra antes da resposta</div>

 <div id="ops"></div>
</div></div>

<div class="cena" id="c4"><div class="cam full">
 <div id="rh"><div class="le" id="rhl"></div><div class="tx tit t seg" id="rht"></div></div>
 <div id="expl" class="t seg rv"></div>
 <div id="fonte" class="t t2 seg"></div>

<script src="../motor/motor.js"></script>
<script>
// "Quiz A, B ou C": a question with three answers to comment on; the answer comes last and teaches. In the Reel a
// "pause and answer" countdown comes before the answer. Numbers of the explanation live in `conta` (the code sums
// them and checks that the right option is the total); the explanation text itself carries no digits.
const LET = ['A', 'B', 'C'];
let Q = {};
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
// "R$ 1.250,50" -> 1250.5 (first number in an option text)
const valorDe = s => { const m = String(s).replace(/\s/g, '').match(/(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?/); return m ? parseFloat(m[1].replace(/\./g, '') + (m[2] ? '.' + m[2] : '')) : null; };

function checar(F, $m) {
  const k = LET.indexOf(F.certa);
  if (/\d/.test(F.explicacao)) $m.erro('explicacao: sem algarismos no texto; ponha os valores em "conta" para o código somar');
  if (['saude', 'estetica', 'alimento'].includes(F.assunto) && !F.fonte) $m.erro('assunto de saúde, estética ou alimento precisa de fonte');
  if (F.fonte && !['dono', 'sistema'].includes((F._origem || {}).fonte)) $m.erro('fonte: dado real sem origem (_origem: dono ou sistema)');
  if (new Set(F.opcoes.map(o => o.trim().toLowerCase())).size < 3) $m.erro('as três opções precisam ser diferentes');
  let total = null, dec = 0;
  if (F.conta) {
    total = Math.round(F.conta.reduce((s, l) => s + l.valor * (l.vezes ?? 1), 0) * 100) / 100;
    const v = valorDe(F.opcoes[k]);
    if (v == null || Math.abs(v - total) > 0.005) $m.erro(`a opção certa (${F.opcoes[k]}) tem de ser o resultado da conta (${$m.brl(total)})`);
    F.opcoes.forEach((o, i) => { const w = valorDe(o); if (i !== k && w != null && Math.abs(w - total) < 0.005) $m.erro(`a opção ${LET[i]} também é o resultado da conta`); });
    dec = F.conta.some(l => !Number.isInteger(Math.round(l.valor * (l.vezes ?? 1) * 100) / 100) || !Number.isInteger(l.valor)) ? 2 : 0;
  }
  return { k, total, dec };
}

function tile(txt, i, pai) {
  const d = mk('div', 'op cartao', null, pai);
  mk('div', 'ok', null, d); mk('div', 'luz', null, d);
  const le = mk('div', 'le', null, d); const b = mk('b', 't', LET[i], le);
  const si = mk('span', 'si'); si.innerHTML = Motor.icone('check'); le.appendChild(si);
  const no = mk('span', 'no'); no.innerHTML = Motor.icone('x'); le.appendChild(no);
  mk('div', 'tx t seg', txt, d);
  return d;
}

// the receipt: each line value x times, double rule, total and the seal with the right letter
function recibo(F, $m, pai) {
  const din = v => $m.brl(v, Q.dec);
  const w = mk('div', 'recW', null, pai), r = mk('div', 'recibo', null, w);
  mk('div', 'cab t', 'A CONTA', r);
  F.conta.forEach(l => {
    const li = mk('div', 'lin', null, r), rr = mk('div', 'r', null, li);
    mk('div', 'a t', l.rotulo, rr);
    if (l.vezes != null && l.vezes !== 1) mk('div', 's t t2', `${$m.num(l.vezes, Number.isInteger(l.vezes) ? 0 : 1)}${l.unidade ? ' ' + l.unidade : 'x'} × ${$m.brl(l.valor, Number.isInteger(l.valor) ? 0 : 2)}`, rr);
    const v = mk('div', 'v t', din(l.valor * (l.vezes ?? 1)), li); v.dataset.v = l.valor * (l.vezes ?? 1);
  });
  const tt = mk('div', 'tot', null, r); mk('div', 'a t', F.total_rotulo || 'Total', tt);
  const tv = mk('div', 'v tit dest t seg', din(Q.total), tt); tv.dataset.v = Q.total;
  const s = mk('div', 'selo', null, w); mk('small', null, 'LETRA', s); s.append(F.certa);
  return w;
}

Motor.molde({
  id: 'quiz', formatos: ['reel', 'carrossel'],
  montar(F, M, $m) {
    const { $ } = $m;
    Q = checar(F, $m);
    $('#tag0').innerHTML = $m.icone('lupa') + ' '; $('#tag0').append('QUIZ');
    $('#perg').textContent = F.pergunta;
    if (F.midia) { $('#qm').remove(); } else { $('#ph0').remove(); $('#perg').classList.add('semfoto'); $('#perg').style.top = '1000px'; }
    $('#pmini').textContent = F.pergunta;
    F.opcoes.forEach((o, i) => { const d = tile(o, i, $('#ops')); d.style.top = i * 174 + 'px'; });
    $('#chk').innerHTML = $m.icone('check');
    $('#resp').textContent = 'É a letra ' + F.certa;
    $('#rhl').textContent = F.certa; $('#rht').textContent = F.opcoes[Q.k];
    $('#expl').textContent = F.explicacao;
    if (F.fonte) $('#fonte').textContent = 'Fonte: ' + F.fonte; else $('#fonte').remove();
    if (F.conta) { const r = recibo(F, $m, $('#c4 .cam')); r.id = 'rec4'; if (!F.fonte) r.classList.add('semfonte'); }
    else { const c = mk('div', 'cartao', null, $('#c4 .cam')); c.id = 'porque'; const lb = mk('div', 'lb t', null, c); lb.innerHTML = $m.icone('info') + ' '; lb.append('POR QUÊ?'); c.appendChild($('#expl')); $('#expl').classList.add('solta'); if ($('#fonte')) $('#fonte').classList.add('solta'); }
    $('#nota').textContent = F.nota || '';
    return { duracoes: [3.2, 3.0, 3.6, 2.6, F.conta ? 4.6 + F.conta.length * 0.3 : 1.6 + F.explicacao.length / 22] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, lerp, ini } = $m;
    const S = ini;
    // 0: question
    $m.cena('#c0', t, 0);
    const tg = eb(p(t, 0.1, 0.5)); $('#tag0').style.opacity = cl(tg * 3); $('#tag0').style.transform = `scale(${tg})`;
    if ($('#ph0')) { const q = eo5(p(t, 0.05, 0.9)); $('#ph0').style.opacity = q; $('#ph0').style.transform = `translateY(${(1 - q) * 80}px) rotate(${-2.5 + 1.5 * q}deg) scale(${1.08 - 0.08 * q})`; $m.filmagem($('#ph0i'), F.midia, t); }
    if ($('#qm')) { const q = el(p(t, 0.1, 1.2)); $('#qm').style.opacity = cl(q * 2); $('#qm').style.transform = `translateY(${(1 - q) * -300 + Math.sin(t * 2.4) * 14}px) rotate(${(1 - q) * -40 + Math.sin(t * 1.7) * 5}deg)`; }
    $m.revela('#perg', t, 0.45, 0.06);
    // 1..3: options, countdown, answer (one stage so the tiles stay put)
    $m.cena('#c1', t, 1, 3);
    $m.revela('#pmini', t, S(1) + 0.05, 0.03);
    const desce = eio(p(t, S(2) - 0.05, 0.6));
    $('#pmini').style.opacity = 1 - desce; $('#pmini').style.transform = `translateY(${-desce * 60}px)`;
    $('#ops').style.transform = `translateY(${desce * 250}px)`;
    const tiles = $$('#ops .op');
    // the light hops between tiles during the countdown, slows down and lands on the right one
    const t0 = S(2) + 0.3, t1 = S(3) + 0.35;
    let hop = -1;
    if (t >= t0 && t < t1) { const u = (t - t0) / (t1 - t0); hop = Math.floor(u * 9 - u * u * 3) % 3; }
    if (t >= t1) hop = Q.k;
    const certo = eo(p(t, S(3) + 0.4, 0.35)), errado = p(t, S(3) + 0.55, 0.5);
    tiles.forEach((d, j) => {
      const q = eb(p(t, S(1) + 0.35 + j * 0.2, 0.6));
      const lado = j % 2 ? 1 : -1;
      let dx = (1 - q) * 900 * lado, s = 1, rot = 0, op = cl(q * 3);
      if (j === Q.k) { s = 1 + 0.06 * Math.sin(Math.PI * cl(certo * 1.4)) + 0.03 * certo; }
      else { dx += Math.sin(errado * 40) * 16 * (1 - errado) * (errado > 0); op *= 1 - 0.6 * eo(errado); rot = -2 * eo(errado) * lado; }
      d.style.opacity = op; d.style.transform = `translateX(${dx}px) scale(${s}) rotate(${rot}deg)`;
      d.querySelector('.luz').style.opacity = hop === j && t < S(3) + 0.9 ? 1 : 0;
      const ok = j === Q.k ? certo : 0; d.querySelector('.ok').style.opacity = ok; d.querySelector('.tx').style.color = ok > 0.5 ? 'var(--sobre-bom)' : '';
      d.querySelector('.si').style.opacity = ok;
      const nx = j === Q.k ? 0 : eb(errado); d.querySelector('.no').style.opacity = cl(nx * 2); d.querySelector('.no').style.transform = `scale(${nx})`;
    });
    // countdown ring 3, 2, 1
    const ri = eb(p(t, S(2) + 0.1, 0.55)), rs = S(2) + 0.4;
    $('#ring').style.opacity = cl(ri * 3); $('#ring').style.transform = `scale(${ri})`;
    const el3 = cl((t - rs) / 3);
    $('#arco').setAttribute('stroke-dashoffset', (1030.4 * el3).toFixed(1));
    const n = Math.max(1, 3 - Math.floor(Math.max(0, t - rs)));
    $('#num').textContent = n; const tick = (t - rs) % 1; $('#num').style.transform = `scale(${t > rs ? 1 + 0.35 * Math.exp(-tick * 8) : 1})`;
    const vira = eb(p(t, S(3) + 0.05, 0.5));
    $('#num').style.opacity = 1 - cl(vira * 3); $('#chk').style.opacity = cl(vira * 3); $('#chk').style.transform = `scale(${vira}) rotate(${(1 - vira) * -90}deg)`;
    $('#arco').style.stroke = t >= S(3) ? 'var(--bom)' : '';
    const pz = eo5(p(t, S(2) + 0.35, 0.5)); $('#pausa').style.opacity = pz * (1 - cl(vira * 3)); $('#pausa').style.transform = `translateY(${(1 - pz) * 40}px)`;
    $('#pausa2').style.opacity = eo5(p(t, S(2) + 0.6, 0.5)) * (1 - cl(vira * 3));
    const rq = eb(p(t, S(3) + 0.25, 0.5)); $('#resp').style.opacity = cl(rq * 3); $('#resp').style.transform = `scale(${0.6 + 0.4 * rq})`;
    // 4: explanation + receipt
    $m.cena('#c4', t, 4);
    const a = S(4), h = eb(p(t, a + 0.1, 0.55)); $('#rh').style.opacity = cl(h * 3); $('#rh').style.transform = `translateX(${(1 - h) * -120}px)`;
    $m.revela('#expl', t, a + 0.45, 0.035);
    if ($('#fonte')) $m.entra('#fonte', t, a + 1.2, 0.5, 20);
    if ($('#porque')) { const q = eo5(p(t, a + 0.25, 0.6)); $('#porque').style.opacity = q; $('#porque').style.transform = `translateY(${(1 - q) * 90}px)`; }
    const r = $('#rec4');
    if (r) {
      const r0 = a + 1.0, rp = eo(p(t, r0, 0.7));
      r.style.opacity = cl(rp * 4); r.style.clipPath = `inset(0 0 ${(1 - rp) * 100}% 0)`; r.style.transform = `translateY(${(1 - rp) * -60}px)`;
      $$('.lin', r).forEach((li, j) => { const q = eo5(p(t, r0 + 0.5 + j * 0.3, 0.4)); li.style.opacity = q; li.style.transform = `translateX(${(1 - q) * 40}px)`;
        const v = li.querySelector('.v'); $m.conta(v, t, r0 + 0.5 + j * 0.3, 0.5, +v.dataset.v, x => $m.brl(x, Q.dec)); });
      const tz = r0 + 0.5 + F.conta.length * 0.3, tq = eo5(p(t, tz, 0.4));
      $('.tot', r).style.opacity = tq; $m.conta($('.tot .v', r), t, tz, 0.7, Q.total, x => $m.brl(x, Q.dec));
      const sq = p(t, tz + 0.9, 0.35), sb = sq === 0 ? 0 : 1 + 1.2 * Math.pow(1 - eo(sq), 2);
      $('.selo', r).style.opacity = sq > 0 ? 1 : 0; $('.selo', r).style.transform = `scale(${sb}) rotate(-10deg)`;
    }
    $('#nota').style.opacity = F.conta && t > S(4) && t < S(5) ? 1 : 0;
  },
  slides(F, M, $m) {
    Q = checar(F, $m);
    const palco = $m.$('#palco'); $m.$$('.cena', palco).forEach(c => c.remove()); $m.$('#nota').remove();
    const novo = () => mk('div', 'slide', null, palco);
    // 1: question and options
    const s1 = novo();
    const tg = mk('div', 'chipq chip t seg', null, s1); tg.innerHTML = $m.icone('lupa') + ' '; tg.append('QUIZ');
    if (F.midia) { const ph = mk('div', 'ph', null, s1); const im = mk('img', null, null, ph); $m.filmagem(im, F.midia, 0); }
    else mk('div', 'qbg tit', '?', s1);
    mk('div', 'pq tit t seg' + (F.midia ? '' : ' semfoto'), F.pergunta, s1);
    const o1 = mk('div', 'ops' + (F.midia ? '' : ' semfoto'), null, s1);
    F.opcoes.forEach((o, i) => { const d = tile(o, i, o1); d.style.top = i * (F.midia ? 120 : 140) + 'px'; });
    mk('div', 'pe mao t seg', 'comenta a letra antes de arrastar →', s1);

    const s2 = novo();

    const le = mk('div', 'letras', null, s2);
    LET.forEach(l => { const d = mk('div', null, null, le); mk('span', 't', l, d); mk('i', null, '?', d); });
    mk('div', 'sub t t2 seg', F.conta ? 'Pausa, escolhe e comenta. A resposta e a conta estão no próximo.' : 'Pausa, escolhe e comenta. A resposta está no próximo.', s2);
    const se = mk('div', 'seta'); se.innerHTML = $m.icone('seta'); s2.appendChild(se);
    // 3: answer
    const s3 = novo();
    mk('div', 'rt tit t seg', 'É a letra ' + F.certa, s3);

    F.opcoes.forEach((o, i) => { const d = tile(o, i, o3); d.style.top = i * 120 + 'px'; d.classList.add(i === Q.k ? 'certa' : 'errada'); });
    mk('div', 'ex t seg' + (F.fonte ? ' comfonte' : ''), F.explicacao, s3);
    if (F.fonte) mk('div', 'fo t t2 seg', 'Fonte: ' + F.fonte, s3);
    // 4: the receipt
    if (F.conta) {
      const s4 = novo(); mk('div', 'ct tit t seg', 'Fazendo a conta', s4);
      recibo(F, $m, s4);
      mk('div', 'salva mao t seg', 'salva pra fazer com os seus números', s4);
      if (F.nota) mk('div', 'notac t t2', F.nota, s4);
    }
  },
});
