<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo kallaway -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* ---- kallaway kit: aurora bloom from below, dot grid, glass hairline, glow (all from brand tokens) ---- */
.aura{position:absolute;inset:0;pointer-events:none}
.aura .bloom{position:absolute;left:-25%;right:-25%;bottom:-28%;height:70%;transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 62%,color-mix(in srgb,var(--destaque) 40%,transparent) 0%,color-mix(in srgb,var(--destaque) 12%,transparent) 46%,transparent 76%)}
.aura .pontos{position:absolute;inset:-60px;background-image:radial-gradient(circle,color-mix(in srgb,var(--texto) 15%,transparent) 1.7px,transparent 2.3px);background-size:46px 46px;
  -webkit-mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%)}
body.e-claro .aura .bloom,body.e-papel .aura .bloom{opacity:.55}
body.e-pop .aura .bloom{opacity:.35}
body.e-vidro .vid,body.e-noite .vid{box-shadow:var(--sombra),inset 0 1.5px 0 color-mix(in srgb,var(--texto) 24%,transparent)}
body.e-vidro .glow,body.e-noite .glow{text-shadow:0 0 26px color-mix(in srgb,var(--destaque) 55%,transparent)}
.kick{font-size:32px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);white-space:nowrap;line-height:50px}
.kick .pt{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--destaque);margin-right:18px;vertical-align:2px;box-shadow:0 0 16px var(--destaque)}
/* ad close: the product with its real photo */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
body.e-vidro .pvf,body.e-noite .pvf{box-shadow:var(--sombra),0 0 0 2px color-mix(in srgb,var(--destaque) 70%,transparent),0 0 60px color-mix(in srgb,var(--destaque) 35%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1058px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}

/* ---- scene 0: the versus ---- */
#k0{position:absolute;left:90px;top:400px;width:820px;height:50px}
#tit0{position:absolute;left:90px;width:830px;top:470px;height:420px;font-size:96px}
.vs{position:absolute;top:1000px;height:150px;width:350px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.vs .t{width:290px;height:76px;font-size:58px;line-height:76px;text-align:center;white-space:nowrap}
#vsA{left:80px;background:var(--destaque);color:var(--sobre-destaque);box-shadow:0 0 70px color-mix(in srgb,var(--destaque) 45%,transparent)}
#vsB{left:560px;color:var(--texto2)}
#vsX{position:absolute;left:430px;top:1015px;width:120px;height:120px;border-radius:50%;background:var(--fundo);border:3px solid var(--borda);display:flex;align-items:center;justify-content:center;font-family:var(--ft),sans-serif;font-weight:900;font-size:56px;color:var(--texto);z-index:2}
#sub0{position:absolute;left:90px;width:820px;top:1210px;height:110px;font-size:40px;font-weight:700}

/* ---- scene 1: the table ---- */
#tit1{position:absolute;left:90px;width:830px;top:392px;height:130px;font-size:56px}
#tab{position:absolute;left:70px;width:840px}
#colA{position:absolute;left:500px;width:165px;top:0;border-radius:28px;background:color-mix(in srgb,var(--destaque) 14%,transparent);border:2px solid color-mix(in srgb,var(--destaque) 60%,transparent);
  box-shadow:0 0 50px color-mix(in srgb,var(--destaque) 28%,transparent);transform-origin:50% 0}
.hd{position:absolute;top:0;height:100px;width:165px;display:flex;align-items:center;justify-content:center}
.hd .t{width:150px;height:84px;font-size:34px;line-height:42px;text-align:center;display:flex;align-items:center;justify-content:center}
#hdA{left:500px}#hdA .t{color:var(--destaque)}
#hdB{left:675px;border-radius:24px}#hdB .t{color:var(--texto2)}
.lin{position:absolute;left:0;width:840px}
.lin .fx{position:absolute;inset:6px 0;border-radius:24px}
.lin .lb{position:absolute;left:26px;width:450px;top:50%;height:104px;margin-top:-52px;font-size:42px;font-weight:800;line-height:52px;display:flex;align-items:center}
.lin .lb>div{width:100%}
.cel{position:absolute;top:50%;width:84px;height:84px;margin-top:-42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cel svg{width:50px;height:50px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.cel.sim{color:var(--bom);border:4px solid var(--bom);background:color-mix(in srgb,var(--bom) 16%,transparent)}
.cel.nao{color:var(--ruim);border:4px solid color-mix(in srgb,var(--ruim) 70%,transparent);background:color-mix(in srgb,var(--ruim) 10%,transparent)}
.cel .onda{position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--bom);opacity:0}
.cA{left:540px}.cB{left:715px}
#scan{position:absolute;left:-10px;width:860px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--destaque),transparent);box-shadow:0 0 30px var(--destaque);opacity:0}

/* ---- scene 2: the score ---- */
#k2{position:absolute;left:90px;top:410px;width:820px;height:50px}
.pl{position:absolute;left:90px;width:820px;height:230px}
.pl .nm{position:absolute;left:0;top:0;width:520px;height:80px;font-size:60px;line-height:80px;white-space:nowrap}
.pl .nu{position:absolute;right:0;top:0;width:300px;height:80px;font-size:66px;line-height:80px;text-align:right;white-space:nowrap}
.pl .tr{position:absolute;left:0;right:0;top:110px;height:56px;border-radius:999px;background:color-mix(in srgb,var(--texto) 10%,transparent);overflow:hidden}
.pl .br{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transform-origin:0 50%}
#plA{top:500px}#plA .br{background:linear-gradient(90deg,var(--destaque),var(--c2));box-shadow:0 0 40px color-mix(in srgb,var(--destaque) 60%,transparent)}
#plA .nu{color:var(--destaque)}
#plB{top:760px}#plB .br{background:color-mix(in srgb,var(--texto) 38%,transparent)}#plB .nm,#plB .nu{color:var(--texto2)}
#fecho{position:absolute;left:90px;width:820px;top:1040px;height:300px;font-size:68px}
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="tit0" class="tit glow t seg rv"></div>
 <div id="vsA" class="vs"><div class="tit t seg" id="vsAt"></div></div>
 <div id="vsB" class="vs cartao vid"><div class="tit t seg" id="vsBt"></div></div>
 <div id="vsX">x</div>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="tit1" class="tit t seg"></div>
 <div id="tab"><div id="colA"></div><div id="scan"></div>
  <div class="hd" id="hdA"><div class="tit t seg" id="hdAt"></div></div>
  <div class="hd cartao vid" id="hdB"><div class="tit t seg" id="hdBt"></div></div>
 </div>
</div></div>

<div class="cena" id="c2"><div class="cam full">
 <div id="k2" class="kick t seg"></div>
 <div class="pl" id="plA"><div class="nm tit t seg"></div><div class="nu tit glow t seg"></div><div class="tr"><div class="br"></div></div></div>
 <div class="pl" id="plB"><div class="nm tit t seg"></div><div class="nu tit t seg"></div><div class="tr"><div class="br"></div></div></div>
 <div id="fecho" class="tit t seg rv"></div>
</div></div>

<div class="cena" id="c3"><div class="cam full" id="c3in"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// "Nós x o comum": a feature table where each row checks in one by one, our column lit, the usual way dimmed.
// Never names a competitor: the other column is only "o comum" or "o jeito antigo". The rows are claims about the
// business, so they need _origem; the score (how many checks each side has) is counted by the code.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const SVG_SIM = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M4 12.5l5 5L20 6.5"/></svg>';
const SVG_NAO = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M6 6l12 12M18 6L6 18"/></svg>';
// focus pull: glides up while the blur resolves to sharp
function foco(e, t, t0, dur = 0.7, dy = 50, blur = 16) {
  if (typeof e === 'string') e = Motor.$(e); if (!e) return 0;
  const q = Motor.eo5(Motor.p(t, t0, dur)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * dy}px)`; e.style.filter = q < 1 ? `blur(${((1 - q) * blur).toFixed(1)}px)` : 'none'; return q;
}
function aura($m) { const a = mk('div', 'aura'); mk('div', 'bloom', null, a); mk('div', 'pontos', null, a); $m.$('#fundo').after(a); return a; }
function auraQuadro($m, t) { const a = $m.$('.aura'); if (!a) return; a.firstChild.style.transform = `scale(${1 + 0.05 * Math.sin(t * 0.9)})`; a.lastChild.style.transform = `translateY(${-(t * 7) % 46}px)`; }
function kick(e, txt) { e.textContent = ''; mk('span', 'pt', null, e); e.append(txt); }
function vitrine(F, $m, pai, convite) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk mao t seg', P.convite || convite, v);
  const n = mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  const d = P.detalhe ? mk('div', 'pvd t t2 seg', P.detalhe, v) : null;
  const linhas = P.nome.length > 17 ? 2 : 1; n.style.height = (linhas * 86) + 'px';
  if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = (F, convite) => ler(F.produto.convite || convite, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.8)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`; f.style.filter = q < 1 ? `blur(${(1 - q) * 14}px)` : 'none';
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  foco(v.querySelector('.pvk'), t, a + 0.35, 0.6, 24, 10);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) foco(pd, t, a + 1.0, 0.6, 20, 8);
}
// ---- end of kit ----

let G = {}, PV = null;
function checar(F, $m) {
  const L = F.linhas;
  if (!L.some(l => l.nos && !l.comum)) $m.erro('linhas: nenhuma linha em que só a gente marca; o comparativo não mostra diferença');
  if (L.every(l => l.nos === l.comum)) $m.erro('linhas: os dois lados iguais em tudo');
  const vistos = new Set(); L.forEach(l => { const k = l.item.trim().toLowerCase(); if (vistos.has(k)) $m.erro('linhas: item repetido: ' + l.item); vistos.add(k); });
  // the score is counted here, never written in the ficha
  return { a: L.filter(l => l.nos).length, b: L.filter(l => l.comum).length, n: L.length, nos: F.nos || 'Aqui', comum: F.comum || 'o comum' };
}
const placar = (x, n) => `${x} de ${n}`;
const CONV = 'experimente';

Motor.molde({
  id: 'comparativo', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m; G = checar(F, $m); aura($m);
    kick($('#k0'), 'Comparativo');
    $('#tit0').textContent = F.titulo;
    $('#vsAt').textContent = G.nos; $('#vsBt').textContent = G.comum;
    // the group (kicker, title, versus) sits in the middle of the free area, whatever the title length
    const lt = Math.min(4, Math.ceil(F.titulo.length / 15)), ht = lt * 100, grupo = 70 + ht + 70 + 150, g0 = 390 + Math.max(0, Math.floor((1060 - grupo) / 2));
    $('#k0').style.top = g0 + 'px'; $('#tit0').style.top = (g0 + 70) + 'px'; $('#tit0').style.height = (ht + 10) + 'px';
    ['#vsA', '#vsB'].forEach(s => { $(s).style.top = (g0 + 70 + ht + 70) + 'px'; }); $('#vsX').style.top = (g0 + 70 + ht + 85) + 'px';
    // scene 1: header + rows, sized to fit 3 to 6 rows between y 560 and 1450
    $('#tit1').textContent = F.titulo;
    $('#hdAt').textContent = G.nos; $('#hdBt').textContent = G.comum;
    const n = G.n, rh = Math.min(170, Math.floor(780 / n)), alto = 110 + n * rh, topo = 575;
    const tab = $('#tab'); tab.style.top = topo + 'px'; tab.style.height = alto + 'px';
    $('#colA').style.height = alto + 'px';
    F.linhas.forEach((l, i) => {
      const r = mk('div', 'lin', null, tab); r.style.top = (110 + i * rh) + 'px'; r.style.height = rh + 'px';
      mk('div', 'fx cartao vid', null, r);
      const lb = mk('div', 'lb', null, r); mk('div', 't seg', l.item, lb).style.maxHeight = '104px';
      const a = mk('div', 'cel cA ' + (l.nos ? 'sim' : 'nao'), null, r); a.innerHTML = l.nos ? SVG_SIM : SVG_NAO; if (l.nos) mk('div', 'onda', null, a);
      const b = mk('div', 'cel cB ' + (l.comum ? 'sim' : 'nao'), null, r); b.innerHTML = l.comum ? SVG_SIM : SVG_NAO;
    });
    // scene 2: score
    kick($('#k2'), 'O placar');
    $('#plA .nm').textContent = G.nos; $('#plA .nu').textContent = placar(G.a, n);
    $('#plB .nm').textContent = G.comum; $('#plB .nu').textContent = placar(G.b, n);
    if (F.fecho) $('#fecho').textContent = F.fecho; else { $('#fecho').remove(); $('#k2').style.top = '560px'; $('#plA').style.top = '650px'; $('#plB').style.top = '910px'; }
    PV = vitrine(F, $m, $('#c3in'), CONV);
    const itens = F.linhas.map(l => l.item).join(' ');
    return { duracoes: [
      Math.max(3.2, ler('Comparativo', F.titulo, G.nos, G.comum)),
      Math.max(1.4 + n * 0.8 + 1.6, ler(itens) + 0.6),
      Math.max(3.4, ler('O placar', placar(G.a, n), placar(G.b, n), F.fecho) + 0.6),
      Math.max(3.6, vitrineLer(F, CONV)),
    ] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, cl, ini } = $m;
    auraQuadro($m, t);
    // 0: versus
    $m.cena('#c0', t, 0); const a0 = ini(0);
    foco('#k0', t, a0 + 0.1, 0.6, 20, 8);
    $m.revela('#tit0', t, a0 + 0.3, 0.07);
    const qa = eo5(p(t, a0 + 0.9, 0.7)), qb = eo5(p(t, a0 + 1.05, 0.7));
    $('#vsA').style.opacity = qa; $('#vsA').style.transform = `translateX(${(1 - qa) * -420}px)`; $('#vsA').style.filter = qa < 1 ? `blur(${(1 - qa) * 18}px)` : 'none';
    $('#vsB').style.opacity = qb; $('#vsB').style.transform = `translateX(${(1 - qb) * 420}px)`; $('#vsB').style.filter = qb < 1 ? `blur(${(1 - qb) * 18}px)` : 'none';
    const qx = eb(p(t, a0 + 1.45, 0.5)); $('#vsX').style.opacity = cl(qx * 3); $('#vsX').style.transform = `scale(${qx}) rotate(${(1 - qx) * 90}deg)`;
    // 1: the table checks in row by row; a scan line rides down with it
    $m.cena('#c1', t, 1); const a1 = ini(1);
    foco('#tit1', t, a1 + 0.05, 0.6, 20, 10);
    const hq = eb(p(t, a1 + 0.3, 0.6));
    ['#hdA', '#hdB'].forEach((s, j) => { const q = eb(p(t, a1 + 0.3 + j * 0.1, 0.6)); $(s).style.opacity = cl(q * 2); $(s).style.transform = `translateY(${(1 - q) * -30}px)`; });
    const rows = $$('#tab .lin'), n = rows.length, passo = 0.8, r0 = a1 + 0.8;
    const rh = rows.length ? rows[0].offsetHeight : 0;
    const col = eio(p(t, a1 + 0.3, 0.6 + n * passo)); $('#colA').style.transform = `scaleY(${0.12 + 0.88 * col})`; $('#colA').style.opacity = cl(hq * 2);
    rows.forEach((r, i) => {
      const ti = r0 + i * passo;
      foco(r, t, ti, 0.6, 40, 10);
      const A = r.querySelector('.cA'), B = r.querySelector('.cB');
      const qa = eb(p(t, ti + 0.3, 0.45)); A.style.opacity = cl(qa * 3); A.style.transform = `scale(${qa})`;
      A.querySelector('path').style.strokeDashoffset = 1 - eo(p(t, ti + 0.4, 0.35));
      const on = A.querySelector('.onda'); if (on) { const w = p(t, ti + 0.55, 0.6); on.style.opacity = w > 0 && w < 1 ? 1 - w : 0; on.style.transform = `scale(${1 + w * 0.9})`; }
      if (A.classList.contains('sim')) { const g = Math.exp(-Math.max(0, t - ti - 0.6) * 3) * (t > ti + 0.45); A.style.boxShadow = `0 0 ${20 + 50 * g}px color-mix(in srgb,var(--bom) ${30 + 40 * g}%,transparent)`; }
      const qb = eb(p(t, ti + 0.5, 0.45)); B.style.opacity = cl(qb * 3) * (B.classList.contains('nao') ? 0.85 : 1);
      B.style.transform = `scale(${qb}) translateX(${Math.sin(p(t, ti + 0.6, 0.4) * 30) * 8 * (1 - p(t, ti + 0.6, 0.4))}px)`;
      B.querySelector('path').style.strokeDashoffset = 1 - eo(p(t, ti + 0.55, 0.35));
    });
    const k = (t - r0) / passo, sc = $('#scan');
    sc.style.opacity = t > r0 && k < n + 0.3 ? 0.9 : 0;
    sc.style.top = (110 + cl(k, 0, n) * rh - 3) + 'px';
    // 2: the score bars fill to what the code counted
    $m.cena('#c2', t, 2); const a2 = ini(2);
    foco('#k2', t, a2 + 0.1, 0.6, 20, 8);
    [['#plA', G.a, 0.3], ['#plB', G.b, 0.55]].forEach(([s, v, d]) => {
      const pl = $(s); foco(pl, t, a2 + d, 0.6, 30, 10);
      const q = eo5(p(t, a2 + d + 0.3, 1.1)); pl.querySelector('.br').style.width = '100%'; pl.querySelector('.br').style.transform = `scaleX(${Math.max(0.0001, q * v / G.n)})`;
      $m.conta(pl.querySelector('.nu'), t, a2 + d + 0.3, 1.1, v, x => placar(Math.round(x), G.n));
    });
    if ($('#fecho')) $m.revela('#fecho', t, a2 + 1.5, 0.06);
    // 3: product
    $m.cena('#c3', t, 3); vitrineQuadro(PV, F, $m, t, ini(3));
  },
});
</script></body></html>
