<script>
// "Inauguração de negócio local": a physical place (restaurant, salon, workshop, shop) opening in the neighbourhood.
// Público: cliente_final (the neighbours). Narrated: scene i lasts line i; the last line is the call (engine's final).
// Scenes: 0 countdown (days left computed here), 1 THE MOMENT: storefront behind a ribbon, scissors cut it, the ends
// fall and the lights come on with the logo, 2.. one photo of the place per scene, team (optional, with permission),
// menu or services grid, opening offer (optional, real, refused when expired), where (address + drawn streets + pin
// dropping), the date on a tear-off calendar (weekday computed here) + opening time.
const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const ISO = /^(\d{4})-(\d{2})-(\d{2})$/;
const dt = s => { const m = ISO.exec(s || ''); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; };
const hojeLocal = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };
const ddmm = d => `${d.getUTCDate()}/${d.getUTCMonth() + 1}`;
const hora = h => { const [a, b] = h.split(':'); return +a + 'h' + (b === '00' ? '' : b); };
const curto = d => DIAS[d.getUTCDay()].replace('-feira', '');
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const NUMS = s => (s.match(/\d+/g) || []).map(Number);
const SEMANA = /\b(domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)\b/gi;
const sem = w => w.toLowerCase().replace('terca', 'terça').replace('sabado', 'sábado');
let D = {};

// a line that names a weekday or "N de <mês>" must agree with the date the code computed
function conferirFala(fala, d, onde, $m) {
  const certo = curto(d);
  for (const w of fala.match(SEMANA) || []) if (sem(w) !== certo) $m.erro(`${onde}: a fala diz "${w}", mas ${ddmm(d)} é ${DIAS[d.getUTCDay()]}`);
  const re = /(\d{1,2}) de (janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/gi;
  let m; while ((m = re.exec(fala))) if (+m[1] !== d.getUTCDate() || m[2].toLowerCase() !== MESES[d.getUTCMonth()]) $m.erro(`${onde}: a fala diz "${m[0]}", mas a data é ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}`);
}

// streets drawn from the address (same address, same drawing): a tilted grid, one avenue, a small square
function ruas(svg, semente) {
  let s = semente || 1; const r = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  const NS = 'http://www.w3.org/2000/svg', el = (n, a, pai) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); pai.appendChild(e); return e; };
  const g = el('g', { transform: `rotate(${(r() * 16 - 8).toFixed(1)} 480 310)` }, svg);
  const xs = [], ys = [];
  for (let x = -260 + r() * 60; x < 1220; x += 150 + r() * 70) xs.push(x);
  for (let y = -240 + r() * 50; y < 860; y += 130 + r() * 60) ys.push(y);
  // blocks of houses between the streets, a square (park) with trees in one of them, away from the pin
  const quadras = el('g', { class: 'qd' }, g);
  for (let i = 0; i + 1 < xs.length; i++) for (let j = 0; j + 1 < ys.length; j++) {
    const w = xs[i + 1] - xs[i] - 30, h = ys[j + 1] - ys[j] - 30;
    if (r() < .5) el('rect', { x: xs[i] + 15, y: ys[j] + 15, width: w, height: h, rx: 12, fill: 'var(--texto)', opacity: (.04 + r() * .05).toFixed(3) }, quadras);
    else { const hw = (w - 10) / 2; [0, 1].forEach(m => el('rect', { x: xs[i] + 15 + m * (hw + 10), y: ys[j] + 15, width: hw, height: h, rx: 10, fill: 'var(--texto)', opacity: (.04 + r() * .05).toFixed(3) }, quadras)); }
  }
  const bx = Math.min(xs.length - 2, r() < .5 ? 2 : 5), by = Math.min(ys.length - 2, r() < .5 ? 2 : 4);
  const pq = el('g', { class: 'pq' }, g), px = xs[bx] + 15, py = ys[by] + 15, pw = xs[bx + 1] - xs[bx] - 30, ph = ys[by + 1] - ys[by] - 30;
  el('rect', { x: px, y: py, width: pw, height: ph, rx: 18, fill: 'var(--bom)', opacity: .35 }, pq);
  for (let k = 0; k < 6; k++) el('circle', { cx: px + 22 + r() * (pw - 44), cy: py + 22 + r() * (ph - 44), r: 12 + r() * 8, fill: 'var(--bom)', opacity: .55 }, pq);
  const linhas = [];
  xs.forEach(x => linhas.push(el('line', { x1: x, y1: -300, x2: x + (r() - .5) * 40, y2: 920, stroke: 'var(--texto)', 'stroke-width': 16, opacity: .16, 'stroke-linecap': 'round', pathLength: 1 }, g)));
  ys.forEach(y => linhas.push(el('line', { x1: -300, y1: y, x2: 1260, y2: y + (r() - .5) * 40, stroke: 'var(--texto)', 'stroke-width': 16, opacity: .16, 'stroke-linecap': 'round', pathLength: 1 }, g)));
  // the avenue crosses near the pin
  const ay = 300 + (r() - .5) * 120;
