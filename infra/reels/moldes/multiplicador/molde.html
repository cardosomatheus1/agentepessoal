<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo vox-explainer: multiplicador ("12x") com o bloco de
     referência "1x" e cópias empilhando em degraus. Portado para o motor (render(t) determinístico). -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
.grade{position:absolute;inset:-6px;pointer-events:none;background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--texto) 6%,transparent) 0 2px,transparent 2px 72px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--texto) 6%,transparent) 0 2px,transparent 2px 72px)}
.kick{position:absolute;left:90px;width:820px;height:52px;line-height:52px;font-family:var(--fb),sans-serif;font-weight:800;font-size:32px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.kick:before{content:'';display:inline-block;width:64px;height:6px;background:var(--destaque);margin-right:22px;vertical-align:middle}
.nt{position:absolute;left:90px;width:800px;top:1418px;height:44px;font-size:30px;font-weight:700;white-space:nowrap}

/* scene 0: what grew */
#k0{top:410px}
#assunto{position:absolute;left:90px;width:830px;top:500px;height:460px;font-size:104px}
#quanto{position:absolute;left:100px;width:760px;top:1020px;height:110px;font-size:92px;color:var(--destaque);white-space:nowrap;transform:rotate(-3deg)}

/* scenes 1-2: the stack */
#k1{top:400px}
#base{position:absolute;left:90px;top:1262px;width:300px;height:8px;background:var(--texto)}
.bl{position:absolute;left:110px;width:250px;border:5px solid var(--texto);background:color-mix(in srgb,var(--destaque) 42%,var(--fundo));transform-origin:50% 100%}
.bl.um{background:var(--destaque)}
.bl.parte{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--destaque) 45%,var(--fundo)) 0 8px,color-mix(in srgb,var(--destaque) 15%,var(--fundo)) 8px 16px)}
.bl span{position:absolute;left:14px;top:50%;transform:translateY(-50%);height:40px;line-height:40px;font-size:32px;font-weight:900;white-space:nowrap}
.bl.um span{color:var(--sobre-destaque)}
#lock{position:absolute;left:420px;width:490px;top:450px;height:230px;line-height:230px;font-size:220px;letter-spacing:-.04em;white-space:nowrap}
#lock b{color:var(--destaque);font-weight:inherit}
#lockS{position:absolute;left:430px;width:470px;top:680px;height:50px;font-size:34px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
#agV{position:absolute;left:430px;width:470px;top:780px;height:130px;line-height:130px;font-size:120px;white-space:nowrap}
#agU{position:absolute;left:430px;width:470px;top:915px;height:96px;font-size:36px;font-weight:700}
#anV{position:absolute;left:430px;width:470px;top:1080px;height:100px;line-height:100px;font-size:90px;white-space:nowrap}
#anU{position:absolute;left:430px;width:470px;top:1185px;height:50px;font-size:36px;font-weight:700;white-space:nowrap}

#eag{position:absolute;left:110px;width:300px;top:640px;height:90px;font-size:80px;color:var(--destaque);white-space:nowrap;transform:rotate(-6deg)}
#seta1{position:absolute;left:170px;top:760px;width:200px;height:300px;overflow:visible}
#seta1 path{fill:none;stroke:var(--texto);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
/* scene 3: what changed, on an index card */
#ficha3{position:absolute;left:90px;width:830px;top:480px;height:640px;
  background-image:repeating-linear-gradient(0deg,transparent 0 88px,color-mix(in srgb,var(--texto) 12%,transparent) 88px 91px);background-position:0 40px}
#ficha3 .mg{position:absolute;left:84px;top:0;bottom:0;width:5px;background:var(--destaque);opacity:.7}
#tab3{position:absolute;left:70px;top:-58px;height:58px;line-height:58px;padding:0 28px;font-size:30px;font-weight:900;letter-spacing:.14em;background:var(--destaque);color:var(--sobre-destaque);white-space:nowrap}
#motivo{position:absolute;left:130px;width:650px;top:90px;height:500px;font-size:70px}

/* ad close */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:100px;width:880px;top:390px;height:620px;border:12px solid var(--c2);overflow:hidden;box-shadow:18px 20px 0 color-mix(in srgb,var(--texto) 16%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fita{position:absolute;width:190px;height:52px;background:color-mix(in srgb,var(--c2) 75%,transparent);z-index:2}
.pvp{position:absolute;left:120px;top:960px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg);z-index:3}
.pvk{position:absolute;left:90px;width:790px;top:1060px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}
</style></head><body><div id="palco">
<div class="grade"></div>

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="assunto" class="tit t seg rv"></div>
 <div id="quanto" class="mao t seg">quanto cresceu?</div>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="k1" class="kick t seg"></div>
 <div id="pilha"></div>
 <div id="base"></div>
 <div id="lock" class="tit t seg"></div>
 <div id="lockS" class="t t2 seg">o que era antes</div>
 <div id="agV" class="tit dest t seg"></div>
 <div id="agU" class="t seg"></div>
 <div id="anV" class="tit t seg"></div>
 <div id="anU" class="t t2 seg"></div>
 <div id="eag" class="mao t seg">e agora?</div>
 <svg id="seta1" viewBox="0 0 200 300"><path pathLength="1" d="M60 280 C 20 190, 40 90, 130 30 M130 30 L 80 40 M130 30 L 120 80"/></svg>
 <div id="nt1" class="nt t t2 seg"></div>
</div></div>

<div class="cena" id="c3"><div class="cam full">
 <div id="ficha3" class="cartao"><div class="mg"></div><div id="tab3" class="t seg">O que mudou</div><div id="motivo" class="tit t seg rv"></div></div>
</div></div>

<div class="cena" id="c4"><div class="cam full" id="c4in"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// "Multiplicador": a real number before and now, and how many times it grew. The code divides now by before,
// rounds the factor DOWN to one decimal (never sells more growth than there was), and stacks that many copies of
// the "before" block: the reference "1x" sits on the line, the copies drop on top of it, the last one partial.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const st = (x, n = 6) => x >= 1 ? 1 : Math.floor(x * n) / n;
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const KICK = 'tem aqui pra você';
function vitrine(F, $m, pai) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  const f1 = mk('div', 'fita', null, v); Object.assign(f1.style, { left: '70px', top: '370px', transform: 'rotate(-14deg)' });
  const f2 = mk('div', 'fita', null, v); Object.assign(f2.style, { left: '830px', top: '372px', transform: 'rotate(12deg)' });
  mk('div', 'pvk mao t seg', P.convite || KICK, v);
  mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  if (P.detalhe) mk('div', 'pvd t t2 seg', P.detalhe, v);
  const linhas = P.nome.length > 19 ? 2 : 1, n = v.querySelector('.pvn'), d = v.querySelector('.pvd');
  n.style.height = (linhas * 86) + 'px'; if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = F => ler(F.produto.convite || KICK, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$ 0' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eb(p(t, a + 0.05, 0.55)); f.style.opacity = cl(q * 3); f.style.transform = `translateY(${(1 - q) * 140}px) rotate(${-1.5 + (1 - q) * 6}deg)`;
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  v.querySelectorAll('.fita').forEach((x, j) => { x.style.opacity = st(p(t, a + 0.45 + j * 0.12, 0.25), 3); });
  $m.entra(v.querySelector('.pvk'), t, a + 0.35, 0.5, 20);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) $m.entra(pd, t, a + 1.0, 0.5, 20);
}

let X = {}, PV = null, B = [];
function fator(F, $m) {
  for (const k of ['assunto', 'motivo']) if (/\d/.test(F[k])) $m.erro(`${k}: sem algarismos no texto; os números vão em antes e agora`);
  const f = F.agora.valor / F.antes.valor;
  if (f < 1.5) $m.erro(`de ${F.antes.valor} para ${F.agora.valor} não chega a uma vez e meia: este molde é para quando multiplicou (use numero-grande ou grafico-meses)`);
  if (f > 12) $m.erro('mais de doze vezes: a pilha não cabe; use numero-grande');
  const x = f >= 10 ? Math.floor(f + 1e-9) : Math.floor(f * 10 + 1e-9) / 10;   // rounded down: never more than it grew
  // decimals fixed by the real values, so the number counting up does not flicker decimals on the way
  const din = F.tipo === 'dinheiro', inteiro = Number.isInteger(F.antes.valor) && Number.isInteger(F.agora.valor), cd = inteiro ? 0 : (din ? 2 : 1);
  const fmt = v => din ? $m.brl(v, cd) : $m.num(v, cd);
  return { f, x, txt: $m.num(x, Number.isInteger(x) ? 0 : 1), fmt };
}

Motor.molde({
  id: 'multiplicador', formatos: ['reel'],
  montar(F, M, $m) {
    const { $ } = $m;
    X = fator(F, $m); const rot = F.rotulo || 'Antes e agora';
    $('#k0').textContent = rot; $('#k1').textContent = rot;
    $('#assunto').textContent = F.assunto;
    // the stack: block 1 is "before"; whole copies, then the partial one (code-drawn from the real ratio)
    const n = Math.ceil(X.f - 1e-9), gap = 10, h = Math.min(200, (810 - (n - 1) * gap) / n);
    for (let k = 0; k < n; k++) {
      const parte = Math.min(1, X.f - k), b = mk('div', 'bl' + (k === 0 ? ' um' : '') + (parte < 1 ? ' parte' : ''), null, $('#pilha'));
      const hh = Math.max(14, h * parte); b.style.height = hh + 'px'; b.style.top = (1262 - k * (h + gap) - hh) + 'px';
      if (k === 0 && h >= 50) mk('span', 't', 'antes', b);
      B.push(b);
    }
    $('#lock').textContent = X.txt; mk('b', null, 'x', $('#lock'));
    $('#agV').textContent = X.fmt(F.agora.valor);
    $('#agU').textContent = [F.unidade, F.agora.quando].filter(Boolean).join(', ');
    $('#anV').textContent = X.fmt(F.antes.valor); $('#anU').textContent = 'antes, ' + F.antes.quando;
    if (F.nota) $('#nt1').textContent = F.nota; else $('#nt1').remove();
    $('#motivo').textContent = F.motivo;
    $('#ficha3').style.height = Math.max(420, Math.ceil(F.motivo.length / 16) * 88 + 200) + 'px';
    PV = vitrine(F, $m, $('#c4in'));
    return { duracoes: [ler(rot, F.assunto, 'quanto cresceu?') + 0.3, ler(rot, X.fmt(F.antes.valor), 'antes, ' + F.antes.quando, F.nota) + 0.6,
      Math.max(1.2 + n * 0.32 + 2.4, ler(X.txt + 'x', 'o que era antes', X.fmt(F.agora.valor), $('#agU').textContent) + 1.2), ler('O que mudou', F.motivo) + 0.3, vitrineLer(F)] };
  },
  quadro(t, F, $m) {
    const { $, p, eo, eo5, eio, eb, cl, ini } = $m;
    const kick = (sel, a) => { const q = st(p(t, a + 0.05, 0.3), 4); $(sel).style.opacity = q; $(sel).style.transform = `translateX(${(1 - q) * -40}px)`; };
    // 0: what grew
    $m.cena('#c0', t, 0); kick('#k0', 0);
    $m.revela('#assunto', t, 0.25, 0.06);
    $m.entra('#quanto', t, ini(1) - 1.2, 0.4, 20);
    // 1: the "before" block lands on the line
    const a = ini(1), b = ini(2); $m.cena('#c1', t, 1, 2); kick('#k1', a);
    $('#base').style.transform = `scaleX(${st(p(t, a + 0.1, 0.3), 5)})`; $('#base').style.transformOrigin = '0 50%';
    B.forEach((bl, k) => {
      const t0 = k === 0 ? a + 0.3 : b + 0.3 + (k - 1) * 0.32;
      const q = p(t, t0, 0.3), cai = st(q, 5);           // falls in steps, squashes a little when it lands
      const pous = p(t, t0 + 0.3, 0.2), sq = pous > 0 && pous < 1 ? 1 - 0.12 * Math.sin(Math.PI * pous) : 1;
      bl.style.opacity = q > 0 ? 1 : 0; bl.style.transform = `translateY(${(1 - cai) * -260}px) scaleY(${sq})`;
    });
    { const q = eo5(p(t, a + 0.5, 0.4)); $('#anV').style.opacity = q; $('#anU').style.opacity = q; $('#anV').style.transform = `translateX(${(1 - q) * 40}px)`; $m.conta('#anV', t, a + 0.5, 0.6, F.antes.valor, X.fmt); }
    { const q = eo5(p(t, a + 1.0, 0.4)) * (1 - p(t, b, 0.25)); $('#eag').style.opacity = q; $('#seta1').style.opacity = q > 0 ? 1 : 0; const sp = $('#seta1 path'); sp.style.strokeDasharray = 1; sp.style.strokeDashoffset = 1 - eo(p(t, a + 1.1, 0.5)) ; $('#seta1').style.opacity = 1 - p(t, b, 0.25); }
    // 2: copies stack; the factor counts with them and pops when the stack is done
    const fimPilha = b + 0.3 + (B.length - 1) * 0.32 + 0.3;
    const cont = Math.min(X.f, 1 + Math.max(0, (t - b - 0.3) / 0.32));
    const lq = p(t, b + 0.25, 0.2); $('#lock').style.opacity = lq > 0 ? 1 : 0;
    $('#lock').firstChild.textContent = t < fimPilha ? $m.num(Math.floor(cont + 1e-9), 0) : X.txt;
    const pop = p(t, fimPilha, 0.35), ps = pop === 0 ? 1 : 1 + 0.5 * Math.pow(1 - eo(pop), 2);
    $('#lock').style.transform = `scale(${ps})`; $('#lock').style.transformOrigin = '0 50%';
    { const q = eo5(p(t, fimPilha + 0.2, 0.4)); $('#lockS').style.opacity = q; }
    { const q = eb(p(t, b + 0.6, 0.45)); $('#agV').style.opacity = cl(q * 3); $('#agV').style.transform = `translateX(${(1 - q) * 60}px)`; $m.conta('#agV', t, b + 0.6, Math.max(0.8, fimPilha - b - 0.6), F.agora.valor, X.fmt, F.antes.valor); $('#agU').style.opacity = eo(p(t, b + 0.8, 0.4)); }
    if ($('#nt1')) $('#nt1').style.opacity = eo(p(t, a + 0.8, 0.4));
    // 3: what changed
    $m.cena('#c3', t, 3);
    const a3 = ini(3), q3 = eb(p(t, a3 + 0.05, 0.5));
    $('#ficha3').style.opacity = cl(q3 * 3); $('#ficha3').style.transform = `translateY(${(1 - q3) * 120}px) rotate(${-1.2 + (1 - q3) * -4}deg)`;
    { const q = st(p(t, a3 + 0.35, 0.3), 3); $('#tab3').style.transform = `translateY(${(1 - q) * 30}px)`; $('#tab3').style.opacity = q; }
    $m.revela('#motivo', t, a3 + 0.5, 0.06);
    // 4: product
    $m.cena('#c4', t, 4); vitrineQuadro(PV, F, $m, t, ini(4));
  },
});
</script></body></html>
