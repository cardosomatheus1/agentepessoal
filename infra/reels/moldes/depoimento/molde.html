<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* the product photo is the stage of the whole video: hero, then dimmed backdrop of the quote cards, then a card */
#fundoF{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#fundoF img{position:absolute;left:0;top:0;width:1080px;height:1250px;object-fit:cover;transform-origin:50% 40%}
#veu{position:absolute;inset:0;background:var(--fundo);opacity:0}
#aspas{position:absolute;left:70px;top:960px;width:240px;height:200px;font-family:var(--ft),serif;font-weight:900;font-size:360px;line-height:.95;color:var(--destaque);z-index:3}
body.e-noite #aspas{text-shadow:0 0 40px color-mix(in srgb,var(--destaque) 70%,transparent)}
#produto{left:90px;width:820px;top:1200px;height:250px;font-size:116px;line-height:1;text-align:left}
/* quote card */
.card{position:absolute;left:90px;width:820px;top:420px;height:760px;padding:110px 56px 50px;z-index:2}
.aspasP{position:absolute;left:44px;top:-10px;font-family:var(--ft),serif;font-weight:900;font-size:240px;line-height:1;color:var(--destaque)}
.cit{position:absolute;left:56px;top:110px;width:708px;height:600px;font-size:68px;font-weight:800;line-height:1.2;display:flex;align-items:center;letter-spacing:-.01em}
.cit > div{width:100%}
.cit .mk{color:inherit;display:inline;background-image:linear-gradient(color-mix(in srgb,var(--destaque) 38%,transparent),color-mix(in srgb,var(--destaque) 38%,transparent));background-repeat:no-repeat;background-position:0 85%;background-size:calc(var(--k,1) * 100%) 72%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.cit .mk:before{display:none}
.quem{position:absolute;left:90px;width:820px;top:1200px;height:280px}
.quem .estrelas{height:92px;display:flex;justify-content:center;gap:16px}
.quem .st{position:relative;width:84px;height:84px;font-size:84px;line-height:1}
.quem .st .ico{position:absolute;left:0;top:0;color:var(--texto);opacity:.18}
.quem .st .on .ico{opacity:1;color:var(--destaque)}
.quem .assina{height:116px;display:flex;align-items:baseline;justify-content:center;gap:22px}
.quem .autor{height:116px;font-size:104px;line-height:116px;white-space:nowrap;max-width:520px}
.quem .bairro{height:56px;font-size:42px;font-weight:700;white-space:nowrap;max-width:330px}
.quem .fonteW{text-align:center;margin-top:6px}
.quem .fonte{display:inline-block;font-size:36px;padding:10px 28px;white-space:nowrap;max-width:820px}
.quem.semEstrelas{top:1220px}
/* short sentence: a smaller card, the signature comes up */
.curta .card{top:500px;height:520px}.curta .cit{height:360px;font-size:76px}.curta .quem{top:1060px}.curta .quem.semEstrelas{top:1080px}
.slide .curta .card{top:200px;height:560px}.slide .curta .cit{height:400px}.slide .curta .quem{top:800px}
/* result + invitation */
#resF{position:absolute;left:130px;top:400px;width:820px;height:600px;border-radius:44px;overflow:hidden;box-shadow:var(--sombra);border:10px solid var(--texto)}
body.e-claro #resF,body.e-papel #resF{border-color:var(--cartao)}
body.e-papel #resF{border-radius:8px}
#resF img{width:100%;height:100%;object-fit:cover}
#selo{position:absolute;left:780px;top:880px;width:190px;height:190px;border-radius:50%;background:var(--bom);color:var(--sobre-bom);display:flex;align-items:center;justify-content:center;font-size:120px;box-shadow:var(--sombra);opacity:0;z-index:3}
#resK{left:90px;width:680px;top:1030px;height:60px;font-size:44px;font-weight:800;text-align:left}
#resT{left:90px;width:820px;top:1096px;height:230px;font-size:66px;line-height:1.14;text-align:left}
#convW{position:absolute;left:90px;width:820px;top:1350px;text-align:left}
#conv{display:inline-block;font-size:46px;padding:18px 36px;white-space:nowrap;max-width:820px}
#preco{position:absolute;left:160px;top:900px;width:280px;height:96px;line-height:96px;padding:0 20px;text-align:center;font-size:58px;white-space:nowrap;z-index:3;transform:rotate(-4deg)}
.slide #preco{left:200px;top:590px}
body.f-story #produto,body.f-story #resT{width:900px}body.f-story .card{width:900px}body.f-story .cit{width:788px}body.f-story .quem{width:900px}
/* carousel */
.slide #fundoF img{height:1350px}
.slide #aspas{top:760px}
.slide #produto{left:84px;width:912px;top:950px;height:250px}
.slide .card{left:84px;width:912px;top:140px;height:780px}
.slide .cit{width:800px;height:620px}
.slide .quem{left:84px;width:912px;top:950px}
.slide #resF{left:174px;top:130px;width:732px;height:560px}
.slide #selo{left:770px;top:600px;width:160px;height:160px;font-size:100px;opacity:1;transform:rotate(-8deg)}
.slide #resK{left:84px;width:912px;top:730px}
.slide #resT{left:84px;width:912px;top:800px;height:240px}
.slide #convW{left:84px;width:912px;top:1080px}
</style></head><body><div id="palco">

<div class="cena" id="cD"><div class="cam full" id="cam">
 <div id="fundoF"><img id="fotoImg" alt=""><div id="veu"></div></div>
 <div id="aspas">“</div>
 <div class="ctr tit t seg rv" id="produto"></div>
 <div id="falas"></div>
 <div id="res"><div id="resF"><img id="resImg" alt=""></div><div id="selo"></div>
  <div class="ctr t t2 seg" id="resK">O resultado</div><div class="ctr tit t seg rv" id="resT"></div>
  <div id="convW"><span class="chip t seg" id="conv"></span></div><div class="chip tit t seg" id="preco"></div></div>
</div></div>

</div>
<script src="../motor/motor.js"></script>
<script>
// "Depoimento de cliente" (AR Board 13/10: "sem graça e muito curto"): an ad built on what a real client said.
// Scenes: 0 the product photo with a giant quote mark and the product name; 1..n each client's words, copied word for
// word (never edited), revealed one by one over the dimmed photo, then stars (only from a rated source), the
// handwritten first name, neighbourhood and source; n+1 the result on a photo with a check stamp and the invitation
// to buy; last: call (engine's final scene). Proof and permission stay in the ficha (required real fields).
const FONTES = { avaliacao: 'avaliação', mensagem: 'mensagem', comentario: 'comentário', email: 'e-mail' };
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const nb = s => s.replace(/ /g, ' ');
const palavras = s => s.split(/\s+/).filter(Boolean).length;
let D = {};
function conferir(F, $m) {
  F.depoimentos.forEach((d, i) => {
    const q = `depoimentos[${i + 1}]`;
    if (d.estrelas != null && d.fonte !== 'avaliacao') $m.erro(`${q}.estrelas: só quando a fonte tem nota (fonte: avaliacao)`);
    if (d.estrelas != null && !Number.isInteger(d.estrelas)) $m.erro(`${q}.estrelas: número inteiro de 1 a 5, igual ao da avaliação`);
    if (d.destaque && !d.citacao.includes(d.destaque)) $m.erro(`${q}.destaque: precisa ser um trecho exato da citação`);
  });
}
// one quote card + who said it
function fala(d, $m, k) {
  const w = document.createElement('div'); w.className = 'fala'; w.dataset.k = k;
  w.innerHTML = '<div class="cartao card"><div class="aspasP">“</div><div class="cit t seg rv"><div></div></div></div>' +
    '<div class="quem"><div class="estrelas"></div><div class="assina"><div class="autor mao t seg"></div><div class="bairro t t2 seg"></div></div><div class="fonteW"><span class="fonte chip t seg"></span></div></div>';
  const c = w.querySelector('.cit > div'), cit = d.citacao, i = d.destaque ? cit.indexOf(d.destaque) : -1;
  if (i >= 0) { const mk = document.createElement('span'); mk.className = 'mk'; mk.textContent = d.destaque; c.append(cit.slice(0, i), mk, cit.slice(i + d.destaque.length)); } else c.textContent = cit;
  const n = d.estrelas || 0, e = w.querySelector('.estrelas');
  for (let j = 0; j < (n ? 5 : 0); j++) { const s = document.createElement('div'); s.className = 'st'; s.dataset.j = j; s.innerHTML = $m.icone('estrela') + (j < n ? '<div class="on">' + $m.icone('estrela') + '</div>' : ''); e.appendChild(s); }
  if (!n) { e.remove(); w.querySelector('.quem').classList.add('semEstrelas'); }
  w.querySelector('.autor').textContent = d.autor;
  if (d.bairro) { const b = w.querySelector('.bairro'); b.innerHTML = $m.icone('local') + ' '; b.append(d.bairro); } else w.querySelector('.bairro').remove();
  let f = FONTES[d.fonte];
  if (d.data) { const m = /^(\d{4})-(\d{2})/.exec(d.data); f += ', ' + MESES[+m[2] - 1] + '/' + m[1]; }
  w.querySelector('.fonte').textContent = f;
  D.textos[k] = [cit, d.autor, d.bairro || '', f];
  if (palavras(cit) <= 10) w.classList.add('curta');
  return w;
}
function montarTudo(F, M, $m, alvo) {
  const { $ } = $m;
  conferir(F, $m);
  D.textos = [];
  $('#fotoImg', alvo).src = $m.midia(F.foto);
  $('#produto', alvo).textContent = F.produto;
  F.depoimentos.forEach((d, k) => $('#falas', alvo).appendChild(fala(d, $m, k)));
  $('#resImg', alvo).src = $m.midia(F.foto_resultado || F.foto);
  $('#selo', alvo).innerHTML = $m.icone('check');
  $('#resT', alvo).textContent = F.resultado;
  $('#conv', alvo).textContent = F.convite;
  if (F.preco != null) $('#preco', alvo).textContent = nb($m.brl(F.preco)); else $('#preco', alvo).remove();
}
Motor.molde({
  id: 'depoimento', formatos: ['reel', 'carrossel', 'story'],
  montar(F, M, $m) {
    montarTudo(F, M, $m, document);
    // reading time (AR Board 13/10): 0.8 s + 0.25 s per new word, plus the time the stars and the signature take
    const ler = (...x) => 1.05 + 0.25 * palavras(x.join(' '));
    const d = [Math.max(2.2, ler(F.produto)), ...D.textos.map(t => Math.max(3.4, ler(...t) + 0.4)), Math.max(3.4, ler('O resultado', F.resultado, F.convite, F.preco != null ? 'R$ 0' : ''))];
    const total = d.reduce((a, b) => a + b, 0) + 3;
    if (total > 18.6) $m.erro(`depoimento longo demais: ${total.toFixed(1)} s para dar tempo de ler (máximo 18 s); encurte a fala ou use uma só`);
    return { duracoes: d };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, el, cl, lerp, ini } = $m;
    const n = F.depoimentos.length, SR = ini(n + 1);
    $m.cena('#cD', t, 0, n + 1, { push: 0.02 });
    // 0: hero photo, the quote mark falls, the product name is revealed
    const sai = eio(p(t, ini(1) - 0.2, 0.6));
    $('#fotoImg').style.transform = `scale(${1.12 - 0.08 * p(t, 0, ini(1)) + 0.06 * sai})`;
    $('#fotoImg').style.filter = `blur(${sai * 10}px)`;
    $('#fundoF').style.maskImage = $('#fundoF').style.webkitMaskImage = `linear-gradient(transparent 0, #000 ${lerp(360, 0, sai)}px, #000 ${lerp(760, 1920, sai)}px, transparent ${lerp(1250, 1920, sai)}px)`;
    $('#veu').style.opacity = 0.8 * sai; $('#fundoF').style.opacity = 1 - eo(p(t, SR - 0.1, 0.4));
    const a = el(p(t, 0.1, 1.0)); $('#aspas').style.transform = `translateY(${(1 - cl(a)) * -300}px) scale(${0.4 + 0.6 * a})`; $('#aspas').style.opacity = cl(a * 3) * (1 - sai);
    $m.revela('#produto', t, 0.5, 0.08); $('#produto').style.opacity = 1 - sai;
    // 1..n: each client's words
    $$('#falas .fala').forEach(w => {
      const k = +w.dataset.k, a0 = ini(1 + k), a1 = ini(2 + k), on = t >= a0 - 0.05 && t < a1 + 0.3;
      w.style.display = on ? 'block' : 'none'; if (!on) return;
      const ent = eo5(p(t, a0, 0.5)), out = eio(p(t, a1 - 0.2, 0.4));
      w.style.opacity = 1 - out; w.style.transform = `translateX(${(1 - ent) * 300 - out * 300}px)`;
      const words = palavras(F.depoimentos[k].citacao), passo = Math.min(0.09, 2.2 / words);
      $m.revela(w.querySelector('.cit'), t, a0 + 0.2, passo);
      const fimTxt = a0 + 0.2 + passo * words + 0.3, mk = w.querySelector('.mk'); if (mk) $m.marcador(mk, t, fimTxt);
      $$('.st', w).forEach(s => { const j = +s.dataset.j, q = el(p(t, fimTxt + j * 0.1, 0.7)); s.style.opacity = cl(q * 3); s.style.transform = `scale(${q})`; });
      const au = w.querySelector('.autor'), wr = eo(p(t, fimTxt + 0.3, 0.7)); au.style.clipPath = `inset(-20% ${100 - wr * 100}% -20% -5%)`; au.style.opacity = t >= fimTxt + 0.3 ? 1 : 0;
      const b = w.querySelector('.bairro'); if (b) $m.entra(b, t, fimTxt + 0.6, 0.4, 20);
      $m.entra(w.querySelector('.fonteW'), t, fimTxt + 0.8, 0.4, 20);
    });
    // result: photo card, the check stamp, the result and the invitation to buy
    const r = t >= SR - 0.05; $('#res').style.display = r ? 'block' : 'none';
    if (r) {
      const fi = eo5(p(t, SR, 0.6)); $('#resF').style.opacity = fi; $('#resF').style.transform = `translateY(${(1 - fi) * 120}px) rotate(${(1 - fi) * -4 - 1.5}deg)`;
      $('#resImg').style.transform = `scale(${1.1 - 0.08 * p(t, SR, 4)})`;
      $m.carimbo('#selo', t, SR + 0.5);
      if ($('#preco')) { const pq = eb(p(t, SR + 0.8, 0.5)); $('#preco').style.opacity = cl(pq * 2); $('#preco').style.transform = `rotate(-4deg) scale(${0.6 + 0.4 * pq})`; }
      $m.entra('#resK', t, SR + 0.4, 0.4, 20); $m.revela('#resT', t, SR + 0.55, 0.07);
      const c = eb(p(t, SR + 1.3, 0.5)); $('#convW').style.opacity = cl(c * 2); $('#convW').style.transform = `scale(${0.7 + 0.3 * c})`; $('#convW').style.transformOrigin = '0 50%';
    }
  },
  slides(F, M, $m) {
    // carousel: product + quote mark, one slide per client, result with the invitation (the engine adds the final)
    const palco = $m.$('#palco'), cam = $m.$('#cam'), tmp = document.createElement('div');
    [...cam.children].forEach(c => tmp.appendChild(c)); $m.$$('.cena', palco).forEach(c => c.remove());
    montarTudo(F, M, $m, tmp);
    const capa = document.createElement('div'); capa.className = 'slide';
    const fundo = $m.$('#fundoF', tmp); fundo.style.maskImage = fundo.style.webkitMaskImage = 'linear-gradient(#000 40%, transparent 68%)';
    capa.append(fundo, $m.$('#aspas', tmp), $m.$('#produto', tmp)); palco.appendChild(capa);
    $m.$$('.fala', tmp).forEach(w => { const s = document.createElement('div'); s.className = 'slide'; const f = fundo.cloneNode(true); f.querySelector('img').style.filter = 'blur(10px)'; f.querySelector('#veu').style.opacity = .8; f.style.maskImage = f.style.webkitMaskImage = 'none'; s.append(f, w); palco.appendChild(s); });
    const rs = document.createElement('div'); rs.className = 'slide'; rs.appendChild($m.$('#res', tmp)); palco.appendChild(rs);
  },
});
</script></body></html>
