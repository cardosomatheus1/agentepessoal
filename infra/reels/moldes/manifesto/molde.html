<script>
// "Manifesto de marca e nova identidade". Narrated, one scene per line of the voice:
// 0..m-1 manifesto lines (kinetic type, 1 or 2 key words light up in the brand colour, optional photo behind),
// m contrast ("Não é sobre X. É sobre Y.", two pairs, X struck through), m+1 three values with big icons,
// m+2 THE moment: the brand symbol assembles from its own pieces (connected parts of the logo PNG; strips when the
// drawing is one piece), the name wipes in and the logo lights up; m+3 the palette (name + HEX), m+4 the logo on
// CSS mockups (card, facade, app icon, feed post) with parallax, [m+5 real proof (number) or real photo],
// then the brand's theme line; the last line is the call (engine's final scene).
let D = {};
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const letras = s => s.replace(/\s+/g, '').length;
const HEX = /^#[0-9a-fA-F]{6}$/;
const APLIC = { cartao: 'Cartão de visita', fachada: 'Fachada', app: 'Ícone do aplicativo', feed: 'Post no feed' };

// ---------- colour helpers (brand colours come from data; nothing is a fixed colour) ----------
const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const lumi = c => { const [r, g, b] = rgb(c).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const escura = c => lumi(c) < .18;
// readable name for a colour without one (palette taken from the brand)
function nomeCor(c) {
  const [r, g, b] = rgb(c).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (s < .12 || d < .06) return l < .12 ? 'Preto' : l > .92 ? 'Branco' : l < .45 ? 'Grafite' : 'Cinza';
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360;
  const base = h < 15 || h >= 345 ? 'Vermelho' : h < 40 ? (l < .5 ? 'Terracota' : 'Laranja') : h < 65 ? 'Amarelo' : h < 160 ? 'Verde' : h < 195 ? 'Verde-água' : h < 255 ? 'Azul' : h < 290 ? 'Roxo' : 'Rosa';
  return base + (l < .3 ? ' escuro' : l > .75 ? ' claro' : '');
}

// ---------- the logo cut into pieces ----------
// draws the brand's logo (or round photo, or name) into a canvas, finds the symbol and the name (largest empty
// gap), splits the symbol into its connected parts and returns one canvas per part
async function prepararLogo($m) {
  const M = Motor.M, T = Motor.T, escuro = Motor.contraste('#ffffff', T.fundo) > Motor.contraste('#000000', T.fundo);
  const certo = escuro ? M.logo_escuro : M.logo_claro, outro = escuro ? M.logo_claro : M.logo_escuro;
  let cv, tipo;
  const carrega = async src => { const i = new Image(); i.src = src; await i.decode(); return i; };
  if (M.foto && (M.assinatura === 'foto' || !(certo || outro))) {
    const i = await carrega(Motor.logoSrc(M.foto)), n = 640; cv = document.createElement('canvas'); cv.width = cv.height = n;
    const c = cv.getContext('2d'); c.beginPath(); c.arc(n / 2, n / 2, n / 2 - 2, 0, 7); c.clip();
    const k = Math.max(n / i.naturalWidth, n / i.naturalHeight); c.drawImage(i, (n - i.naturalWidth * k) / 2, (n - i.naturalHeight * k) / 2, i.naturalWidth * k, i.naturalHeight * k);
    tipo = 'foto';
  } else if (certo || outro) {
    const i = await carrega(Motor.logoSrc(certo || outro)); cv = document.createElement('canvas'); cv.width = i.naturalWidth; cv.height = i.naturalHeight; cv.getContext('2d').drawImage(i, 0, 0);
    tipo = certo ? 'logo' : 'logo-placa';
  } else {
    await document.fonts.load('900 200px D'); await document.fonts.load('900 200px B'); await document.fonts.load('400 200px A');
    const fam = getComputedStyle(document.documentElement).getPropertyValue('--ft').trim() || 'D';
    const c0 = document.createElement('canvas').getContext('2d'); c0.font = `900 200px ${fam}`; const w = Math.ceil(c0.measureText(M.nome || 'Marca').width) + 40;
    cv = document.createElement('canvas'); cv.width = w; cv.height = 260; const c = cv.getContext('2d'); c.font = `900 200px ${fam}`; c.fillStyle = T.texto; c.textBaseline = 'middle'; c.fillText(M.nome || 'Marca', 20, 135);
    tipo = 'nome';
  }
  const W = cv.width, H = cv.height, px = cv.getContext('2d').getImageData(0, 0, W, H), A = px.data;
  const cheio = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) cheio[i] = A[i * 4 + 3] > 28 ? 1 : 0;
  // bounding box and empty columns/rows
  let x0 = W, x1 = -1, y0 = H, y1 = -1; const col = new Uint32Array(W), lin = new Uint32Array(H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (cheio[y * W + x]) { col[x]++; lin[y]++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) throw new Error('logo vazio');
  const vaos = (v, a, b) => { const r = []; let s = -1; for (let i = a; i <= b; i++) { if (!v[i]) { if (s < 0) s = i; } else if (s >= 0) { r.push([s, i - 1]); s = -1; } } return r; };
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  let sim = [x0, y0, x1, y1], nome = null;
  const escolhe = (gs, tam, a, lo, hi) => {
    if (!gs.length) return null;
    const ord = gs.map(g => [g[1] - g[0] + 1, g]).sort((p, q) => q[0] - p[0]);
    const [lg, g] = ord[0], seg = ord[1] ? ord[1][0] : 0, frac = (g[0] - a) / tam;
    return frac >= lo && frac <= hi && lg >= 1.5 * seg && lg >= tam * 0.03 ? g : null;
  };
  if (tipo !== 'foto' && tipo !== 'nome') {
    if (bw / bh >= 1.6) { const g = escolhe(vaos(col, x0, x1), bw, x0, .08, .5); if (g) { sim = [x0, y0, g[0] - 1, y1]; nome = [g[1] + 1, y0, x1, y1]; } }
    else if (bh / bw >= 1.1) { const g = escolhe(vaos(lin, y0, y1), bh, y0, .3, .82); if (g) { sim = [x0, y0, x1, g[0] - 1]; nome = [x0, g[1] + 1, x1, y1]; } }
  }
  // tighten each box
  const aperta = b => { let [a, c, d, e] = [W, H, -1, -1]; for (let y = b[1]; y <= b[3]; y++) for (let x = b[0]; x <= b[2]; x++) if (cheio[y * W + x]) { if (x < a) a = x; if (x > d) d = x; if (y < c) c = y; if (y > e) e = y; } return [a, c, d, e]; };
  sim = aperta(sim); if (nome) nome = aperta(nome);
  const sw = sim[2] - sim[0] + 1, sh = sim[3] - sim[1] + 1;
  // connected parts of the symbol (8-neighbourhood)
  const rot = new Int32Array(sw * sh).fill(-1); const partes = [];
  const fila = new Int32Array(sw * sh);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const i = y * sw + x; if (rot[i] >= 0 || !cheio[(y + sim[1]) * W + x + sim[0]]) continue;
    const id = partes.length; let n = 0, h = 0, t = 0, sx = 0, sy = 0; fila[t++] = i; rot[i] = id;
    while (h < t) { const j = fila[h++], jx = j % sw, jy = (j / sw) | 0; n++; sx += jx; sy += jy;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = jx + dx, ny = jy + dy; if (nx < 0 || ny < 0 || nx >= sw || ny >= sh) continue; const k = ny * sw + nx; if (rot[k] < 0 && cheio[(ny + sim[1]) * W + nx + sim[0]]) { rot[k] = id; fila[t++] = k; } } }
    partes.push({ id, n, cx: sx / n, cy: sy / n });
  }
  const area = partes.reduce((a, q) => a + q.n, 0);
  const grandes = partes.filter(q => q.n >= area * 0.02);
  let grupo; // pixel index -> piece number
  if (grandes.length >= 2 && grandes.length <= 7) {
    const mapa = {}; grandes.forEach((q, k) => { mapa[q.id] = k; });
    partes.forEach(q => { if (mapa[q.id] == null) { let best = 0, bd = 1e18; grandes.forEach((g, k) => { const d = (g.cx - q.cx) ** 2 + (g.cy - q.cy) ** 2; if (d < bd) { bd = d; best = k; } }); mapa[q.id] = best; } });
    grupo = i => rot[i] < 0 ? -1 : mapa[rot[i]]; D.nPecas = grandes.length; D.corte = 'partes';
  } else if (sw / sh > 1.4) {  // a wide drawing in one piece: diagonal strips
    const n = 5; D.nPecas = n; D.corte = 'faixas';
    grupo = i => { if (rot[i] < 0) return -1; const x = i % sw, y = (i / sw) | 0; return Math.min(n - 1, Math.max(0, Math.floor((x + (sh - y) * 0.35) / (sw + sh * 0.35) * n))); };
  } else {  // compact drawing in one piece: wedges around the centre
    const n = 6; D.nPecas = n; D.corte = 'fatias';
    grupo = i => { if (rot[i] < 0) return -1; const x = i % sw - sw / 2, y = ((i / sw) | 0) - sh / 2; return Math.floor(((Math.atan2(y, x) + Math.PI + 0.3) % (2 * Math.PI)) / (2 * Math.PI) * n) % n; };
  }
  const pecas = [];
  for (let k = 0; k < D.nPecas; k++) { const c = document.createElement('canvas'); c.width = sw; c.height = sh; pecas.push({ c, d: c.getContext('2d').createImageData(sw, sh), n: 0, sx: 0, sy: 0 }); }
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const g = grupo(y * sw + x); if (g < 0) continue; const P = pecas[g], s = ((y + sim[1]) * W + x + sim[0]) * 4, o = (y * sw + x) * 4;
    P.d.data[o] = A[s]; P.d.data[o + 1] = A[s + 1]; P.d.data[o + 2] = A[s + 2]; P.d.data[o + 3] = A[s + 3]; P.n++; P.sx += x; P.sy += y;
  }
  const vivas = pecas.filter(P => P.n > 0);
  vivas.forEach(P => { P.c.getContext('2d').putImageData(P.d, 0, 0); P.cx = P.sx / P.n / sw - .5; P.cy = P.sy / P.n / sh - .5; delete P.d; });
  // order: largest first, then around the circle, so the drawing builds up
  vivas.sort((a, b) => b.n - a.n);
  let nomeCv = null;
  if (nome) { const nw = nome[2] - nome[0] + 1, nh = nome[3] - nome[1] + 1; nomeCv = document.createElement('canvas'); nomeCv.width = nw; nomeCv.height = nh; nomeCv.getContext('2d').drawImage(cv, nome[0], nome[1], nw, nh, 0, 0, nw, nh); }
  const symCv = document.createElement('canvas'); symCv.width = sw; symCv.height = sh; symCv.getContext('2d').drawImage(cv, sim[0], sim[1], sw, sh, 0, 0, sw, sh);
  return { tipo, W, H, sim, nome, sw, sh, pecas: vivas, nomeCv, symCv, src: certo || outro };
}

// lays the pieces on the stage (called once the logo is ready)
function montarSimbolo($m, L) {
  const { $ } = $m, cena = $('#cS .cam');
  const temNome = !!L.nomeCv, nomeTexto = !temNome && (L.tipo === 'foto' || (L.tipo !== 'nome' && L.sw / L.sh < 1.6));
  // symbol box: centre (540, 840), up to 540 x 440 (bigger when the logo has no separate name)
  const dois = temNome || nomeTexto, maxW = dois ? 520 : 680, maxH = dois ? 430 : 480;
  const k = Math.min(maxW / L.sw, maxH / L.sh), w = L.sw * k, h = L.sh * k, cy = dois ? 820 : 900;
  const box = $('#sim'); Object.assign(box.style, { left: (540 - w / 2) + 'px', top: (cy - h / 2) + 'px', width: w + 'px', height: h + 'px' });
  D.simBox = { x: 540 - w / 2, y: cy - h / 2, w, h, cy };
