<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo kallaway -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
/* ---- kallaway kit: aurora bloom from below, dot grid, glass hairline, glow (all from brand tokens) ---- */
.aura{position:absolute;inset:0;pointer-events:none}
.aura .bloom{position:absolute;left:-25%;right:-25%;bottom:-28%;height:70%;transform-origin:50% 100%;
  background:radial-gradient(50% 50% at 50% 62%,color-mix(in srgb,var(--destaque) 40%,transparent) 0%,color-mix(in srgb,var(--destaque) 12%,transparent) 46%,transparent 76%)}
.aura .pontos{position:absolute;inset:-60px;background-image:radial-gradient(circle,color-mix(in srgb,var(--texto) 15%,transparent) 1.7px,transparent 2.3px);background-size:46px 46px;
  -webkit-mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(75% 55% at 50% 50%,#000 25%,transparent 80%)}
body.e-claro .aura .bloom,body.e-papel .aura .bloom{opacity:.55}
body.e-pop .aura .bloom{opacity:.35}
body.e-vidro .vid,body.e-noite .vid{box-shadow:var(--sombra),inset 0 1.5px 0 color-mix(in srgb,var(--texto) 24%,transparent)}
body.e-vidro .glow,body.e-noite .glow{text-shadow:0 0 26px color-mix(in srgb,var(--destaque) 55%,transparent)}
.kick{font-size:32px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);white-space:nowrap;line-height:50px}
.kick .pt{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--destaque);margin-right:18px;vertical-align:2px;box-shadow:0 0 16px var(--destaque)}
/* ad close: the product with its real photo */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:90px;width:900px;top:390px;height:640px;border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra)}
body.e-vidro .pvf,body.e-noite .pvf{box-shadow:var(--sombra),0 0 0 2px color-mix(in srgb,var(--destaque) 70%,transparent),0 0 60px color-mix(in srgb,var(--destaque) 35%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvp{position:absolute;left:120px;top:955px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg)}
.pvk{position:absolute;left:90px;width:790px;top:1058px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}


/* ---- scene 0: three bars rising like three paths ---- */
#k0{position:absolute;left:90px;top:400px;width:820px;height:50px}
#tit0{position:absolute;left:90px;width:830px;top:470px;height:420px;font-size:96px}
#barras{position:absolute;left:290px;width:500px;height:300px}
#barras i{position:absolute;bottom:0;width:130px;border-radius:24px 24px 8px 8px;transform-origin:50% 100%;background:linear-gradient(180deg,color-mix(in srgb,var(--destaque) 70%,transparent),color-mix(in srgb,var(--destaque) 10%,transparent))}
#barras i:nth-child(1){left:0;height:150px}#barras i:nth-child(2){left:185px;height:225px}#barras i:nth-child(3){left:370px;height:300px}
#barras b{position:absolute;left:0;right:0;bottom:-8px;height:4px;border-radius:4px;background:var(--destaque)}

/* ---- scenes 1-2: the three panels ---- */
#tit1,#fe1{position:absolute;left:90px;width:830px;top:392px;height:150px;font-size:58px;display:flex;align-items:center}
#tit1>div,#fe1>div{width:100%}
#fe1{color:var(--destaque)}
.pn{position:absolute;top:600px;width:266px;height:800px;text-align:center}
.pn .lz{position:absolute;inset:-3px;border-radius:calc(var(--raio) + 3px);border:4px solid var(--destaque);box-shadow:0 0 60px color-mix(in srgb,var(--destaque) 50%,transparent),inset 0 0 40px color-mix(in srgb,var(--destaque) 20%,transparent);opacity:0}
.pn .ft{position:relative;margin:28px auto 0;width:200px;height:200px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px color-mix(in srgb,var(--destaque) 70%,transparent)}
.pn .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pn .ix{position:relative;margin:28px auto 0;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--ft),sans-serif;font-weight:900;font-size:52px;background:color-mix(in srgb,var(--destaque) 18%,transparent);color:var(--destaque)}
.pn .nm{position:relative;margin:18px auto 0;width:236px;height:96px;font-size:42px;line-height:48px;display:flex;align-items:center}
.pn .nm>div{width:100%}
.pn .pr{position:relative;margin:10px auto 0;width:236px;height:70px;font-size:54px;line-height:70px;white-space:nowrap}
.pn .un{position:relative;margin:2px auto 0;width:236px;height:72px;font-size:30px;line-height:36px;font-weight:700}
.pn .hr{position:relative;margin:14px auto 10px;width:150px;height:0;border-top:3px solid var(--borda)}
.pn .li{position:relative;margin:8px auto 0;width:236px;height:72px;font-size:30px;line-height:36px;font-weight:700;display:flex;align-items:center}
.pn .li>div{width:100%}
.fita{position:absolute;left:50%;top:-34px;height:60px;line-height:60px;padding:0 10px;margin-left:-125px;width:250px;font-size:30px;text-align:center;white-space:nowrap;opacity:0;z-index:3}
#luz{position:absolute;top:520px;width:340px;height:960px;margin-left:-170px;background:radial-gradient(50% 50% at 50% 50%,color-mix(in srgb,var(--destaque) 26%,transparent),transparent 70%);opacity:0;pointer-events:none}
#nota1{position:absolute;left:90px;width:820px;top:1416px;height:40px;font-size:30px;font-weight:600;text-align:center;white-space:nowrap}
</style></head><body><div id="palco">

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="tit0" class="tit glow t seg rv"></div>
 <div id="barras"><i></i><i></i><i></i><b></b></div>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="luz"></div>
 <div id="tit1" class="tit t seg"><div></div></div>
 <div id="fe1" class="tit glow t seg"><div></div></div>
 <div id="pns"></div>
 <div id="nota1" class="t t2 seg"></div>
</div></div>

<div class="cena" id="c3"><div class="cam full" id="c3in"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// Three options side by side (sizes, plans, packages): the panels spring up one after another, then a light walks
// over them. It lands on one as "o mais pedido" ONLY when the ficha says so (with _origem); otherwise it rests on
// none and asks which one is yours. Prices need the owner's origin or the "valores de exemplo" flag, which puts the
// note on screen; the price per unit (per slice, per person, per session) is computed by the code.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const SVG_SIM = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M4 12.5l5 5L20 6.5"/></svg>';
const SVG_NAO = '<svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M6 6l12 12M18 6L6 18"/></svg>';
// focus pull: glides up while the blur resolves to sharp
function foco(e, t, t0, dur = 0.7, dy = 50, blur = 16) {
  if (typeof e === 'string') e = Motor.$(e); if (!e) return 0;
  const q = Motor.eo5(Motor.p(t, t0, dur)); e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * dy}px)`; e.style.filter = q < 1 ? `blur(${((1 - q) * blur).toFixed(1)}px)` : 'none'; return q;
}
function aura($m) { const a = mk('div', 'aura'); mk('div', 'bloom', null, a); mk('div', 'pontos', null, a); $m.$('#fundo').after(a); return a; }
function auraQuadro($m, t) { const a = $m.$('.aura'); if (!a) return; a.firstChild.style.transform = `scale(${1 + 0.05 * Math.sin(t * 0.9)})`; a.lastChild.style.transform = `translateY(${-(t * 7) % 46}px)`; }
function kick(e, txt) { e.textContent = ''; mk('span', 'pt', null, e); e.append(txt); }
function vitrine(F, $m, pai, convite) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  mk('div', 'pvk mao t seg', P.convite || convite, v);
  const n = mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  const d = P.detalhe ? mk('div', 'pvd t t2 seg', P.detalhe, v) : null;
  const linhas = P.nome.length > 17 ? 2 : 1; n.style.height = (linhas * 86) + 'px';
  if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = (F, convite) => ler(F.produto.convite || convite, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eo5, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eo5(p(t, a + 0.05, 0.8)); f.style.opacity = q; f.style.transform = `translateY(${(1 - q) * 120}px) scale(${0.92 + 0.08 * q})`; f.style.filter = q < 1 ? `blur(${(1 - q) * 14}px)` : 'none';
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  foco(v.querySelector('.pvk'), t, a + 0.35, 0.6, 24, 10);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) foco(pd, t, a + 1.0, 0.6, 20, 8);
}

// ---- end of kit ----

let PV = null, Q = {};
const XS = [70, 357, 644];
function checar(F, $m) {
  const O = F.opcoes, comPreco = O.filter(o => o.preco != null).length;
  if (comPreco && comPreco < 3) $m.erro('opcoes: preço em umas e não em outras; ponha nas três ou em nenhuma');
  const org = (F._origem || {}).opcoes;
  if (comPreco && !F.precos_de_exemplo && !['dono', 'sistema'].includes(org)) $m.erro('opcoes: preço sem origem; com preço de verdade ponha _origem.opcoes (dono ou sistema), com preço inventado marque precos_de_exemplo');
  if (comPreco && F.precos_de_exemplo && ['dono', 'sistema'].includes(org)) $m.erro('opcoes: preço confirmado pelo dono não é valor de exemplo; tire precos_de_exemplo');
  O.forEach(o => { if (o.rende != null && o.preco == null) $m.erro(`opcoes: ${o.nome} tem rende sem preço; a conta por unidade precisa do preço`);
    if (o.rende != null && !o.unidade) $m.erro(`opcoes: ${o.nome} tem rende sem unidade (fatias, pessoas, sessões)`); });
  const vistos = new Set(); O.forEach(o => { const k = o.nome.trim().toLowerCase(); if (vistos.has(k)) $m.erro('opcoes: nome repetido: ' + o.nome); vistos.add(k); });
  const dec = O.some(o => o.preco != null && !Number.isInteger(o.preco)) ? 2 : 0;
  return { k: F.mais_pedido ? +F.mais_pedido - 1 : -1, dec };
}
// "R$ 4,50 por fatia": the code divides; the unit word comes singular from the plural in the ficha
const singular = u => u.replace(/ões$/, 'ão').replace(/ães$/, 'ão').replace(/is$/, 'l').replace(/s$/, '');
const porUn = o => `${Motor.brl(o.preco / o.rende, 2)} por ${singular(o.unidade)}`;
const FECHO = 'Qual é o seu? Comenta aqui.';

Motor.molde({
  id: 'tres-caminhos', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m; Q = checar(F, $m); aura($m);
    kick($('#k0'), 'Três caminhos');
    $('#tit0').textContent = F.titulo;
    const lt = Math.min(4, Math.ceil(F.titulo.length / 15)), ht = lt * 100, g0 = 390 + Math.max(0, Math.floor((1060 - (70 + ht + 70 + 300)) / 2));
    $('#k0').style.top = g0 + 'px'; $('#tit0').style.top = (g0 + 70) + 'px'; $('#tit0').style.height = (ht + 10) + 'px'; $('#barras').style.top = (g0 + 70 + ht + 70) + 'px';
    $('#tit1 div').textContent = F.titulo;
    const fe = Q.k >= 0 ? (F.fecho || `O mais pedido é o ${F.opcoes[Q.k].nome}`) : (F.fecho || FECHO);
    $('#fe1 div').textContent = fe;
    const txt = [];
    F.opcoes.forEach((o, i) => {
      const d = mk('div', 'pn cartao vid', null, $('#pns')); d.style.left = XS[i] + 'px';
      mk('div', 'lz', null, d);
      if (o.foto) { const f = mk('div', 'ft', null, d); $m.filmagem(mk('img', null, null, f), o.foto, 0); }
      else mk('div', 'ix', String(i + 1), d);
      const nm = mk('div', 'nm tit t seg', null, d); mk('div', null, o.nome, nm); txt.push(o.nome);
      if (o.preco != null) { mk('div', 'pr tit dest t seg', $m.brl(o.preco, Q.dec), d); txt.push('R$ 0'); }
      if (o.rende != null) { mk('div', 'un t t2 seg', porUn(o), d); txt.push(porUn(o)); }
      if (o.itens && o.itens.length) { mk('div', 'hr', null, d); o.itens.forEach(s => { const l = mk('div', 'li t seg', null, d); mk('div', null, s, l); l.style.height = Math.min(3, Math.ceil(s.length / 12)) * 36 + 'px'; txt.push(s); }); }
      if (i === Q.k) mk('div', 'fita chip t seg', 'o mais pedido', d);
    });
    // the three panels take the height of the fullest one; title and panels sit together in the middle of the free area
    const pns = [...document.querySelectorAll('#pns .pn')];
    const alto = Math.min(820, Math.max(...pns.map(d => [...d.children].reduce((h, c) => h + (c.classList.contains('lz') || c.classList.contains('fita') ? 0 : c.offsetHeight + parseFloat(getComputedStyle(c).marginTop || 0)), 0))) + 40);
    const bloco = 150 + 50 + alto, y0 = 392 + Math.max(0, Math.floor((1040 - bloco) / 2));
    $('#tit1').style.top = y0 + 'px'; $('#fe1').style.top = y0 + 'px';
    pns.forEach(d => { d.style.top = (y0 + 200) + 'px'; d.style.height = alto + 'px'; });
    $('#luz').style.top = (y0 + 120) + 'px'; $('#luz').style.height = (alto + 160) + 'px'; $('#nota1').style.top = (y0 + 200 + alto + 20) + 'px';
    if (F.precos_de_exemplo) $('#nota1').textContent = 'valores de exemplo'; else $('#nota1').remove();
    PV = vitrine(F, $m, $('#c3in'), 'escolha o seu');
    return { duracoes: [
      Math.max(3.2, ler('Três caminhos', F.titulo)),
      Math.max(3.4, ler(txt.join(' '), F.precos_de_exemplo ? 'valores de exemplo' : '') + 0.8),
      Math.max(3.0, ler(fe, Q.k >= 0 ? 'o mais pedido' : '') + 0.6),
      Math.max(3.6, vitrineLer(F, 'escolha o seu')),
    ] };
  },
  quadro(t, F, $m) {
    const { $, $$, p, eo, eo5, eio, eb, cl, ini, lerp } = $m;
    auraQuadro($m, t);
    // 0: title, three bars rising
    $m.cena('#c0', t, 0); const a0 = ini(0);
    foco('#k0', t, a0 + 0.1, 0.6, 20, 8);
    $m.revela('#tit0', t, a0 + 0.3, 0.07);
    $$('#barras i').forEach((b, j) => { const q = eb(p(t, a0 + 0.9 + j * 0.15, 0.6)); b.style.transform = `scaleY(${Math.max(0.001, q)})`; b.style.opacity = cl(q * 3); });
    $('#barras b').style.transform = `scaleX(${eio(p(t, a0 + 0.8, 0.6))})`;
    // 1-2: panels spring up; then the light walks over them and lands (or not)
    $m.cena('#c1', t, 1, 2, { push: 0.02 }); const a1 = ini(1), a2 = ini(2);
    foco('#tit1', t, a1 + 0.05, 0.6, 20, 10);
    const sai = eio(p(t, a2, 0.4)); if (t >= a2) { $('#tit1').style.opacity = 1 - sai; $('#tit1').style.filter = `blur(${(sai * 12).toFixed(1)}px)`; }
    if (t >= a2 + 0.3) foco('#fe1', t, a2 + 0.3, 0.6, 30, 12); else $('#fe1').style.opacity = 0;
    const pns = $$('#pns .pn');
    pns.forEach((d, i) => {
      const ti = a1 + 0.35 + i * 0.22, q = p(t, ti, 0.75), qe = eb(q);
      d.style.opacity = cl(q * 3); d.style.filter = q < 1 ? `blur(${((1 - q) * 14).toFixed(1)}px)` : 'none';
      let s = 1, op = 1;
      const dec = eo(p(t, a2 + 0.9, 0.5));
      if (Q.k >= 0) { if (i === Q.k) s = 1 + 0.05 * dec; else op = 1 - 0.38 * dec; }
      d.style.transform = `translateY(${(1 - qe) * 260}px) scale(${s})`; d.style.zIndex = i === Q.k ? 2 : 1;
      if (q >= 1) d.style.opacity = op;
      [...d.children].filter(c => c.classList.contains('t') || c.classList.contains('ft') || c.classList.contains('ix') || c.classList.contains('hr')).forEach((c, j) => foco(c, t, ti + 0.35 + j * 0.08, 0.5, 20, 8));
      const fi = d.querySelector('.fita'); if (fi) { const qf = eb(p(t, a2 + 1.0, 0.5)); fi.style.opacity = cl(qf * 3); fi.style.transform = `scale(${qf}) rotate(-3deg)`; }
      const lz = d.querySelector('.lz'); lz.style.opacity = i === Q.k ? eo(p(t, a2 + 0.9, 0.5)) * (0.85 + 0.15 * Math.sin(t * 3)) : 0;
    });
    // the light: crosses the three panels, lands on the most chosen one or fades out in the middle
    const cx = i => XS[i] + 133, w0 = a2 - 0.2, u = p(t, w0, 1.1);
    let lx = u < 0.5 ? lerp(cx(0), cx(2), eio(u * 2)) : lerp(cx(2), Q.k >= 0 ? cx(Q.k) : cx(1), eio((u - 0.5) * 2));
    $('#luz').style.left = lx + 'px';
    $('#luz').style.opacity = t < w0 ? 0 : (Q.k >= 0 ? cl((t - w0) * 3) : cl((t - w0) * 3) * (1 - eo(p(t, w0 + 1.1, 0.6))));
    if ($('#nota1')) foco('#nota1', t, a1 + 1.2, 0.5, 10, 6);
    // 3: product
    $m.cena('#c3', t, 3); vitrineQuadro(PV, F, $m, t, ini(3));
  },
});
</script></body></html>
