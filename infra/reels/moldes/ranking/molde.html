<!doctype html><html><head><meta charset="utf-8">
<!-- linguagem visual adaptada do Herk Edit Kit (MIT), estilo vox-explainer: lista numerada com barras em degraus e
     faixa de campeão (rank banner) com pontas recortadas. Portado para o motor (render(t) determinístico). -->
<link rel="stylesheet" href="../motor/motor.css">
<style>
.grade{position:absolute;inset:-6px;pointer-events:none;background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--texto) 6%,transparent) 0 2px,transparent 2px 72px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--texto) 6%,transparent) 0 2px,transparent 2px 72px)}
.kick{position:absolute;left:90px;width:820px;height:52px;line-height:52px;font-family:var(--fb),sans-serif;font-weight:800;font-size:32px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.kick:before{content:'';display:inline-block;width:64px;height:6px;background:var(--destaque);margin-right:22px;vertical-align:middle}
.nt{position:absolute;left:90px;width:800px;top:1418px;height:44px;font-size:30px;font-weight:700;white-space:nowrap}

/* scene 0: TOP n */
#k0{top:410px}
#top{position:absolute;left:110px;width:800px;top:490px;height:400px;line-height:400px;font-size:330px;white-space:nowrap;letter-spacing:-.04em}
#top b{color:var(--destaque);font-weight:inherit}
#titulo{position:absolute;left:90px;width:810px;top:930px;height:330px;font-size:92px}
#risco{position:absolute;left:90px;top:900px;width:300px;height:12px;background:var(--destaque);transform-origin:0 50%}

/* scene 1: the countdown list */
#k1{top:400px}
#lista{position:absolute;left:80px;width:790px;top:480px;height:960px}
.lin{position:absolute;left:0;right:0;height:170px;display:flex;align-items:center;gap:26px}
.lin .o{flex:none;width:130px;height:110px;line-height:110px;font-size:96px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lin .dv{flex:none;width:6px;height:120px;background:var(--texto);opacity:.8}
.lin .cl{flex:1;min-width:0;height:130px;position:relative}
.lin .nm{position:absolute;left:0;top:0;width:100%;height:60px;font-size:46px;font-weight:800;white-space:nowrap}
.lin .tr{position:absolute;left:0;right:0;top:72px;height:52px;border:4px solid var(--texto);background:color-mix(in srgb,var(--texto) 6%,transparent)}
.lin .fi{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--destaque) 55%,var(--fundo));transform-origin:0 50%}
.lin .va{position:absolute;left:8px;top:4px;height:36px;line-height:36px;padding:0 12px;font-size:30px;font-weight:900;white-space:nowrap;color:var(--texto);background:var(--fundo)}
.lin.um .o{color:var(--destaque)}
.lin.um .tr{border-style:dashed;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--texto) 14%,transparent) 0 6px,transparent 6px 18px)}
.lin.um .nm{color:var(--texto2)}

/* scene 2: the champion with the forked ribbon */
#k2{top:400px}
#um{position:absolute;left:90px;width:820px;top:440px;height:420px;line-height:420px;text-align:center;font-size:400px;letter-spacing:-.05em;white-space:nowrap}
#fitaW{position:absolute;left:90px;width:820px;top:880px;height:150px}
#fita{position:absolute;inset:0;background:var(--texto);clip-path:polygon(0 0,7% 50%,0 100%,100% 100%,93% 50%,100% 0)}
#fita i{position:absolute;inset:6px 8px;background:var(--destaque);clip-path:polygon(0 0,7% 50%,0 100%,100% 100%,93% 50%,100% 0)}
#fitaN{position:absolute;left:90px;width:640px;top:44px;height:62px;line-height:62px;text-align:center;font-size:52px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--sobre-destaque)}
#qtd{position:absolute;left:90px;width:820px;top:1070px;height:120px;line-height:120px;text-align:center;font-size:104px;white-space:nowrap}
#gap{position:absolute;left:150px;width:700px;top:1210px;height:80px;text-align:center;font-size:58px;color:var(--destaque);white-space:nowrap;transform:rotate(-2deg)}

/* ad close */
.vend{position:absolute;inset:0}
.pvf{position:absolute;left:100px;width:880px;top:390px;height:620px;border:12px solid var(--c2);overflow:hidden;box-shadow:18px 20px 0 color-mix(in srgb,var(--texto) 16%,transparent)}
.pvf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fita{position:absolute;width:190px;height:52px;background:color-mix(in srgb,var(--c2) 75%,transparent);z-index:2}
.pvp{position:absolute;left:120px;top:960px;height:100px;line-height:100px;font-size:62px;padding:0 34px;white-space:nowrap;transform:rotate(-4deg);z-index:3}
.pvk{position:absolute;left:90px;width:790px;top:1060px;height:72px;font-size:58px;color:var(--destaque);white-space:nowrap}
.pvn{position:absolute;left:90px;width:790px;top:1130px;height:172px;font-size:78px}
.pvd{position:absolute;left:90px;width:790px;top:1300px;height:90px;font-size:38px;font-weight:700}
</style></head><body><div id="palco">
<div class="grade"></div>

<div class="cena" id="c0"><div class="cam full">
 <div id="k0" class="kick t seg"></div>
 <div id="top" class="tit t seg"></div>
 <div id="risco"></div>
 <div id="titulo" class="tit t seg rv"></div>
</div></div>

<div class="cena" id="c1"><div class="cam full">
 <div id="k1" class="kick t seg"></div>
 <div id="lista"></div>
 <div id="nt1" class="nt t t2 seg"></div>
</div></div>

<div class="cena" id="c2"><div class="cam full">
 <div id="k2" class="kick t seg"></div>
 <div id="um" class="tit t seg">#1</div>
 <div id="fitaW"><div id="fita"><i></i></div><div id="fitaN" class="t seg"></div></div>
 <div id="qtd" class="tit t seg"></div>
 <div id="gap" class="mao t seg"></div>
 <div id="nt2" class="nt t t2 seg"></div>
</div></div>

<div class="cena" id="c3"><div class="cam full" id="c3in"></div></div>
</div>
<script src="../motor/motor.js"></script>
<script>
// "Ranking do mês": the top 3 to 5 of the month from real numbers (sales, orders, bookings). The code sorts the items
// by their numbers, sizes every bar against the leader and works out the lead of the first place over the second.
// The list counts down from the last place with the first one hidden; then "#1" lands with the forked ribbon.
const mk = (tag, cls, txt, pai) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (pai) pai.appendChild(e); return e; };
const st = (x, n = 6) => x >= 1 ? 1 : Math.floor(x * n) / n;
const palavras = (...s) => s.filter(Boolean).join(' ').split(/\s+/).filter(w => /\w/.test(w)).length;
const ler = (...s) => 1.3 + 0.25 * palavras(...s);
const KICK = 'tem aqui pra você';
function vitrine(F, $m, pai) {
  const P = F.produto, v = mk('div', 'vend', null, pai);
  const f = mk('div', 'pvf', null, v); $m.filmagem(mk('img', null, null, f), P.foto, 0);
  const f1 = mk('div', 'fita', null, v); Object.assign(f1.style, { left: '70px', top: '370px', transform: 'rotate(-14deg)' });
  const f2 = mk('div', 'fita', null, v); Object.assign(f2.style, { left: '830px', top: '372px', transform: 'rotate(12deg)' });
  mk('div', 'pvk mao t seg', P.convite || KICK, v);
  mk('div', 'pvn tit t seg rv', P.nome, v);
  if (P.preco != null) mk('div', 'pvp chip tit t seg', $m.brl(P.preco, Number.isInteger(P.preco) ? 0 : 2), v);
  if (P.detalhe) mk('div', 'pvd t t2 seg', P.detalhe, v);
  const linhas = P.nome.length > 19 ? 2 : 1, n = v.querySelector('.pvn'), d = v.querySelector('.pvd');
  n.style.height = (linhas * 86) + 'px'; if (d) d.style.top = (1130 + linhas * 86 + 14) + 'px';
  return v;
}
const vitrineLer = F => ler(F.produto.convite || KICK, F.produto.nome, F.produto.detalhe, F.produto.preco != null ? 'R$ 0' : '');
function vitrineQuadro(v, F, $m, t, a) {
  const { p, eb, cl } = $m;
  const f = v.querySelector('.pvf'), q = eb(p(t, a + 0.05, 0.55)); f.style.opacity = cl(q * 3); f.style.transform = `translateY(${(1 - q) * 140}px) rotate(${-1.5 + (1 - q) * 6}deg)`;
  $m.filmagem(v.querySelector('.pvf img'), F.produto.foto, t);
  v.querySelectorAll('.fita').forEach((x, j) => { x.style.opacity = st(p(t, a + 0.45 + j * 0.12, 0.25), 3); });
  $m.entra(v.querySelector('.pvk'), t, a + 0.35, 0.5, 20);
  $m.revela(v.querySelector('.pvn'), t, a + 0.45, 0.06);
  const pp = v.querySelector('.pvp'); if (pp) { const s = eb(p(t, a + 0.8, 0.5)); pp.style.opacity = cl(s * 2); pp.style.transform = `rotate(-4deg) scale(${s})`; }
  const pd = v.querySelector('.pvd'); if (pd) $m.entra(pd, t, a + 1.0, 0.5, 20);
}

let R = [], PV = null, Q = {};
const dois = i => String(i).padStart(2, '0');
function ordenar(F, $m) {
  if (/\d/.test(F.titulo)) $m.erro('titulo: sem algarismos; o código põe o TOP com a quantidade de itens');
  const its = F.itens.map((x, i) => ({ ...x, i })).sort((a, b) => b.quantidade - a.quantidade || a.i - b.i);
  for (let k = 1; k < its.length; k++) if (its[k].quantidade === its[k - 1].quantidade) $m.erro(`empate entre "${its[k - 1].nome}" e "${its[k].nome}": o ranking precisa de números diferentes`);
  if (new Set(F.itens.map(x => x.nome.trim().toLowerCase())).size < F.itens.length) $m.erro('itens repetidos no ranking');
  const casas = its.some(x => !Number.isInteger(x.quantidade)) ? 1 : 0;
  return { its, casas, fmt: v => $m.num(v, casas) + ' ' + F.unidade, max: its[0].quantidade, dif: its[0].quantidade - its[1].quantidade };
}

Motor.molde({
  id: 'ranking', formatos: ['reel', 'story'],
  montar(F, M, $m) {
    const { $ } = $m;
    Q = ordenar(F, $m); const n = Q.its.length, rot = F.rotulo || 'Ranking do mês';
    ['#k0', '#k1', '#k2'].forEach(k => { $(k).textContent = rot; });
    $('#top').append('TOP '); mk('b', null, String(n), $('#top'));
    $('#titulo').textContent = F.titulo;
    // list: last place at the bottom, first at the top (hidden until scene 2)
    const alt = Math.min(190, 900 / n); $('#lista').style.top = (480 + (5 - n) * 70) + 'px';
    Q.its.forEach((x, k) => {
      const l = mk('div', 'lin' + (k === 0 ? ' um' : ''), null, $('#lista')); l.style.top = (k * alt) + 'px';
      mk('div', 'o tit t seg', dois(k + 1), l); mk('div', 'dv', null, l);
      const c = mk('div', 'cl', null, l);
      mk('div', 'nm t seg', k === 0 ? 'Quem será o primeiro?' : x.nome, c);
      const tr = mk('div', 'tr', null, c);
      if (k) { const fi = mk('div', 'fi', null, tr); fi.style.width = (100 * x.quantidade / Q.max) + '%'; const va = mk('div', 'va t seg', Q.fmt(x.quantidade), tr); va.dataset.v = x.quantidade; }
      R.push(l);
    });
    $('#fitaN').textContent = Q.its[0].nome;
    $('#qtd').textContent = Q.fmt(Q.its[0].quantidade);
    $('#gap').textContent = `${$m.num(Q.dif, Q.casas)} a mais que o segundo lugar`;
    if (F.nota) { $('#nt1').textContent = F.nota; $('#nt2').textContent = F.nota; } else { $('#nt1').remove(); $('#nt2').remove(); }
    PV = vitrine(F, $m, $('#c3in'));
    const linhas = Q.its.slice(1).map(x => x.nome + ' ' + Q.fmt(x.quantidade)).join(' ');
    return { duracoes: [ler(rot, 'TOP ' + n, F.titulo) + 0.3,
      Math.max(0.8 + (n - 1) * 0.75 + 1.6, ler(linhas, "Quem será o primeiro?", F.nota) + 0.8),
      Math.max(4.4, ler('#1', Q.its[0].nome, Q.fmt(Q.its[0].quantidade), $('#gap').textContent) + 1.2), vitrineLer(F)] };
  },
  quadro(t, F, $m) {
    const { $, p, eo, eo5, eio, eb, cl, ini } = $m;
    const kick = (sel, a) => { const q = st(p(t, a + 0.05, 0.3), 4); $(sel).style.opacity = q; $(sel).style.transform = `translateX(${(1 - q) * -40}px)`; };
    // 0: TOP n stamps in, title under a stepped rule
    $m.cena('#c0', t, 0); kick('#k0', 0);
    { const q = p(t, 0.2, 0.35), s = q === 0 ? 0 : 1 + 0.9 * Math.pow(1 - eo(q), 2); $('#top').style.opacity = q > 0 ? 1 : 0; $('#top').style.transform = `scale(${s}) rotate(${-3 * (1 - eo(q))}deg)`; }
    $('#risco').style.transform = `scaleX(${st(p(t, 0.55, 0.4), 6)})`;
    $m.revela('#titulo', t, 0.7, 0.06);
    // 1: countdown, from the last place up; bars fill in steps and numbers count
    const a = ini(1); $m.cena('#c1', t, 1); kick('#k1', a);
    const n = R.length;
    R.forEach((l, k) => {
      const ordem = k === 0 ? n - 1 : n - 1 - k, t0 = a + 0.4 + ordem * 0.75;  // the hidden first place comes in last
      const q = eb(p(t, t0, 0.45)); l.style.opacity = cl(q * 3); l.style.transform = `translateX(${(1 - q) * -120}px)`;
      const fi = l.querySelector('.fi'); if (fi) fi.style.transform = `scaleX(${st(p(t, t0 + 0.2, 0.55), 7)})`;
      const va = l.querySelector('.va'); if (va) { $m.conta(va, t, t0 + 0.2, 0.55, +va.dataset.v, Q.fmt); va.style.opacity = cl(p(t, t0 + 0.2, 0.2)); }
      if (k === 0) { const tr = l.querySelector('.tr'); tr.style.opacity = 0.5 + 0.5 * Math.round((Math.sin(t * 9) + 1) / 2); }
    });
    if ($('#nt1')) $('#nt1').style.opacity = eo(p(t, a + 0.6, 0.4));
    // 2: #1 pops, the ribbon wipes open from the middle (stepped), the count and the lead
    const b = ini(2); $m.cena('#c2', t, 2); kick('#k2', b);
    { const q = eb(p(t, b + 0.15, 0.5)); $('#um').style.opacity = cl(q * 3); $('#um').style.transform = `scale(${0.4 + 0.6 * q}) rotate(${(1 - q) * -12}deg)`; }
    { const q = st(p(t, b + 0.6, 0.5), 7); $('#fita').style.transform = `scaleX(${q})`; $('#fitaN').style.opacity = cl((q - 0.7) * 4); $('#fitaW').style.transform = `rotate(${-1.5 * q}deg)`; }
    $m.entra('#qtd', t, b + 1.1, 0.4, 30); $m.conta('#qtd', t, b + 1.1, 0.8, Q.its[0].quantidade, Q.fmt);
    $m.entra('#gap', t, b + 1.8, 0.4, 20);
    if ($('#nt2')) $('#nt2').style.opacity = eo(p(t, b + 1.0, 0.4));
    // 3: product
    $m.cena('#c3', t, 3); vitrineQuadro(PV, F, $m, t, ini(3));
  },
});
</script></body></html>
