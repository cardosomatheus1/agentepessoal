#s6{top:650px}
#s6 .a{font-size:96px;font-weight:800;color:#fbeee0;line-height:1.15}
#s6 .b{font-family:D;font-size:220px;font-weight:900;color:#5fd35d;margin-top:30px}
#cta{top:430px}
#cta .k{font-size:58px;font-weight:700;color:#fbeee0}
#cta .t{font-family:D;font-size:150px;font-weight:900;color:#ff7aa8;line-height:1;margin:20px 0 50px}
#cta .b{display:inline-block;background:#fbeee0;color:#2b1710;font-size:64px;font-weight:900;padding:40px 80px;border-radius:90px}
#cta img{display:block;width:560px;margin:90px auto 10px}
#cta .h{font-size:48px;font-weight:700;color:#fbeee0}
.nota{color:#fbeee0}
</style></head><body>
<div id="bg"></div><div id="dots"></div>
<img class="logo" id="logo" src="../base/logo.png">
<div id="s0" class="abs"><div class="a">LEITE CONDENSADO</div><div class="b">subiu</div></div>
<svg id="seta" viewBox="0 0 200 300"><path id="setap" d="M100 290 L100 40 M40 100 L100 30 L160 100" stroke="#ff7aa8" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div id="s1" class="abs"><div class="q">E o seu brigadeiro<br>continua a…</div></div>
<div id="brig"></div>
<div id="tagw"><div id="fio"></div><div id="tag"><div class="f"></div><div class="v">R$ 2,00</div><div class="l">por unidade</div></div></div>
<div id="gt" class="abs">Custo de 1 brigadeiro</div>
<svg id="graf" viewBox="0 0 900 760">
 <line x1="60" y1="680" x2="860" y2="680" stroke="#fbeee055" stroke-width="4"/>
 <polygon id="area" fill="#5fd35d33"/>
 <line id="preco" x1="60" y1="100" x2="860" y2="100" stroke="#fbeee0" stroke-width="5" stroke-dasharray="18 14"/>
 <text id="precot" x="860" y="70" text-anchor="end" fill="#fbeee0" font-size="40" font-weight="700" font-family="I">preço R$ 2,00</text>
 <polyline id="linha" fill="none" stroke="#ff7aa8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <circle id="p0" r="20" fill="#ff7aa8"/><circle id="p1" r="20" fill="#ff7aa8"/>
 <text id="t0" fill="#fbeee0" font-size="56" font-weight="800" font-family="I" text-anchor="middle"></text>
 <text id="t1" fill="#ff7aa8" font-size="64" font-weight="900" font-family="I" text-anchor="middle"></text>
 <text id="lu" x="460" y="250" fill="#5fd35d" font-size="44" font-weight="800" font-family="I" text-anchor="middle">seu lucro</text>
 <text x="90" y="735" fill="#fbeee099" font-size="36" font-family="I">começo do ano</text>
 <text x="840" y="735" fill="#fbeee099" font-size="36" font-family="I" text-anchor="end">hoje</text>
</svg>
<div id="s4" class="abs"><div class="l">seu lucro por brigadeiro</div><div id="velho">R$ 1,20<div id="risco"></div></div><div id="novo">R$ 0,90</div></div>
<div id="s5" class="abs"><div class="t">Em um cento de brigadeiros</div></div>
<svg id="cento" viewBox="0 0 700 700"></svg>
<div id="menos">-R$ 30</div>
<div id="s6" class="abs"><div class="a">Reajustar<br>não é ganância.</div><div class="b">É conta.</div></div>
<div id="cta" class="abs"><div class="k">Preço certo pro seu doce</div><div class="t">Calculadora<br>grátis</div><div class="b">Link na bio</div><img src="../base/logo.png"><div class="h">@raiz.connect</div></div>
<div class="nota" id="nota">valores de exemplo</div>
<script src="../base/lib.js"></script><script src="tempos.js"></script>
<script>
// granulado de fundo
const cores=['#ff7aa8','#fbeee0','#5fd35d','#ffd166','#7ec8ff'];let h='';
for(let i=0;i<46;i++){const x=(i*233)%1080,y=(i*397)%1920;h+=`<div class="gr" data-i="${i}" style="left:${x}px;top:${y}px;width:${14+i%3*4}px;height:${14+i%3*4}px;background:${cores[i%5]};opacity:.18"></div>`}
$('dots').innerHTML=h;
// cento
let c='';for(let i=0;i<100;i++){const x=35+(i%10)*70,y=35+Math.floor(i/10)*70;c+=`<circle class="cb" cx="${x}" cy="${y}" r="27" fill="#5a2c1a" stroke="#ff7aa8" stroke-width="0"/>`}
$('cento').innerHTML=c;
const X0=60,X1=860,Y=v=>680-v/2.2*580;
const pts=[[0,0.80],[0.25,0.84],[0.5,0.93],[0.75,1.02],[1,1.10]];
window.render=function(t){
  document.querySelectorAll('.gr').forEach((e,i)=>{e.style.transform=`translateY(${-((t*(20+i%4*10))%400)}px)`});
  // cena 0
  let a=vis(t,0);set($('s0'),a.v,(1-a.i)*80);
  const ar=eo(p(t,0.5,0.7));$('seta').style.opacity=a.v;$('seta').style.transform=`translateY(${(1-ar)*300}px)`;
  // cena 1
  a=vis(t,1);set($('s1'),a.v,(1-a.i)*60);
  const bi=eb(p(t,S[1]+0.1,0.5));set($('brig'),a.v,0,bi);
  const sw=p(t,S[1]+0.4,3);$('tagw').style.opacity=a.v;
  $('tag').style.transform=`translateY(${(1-eo(p(t,S[1]+0.3,0.5)))*-400}px) rotate(${18*Math.exp(-sw*3)*Math.sin(sw*18)}deg)`;
  // gráfico cenas 2-3
  a=vis(t,2,3);$('graf').style.opacity=a.v;$('gt').style.opacity=a.v;
  const d1=eio(p(t,S[3],1.6));
  const Xp=x=>X0+x*(X1-X0);
  const vis_pts=[];for(const [x,v] of pts){if(x<=d1+1e-6)vis_pts.push([Xp(x),Y(v)])}
  // ponto interpolado
  let k=0;while(k<pts.length-1&&pts[k+1][0]<d1)k++;
  if(k<pts.length-1){const [xa,va]=pts[k],[xb,vb]=pts[k+1],f=(d1-xa)/(xb-xa);vis_pts.push([Xp(d1),Y(va+(vb-va)*cl(f))])}
  $('linha').setAttribute('points',vis_pts.map(q=>q.join(',')).join(' '));
  const last=vis_pts[vis_pts.length-1];
  $('p0').setAttribute('cx',Xp(0));$('p0').setAttribute('cy',Y(0.8));$('p0').style.opacity=eo(p(t,S[2]+0.3,0.3));
  $('t0').setAttribute('x',Xp(0)+90);$('t0').setAttribute('y',Y(0.8)+90);$('t0').textContent='R$ 0,80';$('t0').style.opacity=eo(p(t,S[2]+0.5,0.3));
  $('p1').setAttribute('cx',last[0]);$('p1').setAttribute('cy',last[1]);$('p1').style.opacity=t>S[3]?1:0;
  $('t1').setAttribute('x',Math.min(last[0],770));$('t1').setAttribute('y',last[1]+100);$('t1').textContent=t>S[3]?brl(0.8+0.3*d1):'';
  const areaPts=[[X0,Y(2)],...vis_pts.length?[[Xp(0),Y(2)]]:[]];
  const poly=[[X0,Y(2)],[last[0],Y(2)],...vis_pts.slice().reverse()];
  $('area').setAttribute('points',(eo(p(t,S[2]+0.6,0.4))>0?poly:[]).map(q=>q.join(',')).join(' '));
  $('area').style.opacity=eo(p(t,S[2]+0.6,0.4));$('lu').style.opacity=eo(p(t,S[2]+0.8,0.4));
  // cena 4
  a=vis(t,4);set($('s4'),a.v,(1-a.i)*60);
  $('risco').style.width=(eo(p(t,S[4]+1.2,0.4))*105)+'%';
  const nv=eb(p(t,S[4]+1.8,0.5));$('novo').style.opacity=p(t,S[4]+1.8,0.1);$('novo').style.transform=`scale(${nv})`;
  // cena 5
  a=vis(t,5);set($('s5'),a.v);$('cento').style.opacity=a.v;
  document.querySelectorAll('.cb').forEach((e,i)=>{const q=eb(p(t,S[5]+i*0.012,0.3));e.setAttribute('r',27*q);
    const hit=p(t,S[5]+1.2+i*0.008,0.2);e.setAttribute('fill',hit>0.5?'#ff5a5f':'#5a2c1a')});
  const mq=eb(p(t,S[5]+2.2,0.4));$('menos').style.opacity=a.v*cl(mq*3);$('menos').style.transform=`scale(${0.6+0.4*mq}) rotate(-4deg)`;
  // cena 6
  a=vis(t,6);$('s6').style.opacity=a.v;
  $('s6').querySelector('.a').style.transform=`translateY(${(1-a.i)*60}px)`;
  const bq=eb(p(t,S[6]+1.2,0.4));$('s6').querySelector('.b').style.opacity=cl(bq*3);$('s6').querySelector('.b').style.transform=`scale(${0.5+0.5*bq})`;
  // cta
  const ci=eo(p(t,S[7],0.5));set($('cta'),ci,(1-ci)*100);
  const pu=t>S[7]+0.8?(Math.sin((t-S[7])*5)+1)/2:0;$('cta').querySelector('.b').style.transform=`scale(${1+0.05*pu})`;
  $('logo').style.opacity=1-ci;$('nota').style.opacity=(t>S[2]&&t<S[7])?0.75:0;
};
render(0);
</script></body></html>
