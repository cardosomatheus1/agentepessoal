<script src="../base/lib.js"></script><script src="tempos.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
for(let i=0;i<14;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('r',6+i%4*3);c.setAttribute('fill','#ffffff33');c.id='b'+i;$('bolhas').appendChild(c)}
let ph='';for(let i=0;i<12;i++){ph+=`<div class="w pc" style="top:${1180+Math.floor(i/4)*120}px;left:${80+(i%4)*240}px;right:auto;font-size:80px;color:#c27cff">${i+1}x</div>`}
$('parc').innerHTML=ph;
function slam(e,t0,o=1){const q=p(t0,0,0.18);e.style.opacity=(q>0?1:0)*o;e.style.transform=`scale(${lerp(2.4,1,eo(q))})`}
const TOP=640,BOT=1220,H=BOT-TOP;
window.render=function(t){
  // fundo por cena
  const cor=t<S[1]?'#47b346':t<S[2]?'#0a0a0a':t<S[6]?'#3b1450':t<S[7]?'#0a0a0a':'#47b346';
  const fl=Math.max(...[1,2,6,7].map(k=>t>=S[k]?1-p(t,S[k],0.12):0));
  $('bg').style.background=cor;$('bg').style.boxShadow=`inset 0 0 0 2000px rgba(255,255,255,${fl*0.5})`;
  // cena 0
  const o0=t<S[1]?1:0;[0,0.35,0.8,1.2].forEach((d,k)=>slam($('w'+k),t-d,o0));
  $('w1').style.transform+=` rotate(-3deg)`;
  // cena 1
  const o1=t>=S[1]&&t<S[2]?1:0;[0,0.25,0.75].forEach((d,k)=>slam($('w'+(4+k)),t-S[1]-d,o1));
  document.querySelectorAll('.pc').forEach((e,i)=>{const q=p(t,S[1]+0.9+i*0.05,0.12);e.style.opacity=o1*(q>0?0.25+0.75*((i*7+Math.floor(t*12))%5===0):0);e.style.transform=`scale(${lerp(1.8,1,eo(q))})`});
  // copo cenas 2-5
  const cv=t>=S[2]&&t<S[6];const ci=eb(p(t,S[2],0.5));
  $('copo').style.opacity=cv?1:0;$('copo').style.transformOrigin='540px 930px';$('copo').style.transform=`scale(${cv?ci:1})`;
  $('rot').style.opacity=cv?eo(p(t,S[2]+0.2,0.4)):0;
  const lv=eio(p(t,S[3]+0.2,1.4))*9.5/12;
  $('liq').setAttribute('y',BOT-H*lv);$('liq').setAttribute('height',H*lv);
  // sobra: aparece na cena 4, encolhe na 5
  let sv=eo(p(t,S[4],0.5))*2.5/12;
  const corte=[0,1,2].reduce((a,k)=>a+eio(p(t,S[5]+0.3+k*1.0,0.5)),0);
  sv*=1-0.28*corte;
  const ys=BOT-H*lv-H*sv;$('sob').setAttribute('y',ys);$('sob').setAttribute('height',H*sv);
  $('tl').setAttribute('y',BOT-H*lv/2+18);$('tl').textContent=t>S[3]?brl(9.5*eio(p(t,S[3]+0.2,1.4))):'';
  $('ts').setAttribute('y',ys+H*sv/2+17);$('ts').textContent=(t>S[4]+0.3&&t<S[5]+0.3)?brl(2.5):'';
  for(let i=0;i<14;i++){const b=$('b'+i);const yy=BOT-((t*90+i*53)%(H*lv+1));b.setAttribute('cx',360+(i*67)%360);b.setAttribute('cy',yy)}
  // info
  let inf='';if(t>=S[3]&&t<S[4])inf='<span style="color:#c27cff">'+brl(9.5)+'</span><span class="s">açaí, complementos, copo e colher</span>';
  else if(t>=S[4]&&t<S[5])inf='<span style="color:#47b346">sobram '+brl(2.5)+'</span>';
  $('info').innerHTML=inf;$('info').style.opacity=inf?1:0;
  [0,1,2].forEach(k=>{const q=eb(p(t,S[5]+0.3+k*1.0,0.35));const e=$('g'+k);e.style.opacity=(t>=S[5]&&t<S[6])?cl(q*3):0;e.style.transform=`scale(${q}) rotate(${[-4,3,-2][k]}deg)`});
  // cena 6
  const o6=t>=S[6]&&t<S[7]?1:0;[0,0.3,0.7].forEach((d,k)=>slam($('w'+(7+k)),t-S[6]-d,o6));
  // cta
  const c=eo(p(t,S[7],0.4));set($('cta'),t>=S[7]?c:0,(1-c)*100);
  const pu=t>S[7]+0.8?(Math.sin((t-S[7])*5)+1)/2:0;$('cta').querySelector('.b').style.transform=`scale(${1+0.05*pu})`;
  $('lg').style.opacity=t>=S[7]?0:1;$('nota').style.opacity=(t>S[2]&&t<S[6])?0.75:0;
};
render(0);
</script></body></html>
